let PREV_PT_MAP = null;

function isChainRoot(ptid) {
  return !prevPtid(ptid);
}

function prevPtid(ptid) {
  if (!PREV_PT_MAP) {
    PREV_PT_MAP = new Map;
    for (const p of AP.pts || []) if (p.nextptid) PREV_PT_MAP.set(p.nextptid, p.id);
  }
  return PREV_PT_MAP.get(ptid) || '';
}

function blueprintableParts() {
  const researchable = new Set((AP.partresearch || []).map(p => p.ptid));
  return Object.values(PT_INDEX).filter(p => researchable.has(p.id)).map(p => Object.assign({}, p, {
    obtainable: !hasNoBlueprint(p.id)
  }));
}

function sortByChainOrder(list) {
  const listIds = new Set(list.map(p => p.id));
  const chainGroups = new Map;
  const seen = new Set;
  for (const p of list) {
    if (seen.has(p.id)) continue;
    const chain = chainOf(p.id);
    const root = chain[0];
    if (!chainGroups.has(root)) chainGroups.set(root, chain.filter(id => listIds.has(id)));
    for (const id of chain) seen.add(id);
  }
  const roots = Array.from(chainGroups.keys()).sort((a, b) => (PT_INDEX[a].name || '').localeCompare(PT_INDEX[b].name || ''));
  const result = [];
  for (const root of roots) for (const id of chainGroups.get(root)) result.push(PT_INDEX[id]);
  return result;
}

// The game keeps a "what can I research next" marker next to the FINISHED
// ladder of each blueprint (seen in real saves):
//   - not maxed yet : one LEVELUP entry at lvl = top + 1 (before = itself, top)
//   - maxed         : no marker; instead the NEXT part in the chain gets a
//                     REMODEL entry at lvl 1 (before = this part, its max)
// Without these the game shows the research as finished and won't let you
// upgrade it. This rebuilds the markers for every blueprint from the
// FINISHED entries. It is only run after the editor changes research.
function normalizeResearchMarkers(research) {
  const MARKERS = new Set([ 'LEVELUP', 'REMODEL' ]);
  const byPt = new Map;
  for (const r of research) {
    if (!byPt.has(r.ptid)) byPt.set(r.ptid, []);
    byPt.get(r.ptid).push(r);
  }
  const topOf = ptid => {
    let t = 0;
    for (const r of byPt.get(ptid) || []) if (r.research_type === 'FINISHED' && r.lvl > t) t = r.lvl;
    return t;
  };
  const researchable = new Set((AP.partresearch || []).map(p => p.ptid));
  const want = new Map;
  for (const ptid of researchable) {
    const rec = PT_INDEX[ptid];
    if (!rec) continue;
    const max = maxPartLevel(rec) || 1;
    const top = topOf(ptid);
    if (top > 0 && top < max) {
      // the two starter weapons' level-2 entries point at nothing (seen in a fresh game save)
      const starter = top === 1 && (ptid === 'PT_ARM_WP005_001' || ptid === 'PT_ARM_WP006_001');
      want.set(ptid, { ptid, lvl: top + 1, research_type: 'LEVELUP', receive_type: 'UNKNOWN', is_announced: 0, is_checked: 1, before_ptid: starter ? '' : ptid, before_lvl: starter ? 0 : top });
    } else if (top === 0) {
      const prev = prevPtid(ptid);
      if (prev && researchable.has(prev) && PT_INDEX[prev]) {
        const pmax = maxPartLevel(PT_INDEX[prev]) || 1;
        if (topOf(prev) >= pmax) want.set(ptid, { ptid, lvl: 1, research_type: 'REMODEL', receive_type: 'UNKNOWN', is_announced: 0, is_checked: 1, before_ptid: prev, before_lvl: pmax });
        else want.set(ptid, null);
      }
      // chain roots with nothing researched: leave whatever the game wrote
    } else {
      want.set(ptid, null);
    }
  }
  let changed = 0;
  for (const [ptid, w] of want) {
    const cur = (byPt.get(ptid) || []).filter(r => MARKERS.has(r.research_type));
    // an existing marker of the right kind at the right level is kept as the game wrote it
    const same = w ? cur.length === 1 && cur[0].research_type === w.research_type && cur[0].lvl === w.lvl : cur.length === 0;
    if (same) continue;
    for (let i = research.length - 1; i >= 0; i--) if (research[i].ptid === ptid && MARKERS.has(research[i].research_type)) research.splice(i, 1);
    if (w) research.push(w);
    changed++;
  }
  return changed;
}

function wireBlueprints() {
  const research = SAVE.user_research;
  let researchDirty = false;
  function entryFor(ptid) {
    let best = null;
    for (const r of research) {
      if (r.ptid === ptid && r.research_type === 'FINISHED' && (!best || r.lvl > best.lvl)) best = r;
    }
    return best;
  }
  function isUnlocked(ptid) {
    return !!entryFor(ptid);
  }
  const STARTER_PTIDS = new Set([ 'PT_ARM_WP005_001', 'PT_ARM_WP006_001' ]);
  // blueprints every new game starts with (master_part_research.is_initial)
  const INITIAL_PTIDS = new Set((AP.partresearch || []).filter(r => Number(r.is_initial) === 1).map(r => r.ptid));
  if (!INITIAL_PTIDS.size) for (const id of STARTER_PTIDS) INITIAL_PTIDS.add(id);
  function removeEntry(ptid) {
    researchDirty = true;
    for (let i = research.length - 1; i >= 0; i--) {
      if (research[i].ptid === ptid) research.splice(i, 1);
    }
  }
  function writeLadder(ptid, lvl) {
    removeEntry(ptid);
    const rec = PT_INDEX[ptid];
    const top = Math.max(1, Math.min(lvl || 1, maxPartLevel(rec) || 1));
    const prev = prevPtid(ptid);
    const prevTop = prev ? maxPartLevel(PT_INDEX[prev]) : 0;
    for (let l = 1; l <= top; l++) {
      let bp, bl;
      if (l === 1) {
        bp = prev;
        bl = prev ? prevTop : 0;
      } else if (l === 2 && STARTER_PTIDS.has(ptid)) {
        bp = '';
        bl = 0;
      } else {
        bp = ptid;
        bl = l - 1;
      }
      research.push({
        ptid: ptid,
        lvl: l,
        research_type: 'FINISHED',
        receive_type: l === top ? 'CHARGE' : 'FINISHED',
        is_announced: 1,
        is_checked: 1,
        before_ptid: bp,
        before_lvl: bl
      });
    }
  }
  function addEntry(ptid) {
    if (!isUnlocked(ptid)) writeLadder(ptid, 1);
  }
  function setUnlocked(ptid, on) {
    const chain = chainOf(ptid);
    const idx = chain.indexOf(ptid);
    if (on) {
      for (let i = 0; i <= idx; i++) {
        if (i < idx) writeLadder(chain[i], maxPartLevel(PT_INDEX[chain[i]])); else if (!isUnlocked(chain[i])) writeLadder(chain[i], 1);
      }
    } else {
      for (let i = idx; i < chain.length; i++) {
        // starting blueprints are never removed; they go back to their first level
        if (INITIAL_PTIDS.has(chain[i])) writeLadder(chain[i], 1); else removeEntry(chain[i]);
      }
      if (INITIAL_PTIDS.has(ptid)) toast(`${(PT_INDEX[ptid] || {}).name || ptid} is a starting blueprint, so it was reset to +0 instead of removed.`);
    }
  }
  function setLevel(ptid, lvl) {
    if (!isUnlocked(ptid)) return null;
    const rec = PT_INDEX[ptid], max = maxPartLevel(rec) || 1;
    if (lvl < max) {
      // the next part in the upgrade chain can only be researched from a maxed part
      const chain = chainOf(ptid);
      const later = chain.slice(chain.indexOf(ptid) + 1).find(id => isUnlocked(id));
      if (later) return `${rec.name} has to stay maxed while ${(PT_INDEX[later] || {}).name || later} (the next part in its upgrade chain) is researched. Untick that first.`;
    }
    writeLadder(ptid, lvl);
    return null;
  }
  const RESEARCH_SLOTS = [ 'Weapon', 'Head', 'Chest (TOPS)', 'Pants (BTM)' ];
  let researchSubTab = RESEARCH_SUBTAB_STATE.current || 'Weapon';
  function renderList(filter) {
    if (researchDirty) {
      normalizeResearchMarkers(research);
      researchDirty = false;
    }
    let parts = blueprintableParts().filter(p => !filter || norm(p.name).includes(norm(filter)));
    document.getElementById('bp-count').textContent = `${parts.length} shown / ${blueprintableParts().length} total`;
    const allSuspicious = blueprintableParts().filter(p => p.obtainable === false && isUnlocked(p.id));
    document.getElementById('bp-suspicious-summary').textContent = allSuspicious.length ? `⚠ ${allSuspicious.length} researched part${allSuspicious.length === 1 ? '' : 's'} with no blueprint: ${allSuspicious.map(p => p.name).join(', ')}` : '';
    const bySlot = {};
    for (const p of parts) {
      (bySlot[partSlotLabel(p)] = bySlot[partSlotLabel(p)] || []).push(p);
    }
    document.getElementById('bp-subtabs').innerHTML = RESEARCH_SLOTS.map(slotName => `<button class="tabbtn ${researchSubTab === slotName ? 'active' : ''}" data-bp-subtab="${slotName}">${slotName} (${(bySlot[slotName] || []).length})</button>`).join('');
    function renderSlotGroup(slotName) {
      if (!bySlot[slotName] || !bySlot[slotName].length) return '<div style="padding:10px; color:var(--text-faint); font-size:12px;">No matches.</div>';
      const byFam = {};
      for (const p of bySlot[slotName]) {
        (byFam[partFamily(p)] = byFam[partFamily(p)] || []).push(p);
      }
      const famNames = Object.keys(byFam).sort();
      return famNames.map(fam => `\n          <div style="margin-bottom:8px;">\n            <div style="font-size:10.5px; color:var(--text-faint); margin-bottom:3px;">${fam}</div>\n            <div class="listBlock">\n              ${sortByChainOrder(byFam[fam]).map(p => {
        const unlocked = isUnlocked(p.id);
        const e = entryFor(p.id);
        const maxLvl = maxPartLevel(p);
        const dispMax = maxDisplayLevel(p);
        return `<div class="listRow">\n                  <input type="checkbox" data-bp="${p.id}" ${unlocked ? 'checked' : ''}>\n                  <div class="name">${escapeHtml(p.name)} ${p.is_limitbreak ? '<span class="badge lb">Uncap · in-game +' + dispMax + '</span>' : `<span class="badge">in-game +${dispMax}</span>`} ${isPsOnlyPart(p.id) ? '<span class="badge" title="PlayStation-only; a PC game needs to be modded to have it">PS only</span>' : ''} ${hasNoBlueprint(p.id) ? '<span class="badge" style="background:var(--accent); color:#fff;">(THIS HAS NO BLUEPRINT)</span>' : ''}</div>\n                  ${unlocked ? `<span style="font-size:11px; color:var(--text-dim);">+</span><input type="number" class="bp-level" data-bp-level="${p.id}" min="${minDisplayLevel(p)}" max="${dispMax}" value="${displayFromRaw(p, e ? e.lvl : 1)}" style="width:60px;" title="In-game level, +${minDisplayLevel(p)} to +${dispMax}">` : ''}\n                  <div class="id">${p.id}</div>\n                </div>`;
      }).join('')}\n            </div>\n          </div>`).join('');
    }
    document.getElementById('bp-slot-content').innerHTML = renderSlotGroup(researchSubTab);
    document.querySelectorAll('[data-bp-subtab]').forEach(btn => {
      btn.addEventListener('click', () => {
        researchSubTab = btn.dataset.bpSubtab;
        RESEARCH_SUBTAB_STATE.current = researchSubTab;
        renderList(document.getElementById('bp-filter').value);
      });
    });
    document.querySelectorAll('[data-bp]').forEach(cb => {
      cb.addEventListener('change', () => {
        setUnlocked(cb.dataset.bp, cb.checked);
        syncStampFromResearch();
        renderList(document.getElementById('bp-filter').value);
      });
    });
    document.querySelectorAll('[data-bp-level]').forEach(inp => {
      inp.addEventListener('change', () => {
        // the box shows the in-game level (+n); the save stores the raw level
        const rec = PT_INDEX[inp.dataset.bpLevel];
        const lo = minDisplayLevel(rec), hi = maxDisplayLevel(rec);
        let v = parseInt(inp.value, 10);
        if (isNaN(v)) v = lo;
        if (v > hi) toast(`Clamped to this part's max (+${hi})`);
        if (v < lo) toast(`Clamped to this part's lowest level (+${lo})`);
        v = Math.max(lo, Math.min(hi, v));
        const err = setLevel(inp.dataset.bpLevel, rawFromDisplay(rec, v));
        if (err) toast(err, true);
        // re-render so the "next level" markers and research stamps follow
        syncStampFromResearch();
        renderList(document.getElementById('bp-filter').value);
      });
    });
  }
  renderList('');
  wireStamp();
  document.getElementById('bp-filter').addEventListener('input', e => renderList(e.target.value));
  const psBox = document.getElementById('bp-include-ps');
  psBox.checked = RESEARCH_FORM.includePs;
  psBox.addEventListener('change', () => { RESEARCH_FORM.includePs = psBox.checked; toast(psBox.checked ? 'Max all / +5 now include PS-only blueprints (only for PC games modded to have them)' : 'Max all / +5 skip PS-only blueprints again'); });
  document.getElementById('bp-max-all').addEventListener('click', () => {
    const filter = document.getElementById('bp-filter').value;
    const shown = blueprintableParts().filter(p => (!filter || norm(p.name).includes(norm(filter))) && partSlotLabel(p) === researchSubTab);
    const parts = shown.filter(p => isResearchBulkAllowed(p.id));
    const done = new Set;
    for (const p of parts) {
      for (const id of chainOf(p.id)) {
        if (!done.has(id) && isResearchBulkAllowed(id)) {
          writeLadder(id, maxPartLevel(PT_INDEX[id]));
          done.add(id);
        }
        if (id === p.id) break;
      }
    }
    syncStampFromResearch();
    renderList(filter);
    const skipped = shown.length - parts.length;
    toast(`Maxed ${parts.length} visible ${researchSubTab} research item${parts.length === 1 ? '' : 's'}${skipped ? ` (skipped ${skipped} ${RESEARCH_FORM.includePs ? 'with no blueprint' : 'PS-only / no blueprint'})` : ''}`);
  });
  document.getElementById('bp-plus5-all').addEventListener('click', () => {
    // "+5" is the in-game number. Normal parts top out at +4, so they are
    // maxed; Uncap (limit break) parts are set to +5, their first level.
    // Earlier parts in the same upgrade chain have to be maxed for the game to
    // accept the later one, so they are maxed rather than set to +5.
    const filter = document.getElementById('bp-filter').value;
    const shown = blueprintableParts().filter(p => (!filter || norm(p.name).includes(norm(filter))) && partSlotLabel(p) === researchSubTab);
    const parts = shown.filter(p => isResearchBulkAllowed(p.id));
    const targets = new Map;
    for (const p of parts) {
      const chain = chainOf(p.id);
      const idx = chain.indexOf(p.id);
      chain.slice(0, idx).forEach(id => { if (isResearchBulkAllowed(id)) targets.set(id, maxPartLevel(PT_INDEX[id]) || 1); });
      if (!targets.has(p.id)) targets.set(p.id, rawFromDisplay(PT_INDEX[p.id], 5));
    }
    let changed = 0, alreadyAbove = 0;
    for (const [id, target] of targets) {
      const cur = entryFor(id) ? entryFor(id).lvl : 0;
      if (cur > target) { alreadyAbove++; continue; }
      if (cur !== target) { writeLadder(id, target); changed++; }
    }
    syncStampFromResearch();
    renderList(filter);
    const skipped = shown.length - parts.length;
    toast(`Set ${changed} visible ${researchSubTab} research item${changed === 1 ? '' : 's'} to +5 (normal parts max out at +4)${alreadyAbove ? ` (left ${alreadyAbove} already higher untouched)` : ''}${skipped ? ` (skipped ${skipped} ${RESEARCH_FORM.includePs ? 'with no blueprint' : 'PS-only / no blueprint'})` : ''}`);
  });
  document.getElementById('bp-remove-all').addEventListener('click', () => {
    research.length = 0;
    // every new game starts with these researched; keep them at their first level
    for (const id of INITIAL_PTIDS) if (PT_INDEX[id]) writeLadder(id, 1);
    researchDirty = true;
    syncStampFromResearch();
    renderList(document.getElementById('bp-filter').value);
    toast(`All research removed (starting blueprints kept at +0)`);
  });
}

// ---------------------------------------------------------------------------
// QUESTS tab
// Offline saves keep quests in soul.quest:
//   ord  : quests currently taken   {qid, prgnow, prgmax, timer, expire, term, rwd, order}
//   user : history for every offline quest {qid, ordcnt (times taken), clrcnt (times cleared)}
//   dis/dfs/dss : per-quest extra data keyed by qid (left alone)
//   hash : game checksum of unknown input (left alone)
// SAVE.soul.quest is the same object the save is rebuilt from, so edits here
// ship with Download .sav.
// ---------------------------------------------------------------------------

const QUEST_FORM = { histFilter: 'all', histSearch: '', addSearch: '', showLocked: false, open: 'active' };
let QUEST_STATE = { root: null, original: null, lastMsg: '' };

function questData() {
  const soul = SAVE && SAVE.soul;
  const q = soul && soul.quest;
  if (!q || typeof q !== 'object' || Array.isArray(q)) return null;
  if (!Array.isArray(q.ord)) q.ord = [];
  if (!Array.isArray(q.user)) q.user = [];
  return q;
}

// The game writes an empty quest list as {} (a list with quests as [...]);
// the tab works on an array, so put {} back before a download.
function questOrdForSave() {
  const q = SAVE && SAVE.soul && SAVE.soul.quest;
  if (q && Array.isArray(q.ord) && !q.ord.length) q.ord = {};
}
function questSyncState() {
  if (QUEST_STATE.root !== RAW_SAV_ROOT) {
    const q = questData();
    QUEST_STATE = { root: RAW_SAV_ROOT, original: q ? JSON.parse(JSON.stringify({ ord: q.ord, user: q.user })) : null, lastMsg: '' };
  }
}

let QUEST_META = null;
function questMeta() {
  if (QUEST_META && QUEST_META.ap === AP) return QUEST_META;
  const byId = {}, pText = {}, pDesc = {}, rwd = {}, cats = {};
  for (const m of arr(AP && AP.quests)) byId[m.qid] = m;
  for (const r of arr(AP && AP.questParamText)) (pText[r.qid] = pText[r.qid] || [])[r.no] = r.val;
  for (const r of arr(AP && AP.questParamDesc)) (pDesc[r.qid] = pDesc[r.qid] || [])[r.no] = r.val;
  for (const r of arr(AP && AP.rewards)) rwd[r.rwdid] = r;
  for (const r of arr(AP && AP.questCats)) cats[r.catid] = resolveName(r.name) || r.catid.replace(/^QUESTCAT_/, '');
  QUEST_META = { ap: AP, byId, pText, pDesc, rwd, cats };
  return QUEST_META;
}

function questFill(text, params) {
  if (!text) return '';
  return text.replace(/#(\d+)/g, (m, n) => {
    const key = params && params[parseInt(n, 10)];
    if (!key) return m;
    return resolveName(key) || String(key).replace(/^[A-Z_]+\.TXT_/, '');
  }).replace(/##/g, '#'); // the game escapes a literal # as ##
}
function questName(qid) {
  const M = questMeta(), m = M.byId[qid];
  if (!m) return qid;
  const t = resolveName(m.name);
  return t ? questFill(t, M.pText[qid]).replace(/\s+/g, ' ').trim() : qid;
}
function questDesc(qid) {
  const M = questMeta(), m = M.byId[qid];
  if (!m) return '';
  const t = resolveName(m.desc);
  return t ? questFill(t, M.pDesc[qid]).replace(/\s+/g, ' ').trim() : '';
}
function questReward(rwdid) {
  if (!rwdid) return '';
  const r = questMeta().rwd[rwdid];
  if (!r) return rwdid;
  const n = r.num > 1 ? ` ×${Number(r.num).toLocaleString()}` : '';
  if (r.type === 'MONEY') return `${Number(r.num).toLocaleString()} Kill Coins`;
  const id = r.val0 || '';
  let nm = null;
  if (r.type === 'SKILL') nm = SKL_INDEX[id] && SKL_INDEX[id].name && `Decal: ${SKL_INDEX[id].name}`;
  else if (ITEM_INDEX[id]) {
    const it = ITEM_INDEX[id];
    const bp = id.startsWith('ITMP_') && PT_INDEX[id.replace(/^ITMP_/, 'PT_')];
    nm = bp ? `Blueprint: ${bp.name}` : it.name;
  } else if (PT_INDEX[id]) nm = PT_INDEX[id].name;
  else if (MSR_INDEX[id]) nm = MSR_INDEX[id].name;
  else if (BST_INDEX[id]) nm = BST_INDEX[id].name;
  return (nm || `${r.type} ${id}`) + n;
}
function questStars(qid) {
  const m = questMeta().byId[qid];
  return m && m.lvl != null ? '★'.repeat(Math.max(1, Math.round(m.lvl / 2))) : '';
}
function questUserEntry(q, qid) {
  return q.user.find(u => u.qid === qid) || null;
}
function questLocked(q, qid) {
  const m = questMeta().byId[qid];
  if (!m) return '';
  const why = [];
  if (m.cond_quest_id) {
    const u = questUserEntry(q, m.cond_quest_id);
    if (!u || !(u.clrcnt > 0)) why.push(`clear "${questName(m.cond_quest_id)}" first`);
  }
  const maxFlr = SAVE.playlog && SAVE.playlog[0] && SAVE.playlog[0].base && SAVE.playlog[0].base.max_floor;
  if (m.cond_flr > 0 && maxFlr != null && maxFlr < m.cond_flr) why.push(`needs floor ${m.cond_flr} (you've reached ${maxFlr})`);
  return why.join('; ');
}

function blockQuests() {
  return `<section class="block">
    <div class="block-head"><div><div class="eyebrow">Progress</div><h2>Quests</h2></div></div>
    <div class="block-body">
      <div class="capNote" style="margin-top:0;">Edits your current quests and quest history. Taking, completing and dropping quests here have been tested in game: progress counts, rewards pay out, and the save's quest checksum ("hash") is left untouched without causing problems.</div>
      <div id="q-body"></div>
    </div>
  </section>`;
}

function renderQuests() {
  const host = document.getElementById('q-body');
  if (!host || !SAVE) return;
  questSyncState();
  const q = questData();
  if (!q) { host.innerHTML = '<div class="warnNote">This save has no quest data (soul.quest). Load a .sav or the full .json dump.</div>'; return; }
  const M = questMeta();
  const changed = QUEST_STATE.original && JSON.stringify({ ord: q.ord, user: q.user }) !== JSON.stringify(QUEST_STATE.original);
  const tabs = [['active', `Current quests (${q.ord.length})`], ['add', 'Take a quest'], ['history', `Quest history (${q.user.length})`]];
  let h = '';
  if (changed) h += `<div class="warnNote" style="display:flex; gap:10px; align-items:center; border-color:var(--good); color:var(--good-bright);"><div style="flex:1;">Quests changed. Download the .sav to keep it.</div><button class="subtle" id="q-undo-all">Undo all quest changes</button></div>`;
  if (QUEST_STATE.lastMsg) h += `<pre class="stewLog">${escapeHtml(QUEST_STATE.lastMsg)}</pre>`;
  h += `<div class="subTabs">${tabs.map(([k, l]) => `<div class="subTab ${QUEST_FORM.open === k ? 'active' : ''}" data-q-tab="${k}">${l}</div>`).join('')}</div>`;

  if (QUEST_FORM.open === 'active') {
    if (q.ord.length > 3) h += `<div class="warnNote">You have ${q.ord.length} quests taken. Holding more than 3 at once is untested; check it on a copy of your save.</div>`;
    h += '<div class="listBlock" style="max-height:none;">';
    h += q.ord.map((o, i) => {
      const done = o.prgmax > 0 && o.prgnow >= o.prgmax;
      const pct = o.prgmax > 0 ? Math.min(100, Math.round(100 * (o.prgnow || 0) / o.prgmax)) : 0;
      return `<div class="listRow" style="flex-direction:column; align-items:stretch; padding:10px; gap:4px;">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <div class="name"><b>${escapeHtml(questName(o.qid))}</b> <span style="color:var(--warn);">${questStars(o.qid)}</span> ${done ? '<span class="badge current">COMPLETE</span>' : ''}</div>
          <span class="id">${escapeHtml(o.qid)}</span>
        </div>
        <div style="font-size:11.5px; color:var(--text-dim);">${escapeHtml(questDesc(o.qid))}</div>
        <div style="font-size:11.5px;">Reward: ${escapeHtml(questReward(o.rwd))}</div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <div class="stewBar" style="width:160px;"><span style="width:${pct}%"></span></div>
          <span style="font-size:11.5px;">Progress</span>
          <input type="number" min="0" max="${o.prgmax}" value="${o.prgnow || 0}" data-q-prg="${i}" style="width:70px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:4px 6px; font-family:var(--mono);">
          <span style="font-size:11.5px;">/ ${o.prgmax}</span>
          <button class="action" data-q-complete="${i}" ${done ? 'disabled' : ''}>Complete</button>
          <button class="subtle" data-q-drop="${i}">Drop quest</button>
        </div>
      </div>`;
    }).join('') || '<div style="padding:10px; color:var(--text-faint); font-size:12px;">No quests taken. Use "Take a quest" to add one.</div>';
    h += '</div><div class="capNote">Complete sets progress to the goal, so the game should treat the quest as done the next time it checks. The reward is still collected in game.</div>';
  }

  if (QUEST_FORM.open === 'add') {
    const active = new Set(q.ord.map(o => o.qid));
    const s = norm(QUEST_FORM.addSearch);
    const list = q.user.filter(u => M.byId[u.qid] && !active.has(u.qid)).map(u => ({ u, lock: questLocked(q, u.qid), name: questName(u.qid) }))
      .filter(x => (QUEST_FORM.showLocked || !x.lock) && (!s || norm(x.name).includes(s) || norm(x.u.qid).includes(s) || norm(questDesc(x.u.qid)).includes(s)))
      .sort((a, b) => (M.byId[a.u.qid].no || 0) - (M.byId[b.u.qid].no || 0));
    h += `<div class="toolbar"><input type="text" id="q-add-search" placeholder="Search quests..." value="${escapeHtml(QUEST_FORM.addSearch)}" style="flex:1; max-width:320px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:7px 8px; font-family:var(--mono);">
      <label class="stewHlOnly"><input type="checkbox" id="q-show-locked" ${QUEST_FORM.showLocked ? 'checked' : ''}> Include quests you haven't unlocked</label><span class="count">${list.length} shown</span></div>`;
    h += '<div class="listBlock" style="max-height:520px;">';
    h += list.map(x => {
      const m = M.byId[x.u.qid];
      const r = x.u.clrcnt > 0 ? m.rwd : (m.first_rwd || m.rwd);
      return `<div class="listRow" style="align-items:flex-start; padding:8px 10px;">
        <div class="name"><b>${escapeHtml(x.name)}</b> <span style="color:var(--warn);">${questStars(x.u.qid)}</span> ${x.u.clrcnt > 0 ? `<span class="badge">cleared ×${x.u.clrcnt}</span>` : '<span class="badge current">never cleared</span>'}
          <div style="font-size:11px; color:var(--text-dim);">${escapeHtml(questDesc(x.u.qid))}</div>
          <div style="font-size:11px;">Reward: ${escapeHtml(questReward(r))}${x.u.clrcnt > 0 ? '' : ' (first clear)'}</div>
          ${x.lock ? `<div style="font-size:11px; color:var(--warn);">Locked: ${escapeHtml(x.lock)}</div>` : ''}</div>
        <span class="id">${escapeHtml(x.u.qid)}</span>
        <button class="subtle" data-q-take="${escapeHtml(x.u.qid)}">Take</button>
      </div>`;
    }).join('') || '<div style="padding:10px; color:var(--text-faint); font-size:12px;">No quests match.</div>';
    h += '</div>';
  }

  if (QUEST_FORM.open === 'history') {
    const s = norm(QUEST_FORM.histSearch);
    const f = QUEST_FORM.histFilter;
    const list = q.user.map((u, i) => ({ u, i, name: questName(u.qid) }))
      .filter(x => f === 'all' || (f === 'cleared' && x.u.clrcnt > 0) || (f === 'taken' && x.u.ordcnt > 0 && !(x.u.clrcnt > 0)) || (f === 'never' && !(x.u.ordcnt > 0)))
      .filter(x => !s || norm(x.name).includes(s) || norm(x.u.qid).includes(s))
      .sort((a, b) => ((M.byId[a.u.qid] || {}).no || 0) - ((M.byId[b.u.qid] || {}).no || 0));
    const cnt = { cleared: q.user.filter(u => u.clrcnt > 0).length, never: q.user.filter(u => !(u.ordcnt > 0)).length };
    h += `<div class="toolbar"><select id="q-hist-filter" style="background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:6px 8px; font-family:var(--mono); font-size:12px;">
        ${[['all', `All (${q.user.length})`], ['cleared', `Cleared (${cnt.cleared})`], ['taken', 'Taken, not cleared'], ['never', `Never taken (${cnt.never})`]].map(([k, l]) => `<option value="${k}" ${f === k ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <input type="text" id="q-hist-search" placeholder="Search..." value="${escapeHtml(QUEST_FORM.histSearch)}" style="flex:1; max-width:260px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:7px 8px; font-family:var(--mono);">
      <button class="subtle" id="q-clear-shown" ${list.some(x => !(x.u.clrcnt > 0)) ? '' : 'disabled'}>Mark all shown as cleared</button>
      <span class="count">${list.length} shown</span></div>`;
    h += '<table class="stewTable"><thead><tr><th>Quest</th><th>Category</th><th>Times taken</th><th>Times cleared</th><th></th></tr></thead><tbody>';
    h += list.map(x => {
      const m = M.byId[x.u.qid] || {};
      return `<tr><td>${escapeHtml(x.name)} <span style="color:var(--warn);">${questStars(x.u.qid)}</span><div class="dtRel">${escapeHtml(x.u.qid)}</div></td>
        <td style="font-size:11px; color:var(--text-dim);">${escapeHtml(M.cats[m.cat] || m.cat || '')}</td>
        <td><input type="number" min="0" value="${x.u.ordcnt || 0}" data-q-ord="${x.i}" style="width:60px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:3px 6px; font-family:var(--mono);"></td>
        <td><input type="number" min="0" value="${x.u.clrcnt || 0}" data-q-clr="${x.i}" style="width:60px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:3px 6px; font-family:var(--mono);"></td>
        <td>${x.u.clrcnt > 0 ? '' : `<button class="subtle" data-q-mark="${x.i}">Mark cleared</button>`}</td></tr>`;
    }).join('');
    h += '</tbody></table><div class="capNote">"Times cleared" above 0 means the quest pays its normal reward instead of the first-clear reward, and unlocks quests that require it. Times taken is raised to match if it is lower.</div>';
  }
  host.innerHTML = h;
  wireQuestEvents(q);
}

function wireQuestEvents(q) {
  const host = document.getElementById('q-body');
  const redo = msg => { QUEST_STATE.lastMsg = msg || ''; renderQuests(); if (msg) toast(msg.split('\n')[0]); };
  host.querySelectorAll('[data-q-tab]').forEach(t => t.addEventListener('click', () => { QUEST_FORM.open = t.dataset.qTab; QUEST_STATE.lastMsg = ''; renderQuests(); }));
  const undo = document.getElementById('q-undo-all');
  if (undo) undo.addEventListener('click', () => {
    const o = JSON.parse(JSON.stringify(QUEST_STATE.original));
    q.ord = o.ord;
    q.user = o.user;
    redo('Quests restored to how they were when you loaded the save.');
  });
  host.querySelectorAll('[data-q-prg]').forEach(inp => inp.addEventListener('change', () => {
    const o = q.ord[Number(inp.dataset.qPrg)];
    let v = parseInt(inp.value, 10) || 0;
    v = Math.min(Math.max(v, 0), o.prgmax > 0 ? o.prgmax : v);
    o.prgnow = v;
    redo(`${questName(o.qid)}: progress ${v} / ${o.prgmax}`);
  }));
  host.querySelectorAll('[data-q-complete]').forEach(b => b.addEventListener('click', () => {
    const o = q.ord[Number(b.dataset.qComplete)];
    o.prgnow = o.prgmax > 0 ? o.prgmax : 1;
    redo(`Completed "${questName(o.qid)}". Collect the reward in game.`);
  }));
  host.querySelectorAll('[data-q-drop]').forEach(b => b.addEventListener('click', () => {
    const [o] = q.ord.splice(Number(b.dataset.qDrop), 1);
    redo(`Dropped "${questName(o.qid)}".`);
  }));
  const addS = document.getElementById('q-add-search');
  if (addS) addS.addEventListener('change', () => { QUEST_FORM.addSearch = addS.value; renderQuests(); });
  const showL = document.getElementById('q-show-locked');
  if (showL) showL.addEventListener('change', () => { QUEST_FORM.showLocked = showL.checked; renderQuests(); });
  host.querySelectorAll('[data-q-take]').forEach(b => b.addEventListener('click', () => {
    const qid = b.dataset.qTake;
    const m = questMeta().byId[qid];
    const u = questUserEntry(q, qid);
    if (!m || !u || q.ord.some(o => o.qid === qid)) return;
    q.ord.push({
      qid,
      prgnow: 0,
      prgmax: m.prgmax > 0 ? m.prgmax : 1,
      timer: 0,
      expire: 0,
      term: 0,
      rwd: u.clrcnt > 0 ? m.rwd : (m.first_rwd || m.rwd),
      order: Math.floor(Date.now() / 1000)
    });
    u.ordcnt = (u.ordcnt || 0) + 1;
    redo(`Took "${questName(qid)}". It is now in your current quests.`);
  }));
  const hf = document.getElementById('q-hist-filter');
  if (hf) hf.addEventListener('change', () => { QUEST_FORM.histFilter = hf.value; renderQuests(); });
  const hs = document.getElementById('q-hist-search');
  if (hs) hs.addEventListener('change', () => { QUEST_FORM.histSearch = hs.value; renderQuests(); });
  const setClr = (u, v) => {
    u.clrcnt = Math.max(0, v);
    if (u.clrcnt > 0 && !((u.ordcnt || 0) >= u.clrcnt)) u.ordcnt = u.clrcnt;
  };
  host.querySelectorAll('[data-q-clr]').forEach(inp => inp.addEventListener('change', () => {
    const u = q.user[Number(inp.dataset.qClr)];
    setClr(u, parseInt(inp.value, 10) || 0);
    redo(`${questName(u.qid)}: cleared ${u.clrcnt}, taken ${u.ordcnt}`);
  }));
  host.querySelectorAll('[data-q-ord]').forEach(inp => inp.addEventListener('change', () => {
    const u = q.user[Number(inp.dataset.qOrd)];
    u.ordcnt = Math.max(0, parseInt(inp.value, 10) || 0);
    redo(`${questName(u.qid)}: taken ${u.ordcnt}`);
  }));
  host.querySelectorAll('[data-q-mark]').forEach(b => b.addEventListener('click', () => {
    const u = q.user[Number(b.dataset.qMark)];
    setClr(u, 1);
    redo(`Marked "${questName(u.qid)}" as cleared.`);
  }));
  const cs = document.getElementById('q-clear-shown');
  if (cs) cs.addEventListener('click', () => {
    const s = norm(QUEST_FORM.histSearch), f = QUEST_FORM.histFilter;
    let n = 0;
    for (const u of q.user) {
      if (u.clrcnt > 0) continue;
      const nm = questName(u.qid);
      const pass = (f === 'all' || (f === 'taken' && u.ordcnt > 0) || (f === 'never' && !(u.ordcnt > 0))) && (!s || norm(nm).includes(s) || norm(u.qid).includes(s));
      if (pass) { setClr(u, 1); n++; }
    }
    redo(`Marked ${n} quest${n === 1 ? '' : 's'} as cleared.`);
  });
}

// The game itself stores counts up to at least 98 (seen in a real save), so
// the editor allows up to 99.
const DECAL_CAP = 99;

function blockSkillDecals() {
  return `<section class="block">\n    <div class="block-head"><div><div class="eyebrow">Account</div><h2>Skill Decals</h2></div></div>\n    <div class="block-body">\n      <div class="toolbar">\n        <input type="text" id="decal-filter" placeholder="Filter by name..." style="flex:1; max-width:280px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:7px 8px; font-family:var(--mono);">\n        <button class="subtle" id="decal-max-all">Max all (${DECAL_CAP})</button>\n        <input type="number" id="decal-apply-val" min="0" max="${DECAL_CAP}" value="${DECAL_CAP}" style="width:60px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:6px;">\n        <button class="subtle" id="decal-apply-all">Apply to all filtered</button>\n        <div class="count" id="decal-count"></div>\n      </div>\n      <div class="listBlock" id="decal-list" style="max-height:360px;"></div>\n    </div>\n  </section>`;
}

function wireSkillDecals() {
  const soul = SAVE.soul;
  soul.psskls = arr(soul.psskls);
  function entryFor(id) {
    return soul.psskls.find(s => s.id === id);
  }
  function setCnt(id, v) {
    v = Math.min(Math.max(v, 0), DECAL_CAP);
    let e = entryFor(id);
    if (!e) {
      e = {
        id: id,
        lvl: 1,
        cnt: v,
        is_checked: 1
      };
      soul.psskls.push(e);
    } else {
      e.cnt = v;
    }
    return v;
  }
  let currentFilter = '';
  function renderList(filter) {
    currentFilter = filter;
    const all = Object.values(SKL_INDEX).sort((a, b) => a.name.localeCompare(b.name));
    const shown = all.filter(s => !filter || norm(s.name).includes(norm(filter)));
    document.getElementById('decal-count').textContent = `${shown.length} shown / ${all.length} total`;
    document.getElementById('decal-list').innerHTML = shown.map(s => {
      const e = entryFor(s.id);
      const cnt = e ? Math.min(Math.max(e.cnt || 0, 0), DECAL_CAP) : 0;
      return `<div class="listRow"><div class="name">${escapeHtml(s.name)}</div><div class="id">${s.id}</div>\n        <input type="number" class="decal-cnt" data-decal="${s.id}" min="0" max="${DECAL_CAP}" value="${cnt}" style="width:55px;">\n        <button class="subtle" data-decal-max="${s.id}">Max</button>\n      </div>`;
    }).join('') || '<div style="padding:10px; color:var(--text-faint); font-size:12px;">No matches.</div>';
    document.querySelectorAll('.decal-cnt').forEach(inp => {
      inp.addEventListener('change', () => {
        let v = parseInt(inp.value, 10) || 0;
        if (v > DECAL_CAP) toast(`Clamped to ${DECAL_CAP}`);
        inp.value = setCnt(inp.dataset.decal, v);
      });
    });
    document.querySelectorAll('[data-decal-max]').forEach(btn => {
      btn.addEventListener('click', () => {
        setCnt(btn.dataset.decalMax, DECAL_CAP);
        renderList(currentFilter);
      });
    });
  }
  renderList('');
  document.getElementById('decal-filter').addEventListener('input', e => renderList(e.target.value));
  document.getElementById('decal-max-all').addEventListener('click', () => {
    for (const s of Object.values(SKL_INDEX)) setCnt(s.id, DECAL_CAP);
    renderList(currentFilter);
    toast(`All decals set to ${DECAL_CAP}`);
  });
  document.getElementById('decal-apply-all').addEventListener('click', () => {
    let v = parseInt((document.getElementById('decal-apply-val') || {}).value, 10) || 0;
    if (v > DECAL_CAP) {
      v = DECAL_CAP;
      toast(`Clamped to ${DECAL_CAP}`);
    }
    const all = Object.values(SKL_INDEX).filter(s => !currentFilter || norm(s.name).includes(norm(currentFilter)));
    for (const s of all) setCnt(s.id, v);
    renderList(currentFilter);
    toast(`Set ${all.length} filtered decals to ${v}`);
  });
}

function itemDisplayName(itemId) {
  const rec = ITEM_INDEX[itemId];
  if (!rec) return itemId;
  if (itemId.startsWith('ITMP_')) {
    const ptRec = PT_INDEX[itemId.replace(/^ITMP_/, 'PT_').replace(/U$/, '')];
    const base = ptRec ? ptRec.name : rec.name;
    return 'Blueprint - ' + base + (itemId.endsWith('U') ? ' (unrevealed)' : '');
  }
  return rec.name;
}

function msrDisplayName(msrid, cooked) {
  const rec = MSR_INDEX[msrid];
  if (!rec) return msrid;
  return cooked && rec.cookedName ? rec.cookedName : rec.name;
}

function bstDisplayName(bstid, cooked) {
  const rec = BST_INDEX[bstid];
  if (!rec) return bstid;
  return cooked && rec.cookedName ? rec.cookedName : rec.name;
}

function durabilityPct(inst, rec) {
  if (!rec || !rec.dur) return null;
  const cur = inst.dur != null ? inst.dur : rec.dur;
  const effectiveMax = Math.max(rec.dur, cur);
  const pct = 100 * cur / effectiveMax;
  return pct < 10 ? Math.round(pct * 10) / 10 : Math.round(pct);
}

function storageSlotRow(s, i) {
  let label = null, sub = '', kind = '';
  if (s.eptid && s.eptid !== '-1') {
    const inst = arr(SAVE.cl.pts).find(p => p.eptid === s.eptid);
    const rec = inst && PT_INDEX[inst.ptid];
    label = rec ? rec.name : inst ? inst.ptid : 'part (unresolved)';
    const pct = rec ? durabilityPct(inst, rec) : null;
    sub = rec ? `+${displayFromRaw(rec, inst.lvl)} · durability ${pct != null ? pct + '%' : '?'}` : '';
    kind = rec ? (rec.type === 'PTTP_ARM' ? 'weapon' : 'armor ' + partSlotLabel(rec)) : 'part';
  } else if (s.eitemid && s.eitemid !== '-1') {
    const inst = arr(SAVE.cl.items).find(p => p.eitemid === s.eitemid);
    label = inst ? itemDisplayName(inst.itemId) : 'item (unresolved)';
    kind = inst && String(inst.itemId).startsWith('ITMP_') ? 'blueprint' : 'material item';
  } else if (s.emsrid && s.emsrid !== '-1') {
    const inst = arr(SAVE.cl.msrs).find(m => m.emsrid === s.emsrid);
    label = inst ? msrDisplayName(inst.msrid, inst.cooked) : 'Mushroom';
    kind = 'mushroom';
  } else if (s.ebstid && s.ebstid !== '-1') {
    const inst = arr(SAVE.cl.bsts).find(b => b.ebstid === s.ebstid);
    label = inst ? bstDisplayName(inst.bstid, inst.cooked) : 'Beast';
    kind = 'beast';
  }
  if (!label) return '';
  return `<div class="listRow" data-sb-kind="${kind}"><div class="name">${escapeHtml(label)} ${sub}</div><div class="id">slot ${s.slot != null ? s.slot : i}</div><button class="subtle" data-sb-remove="${i}">✕</button></div>`;
}

  document.getElementById('sb-add-legit-bp').addEventListener('click', () => {
    bulkDeposit(legitBlueprintItemIds(), 'obtainable blueprints');
  });
  document.getElementById('sb-add-ps-bp').addEventListener('click', () => {

  });
  document.getElementById('sb-add-travis-bp').addEventListener('click', () => {

  });
  document.getElementById('sb-add-tdm-bp').addEventListener('click', () => {

function resizeStorageBox(target) {
  const cl = SAVE.cl;
  if (target > cl.slots.length) {
    for (let i = cl.slots.length; i < target; i++) cl.slots.push({
      slot: i,
      eptid: '-1',
      emsrid: '-1',
      ebstid: '-1',
      eitemid: '-1'
    });
  } else if (target < cl.slots.length) {
    cl.slots.length = target;
    toast('Storage shrunk -- any occupied slots past the new capacity were removed', true);
  }
  renderAll();
}

function renderSbForm() {
  document.querySelectorAll('[data-sb-cat]').forEach(el => el.classList.toggle('active', el.dataset.sbCat === sbCategory));
  document.getElementById('sb-add-form').innerHTML = sbAddFormHtml() + qtyFirstNote(sbCategory === 'pt');
  bindFormState([ [ 'sb-qty', SB_FORM, 'qty' ], [ 'sb-add-lvl', SB_FORM, 'lvl' ], [ 'sb-add-unrevealed', SB_FORM, 'unrevealed' ], [ 'sb-add-cooked', SB_FORM, 'cooked' ] ]);

function storageFreeSlotIndex() {
  return SAVE.cl.slots.findIndex(s => (!s.eptid || s.eptid === '-1') && (!s.eitemid || s.eitemid === '-1') && (!s.emsrid || s.emsrid === '-1') && (!s.ebstid || s.ebstid === '-1'));
}

function legitBlueprintItemIds() {
  const bpIds = new Set((AP.items || []).filter(it => it.itemtype === 'ITTP_RMAP').map(it => it.itemId));
  const excluded = new Set([ ...psOnlyFirstTierBlueprintItemIds(), ...TRAVIS_BLUEPRINT_IDS ]);
  const out = [];
  for (const p of AP.pts || []) {
    if (!isResearchAllowed(p.id)) continue;
    if (!isChainRoot(p.id)) continue;
    const iid = 'ITMP_' + p.id.slice(3);
    if (bpIds.has(iid) && isRealBlueprint(iid) && !excluded.has(iid)) out.push(iid);
  }
  return out;
}

function psOnlyFirstTierBlueprintItemIds() {
  const bpIds = new Set((AP.items || []).filter(it => it.itemtype === 'ITTP_RMAP').map(it => it.itemId));
  const out = [];
  for (const ptid of psOnlyBlueprintPtids()) {
    if (!isChainRoot(ptid)) continue;
    if (/_100[12]$/.test(ptid)) continue;
    const iid = 'ITMP_' + ptid.slice(3);
    if (bpIds.has(iid)) out.push(iid);
  }
  return out;
}

const TRAVIS_BLUEPRINT_IDS = [ 'ITMP_SPE_TOPS_015', 'ITMP_SPE_BTM_015', 'ITMP_SPE_HEAD_015', 'ITMP_ARM_WP001_0N1' ];

function travisBlueprintItemIds() {
  return TRAVIS_BLUEPRINT_IDS.filter(id => ITEM_INDEX[id]);
}

function tdmBlueprintItemIds() {
  const out = [];
  for (const p of AP.pts || []) {
    const name = resolveName(p.name) || '';
    if (!/TDM\s*$/i.test(name)) continue;
    const iid = 'ITMP_' + p.id.slice(3);
    if (ITEM_INDEX[iid] && isRealBlueprint(iid)) out.push(iid);
  }
  return out;
}

function depositBlueprintIds(itemIds) {
  const cl = SAVE.cl;
  let added = 0;
  for (const itemId of itemIds) {
    const emptyIdx = storageFreeSlotIndex();
    if (emptyIdx < 0) break;
    const eitemid = 'edit-' + Math.random().toString(16).slice(2) + Date.now().toString(16) + added;
    cl.items.push({
      eitemid: eitemid,
      itemId: itemId,
      gettime: Math.floor(Date.now() / 1e3)
    });
    cl.slots[emptyIdx] = {
      slot: emptyIdx,
      eptid: '-1',
      emsrid: '-1',
      ebstid: '-1',
      eitemid: eitemid
    };
    added++;
  }
  return added;
}

function depositToStorage(rec) {
  const cl = SAVE.cl;
  const qty = Math.max(1, parseInt((document.getElementById('sb-qty') || {}).value, 10) || 1);
  let deposited = 0;
  for (let n = 0; n < qty; n++) {
    const emptyIdx = storageFreeSlotIndex();
    if (emptyIdx < 0) {
      toast(`Storage box full -- deposited ${deposited}/${qty}, raise capacity for the rest`, true);
      break;
    }
    if (sbCategory === 'pt') {
      const clampedLvl = rawFromDisplay(rec, (document.getElementById('sb-add-lvl') || {}).value);
      const eptid = 'edit-' + Math.random().toString(16).slice(2) + Date.now().toString(16) + n;
      cl.pts.push({
        eptid: eptid,
        ptid: rec.id,
        gettime: Math.floor(Date.now() / 1e3),
        rest: 0,
        spare: 0,
        grade: 0,
        dur: rec.dur,
        lvl: clampedLvl
      });
      cl.slots[emptyIdx] = {
        slot: emptyIdx,
        eptid: eptid,
        emsrid: '-1',
        ebstid: '-1',
        eitemid: '-1'
      };
    } else if (sbCategory === 'bp') {
      const unrevealed = !!(document.getElementById('sb-add-unrevealed') || {}).checked;
      let itemId = rec.id;
      if (!itemId.startsWith('ITMP_')) {
        toast('That\'s not a blueprint item', true);
        return;
      }
      if (unrevealed && !itemId.endsWith('U')) itemId += 'U';
      if (!unrevealed && itemId.endsWith('U')) itemId = itemId.slice(0, -1);
      const eitemid = 'edit-' + Math.random().toString(16).slice(2) + Date.now().toString(16) + n;
      cl.items.push({
        eitemid: eitemid,
        itemId: itemId,
        gettime: Math.floor(Date.now() / 1e3)
      });
      cl.slots[emptyIdx] = {
        slot: emptyIdx,
        eptid: '-1',
        emsrid: '-1',
        ebstid: '-1',
        eitemid: eitemid
      };
    } else if (sbCategory === 'msr') {
      const cooked = !!(document.getElementById('sb-add-cooked') || {}).checked;
      if (cooked && !rec.enable_roast) {
        toast(`"${rec.name}" can't be roasted (enable_roast=0 in apiparams) -- depositing uncooked instead`, true);
      }
      const actuallyCooked = cooked && !!rec.enable_roast;
      const emsrid = 'edit-' + Math.random().toString(16).slice(2) + Date.now().toString(16) + n;
      cl.msrs.push({
        emsrid: emsrid,
        msrid: rec.id,
        gettime: Math.floor(Date.now() / 1e3),
        eefcid: '',
        tefcid: '',
        state: 0,
        cooked: actuallyCooked
      });
      cl.slots[emptyIdx] = {
        slot: emptyIdx,
        eptid: '-1',
        emsrid: emsrid,
        ebstid: '-1',
        eitemid: '-1'
      };
    } else if (sbCategory === 'bst') {
      const cooked = !!(document.getElementById('sb-add-cooked') || {}).checked;
      const ebstid = 'edit-' + Math.random().toString(16).slice(2) + Date.now().toString(16) + n;
      cl.bsts.push({
        ebstid: ebstid,
        bstid: rec.id,
        gettime: Math.floor(Date.now() / 1e3),
        lvl: 1,
        state: 0,
        cooked: cooked
      });
      cl.slots[emptyIdx] = {
        slot: emptyIdx,
        eptid: '-1',
        emsrid: '-1',
        ebstid: ebstid,
        eitemid: '-1'
      };
    } else {
      const eitemid = 'edit-' + Math.random().toString(16).slice(2) + Date.now().toString(16) + n;
      cl.items.push({
        eitemid: eitemid,
        itemId: rec.id,
        gettime: Math.floor(Date.now() / 1e3)
      });
      cl.slots[emptyIdx] = {
        slot: emptyIdx,
        eptid: '-1',
        emsrid: '-1',
        ebstid: '-1',
        eitemid: eitemid
      };
    }
    deposited++;
  }
  if (deposited === qty) toast(`Deposited ${qty}x "${rec.name}"`);
  renderAll();
}

// Reward Box entries exactly as the game writes them (from a real save):
// {pid: lowercase UUID, from, type, created, num, fromval, kind, val0,
//  val1..val4 as STRINGS}. Older editor versions added a "uid" field, a
// non-UUID pid and numeric val1..val4; normalizePresents() repairs those.
const PRESENT_UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
function presentUuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.floor(Math.random() * 256); });
  b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const x = [ ...b ].map(v => v.toString(16).padStart(2, '0')).join('');
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
}
function presentProblems(p) {
  const bad = [];
  if (!p || typeof p !== 'object') return [ 'not an object' ];
  if ('uid' in p) bad.push('extra uid field');
  if (typeof p.pid !== 'string' || !PRESENT_UUID_RE.test(p.pid)) bad.push('pid');
  for (const k of [ 'val1', 'val2', 'val3', 'val4' ]) if (typeof p[k] !== 'string') bad.push(k);
  for (const k of [ 'fromval', 'kind', 'val0' ]) if (typeof p[k] !== 'string') bad.push(k);
  if (typeof p.num !== 'number') bad.push('num');
  if (typeof p.created !== 'number') bad.push('created');
  return bad;
}
function normalizePresents(list) {
  let n = 0;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (!presentProblems(p).length) continue;
    const s = v => v == null ? '' : String(v);
    list[i] = {
      pid: typeof p.pid === 'string' && PRESENT_UUID_RE.test(p.pid) ? p.pid : presentUuid(),
      from: p.from || 'LOGIN',
      type: p.type || '',
      created: Number(p.created) || Math.floor(Date.now() / 1e3),
      num: Number(p.num) || 0,
      fromval: s(p.fromval),
      kind: s(p.kind),
      val0: s(p.val0),
      val1: s(p.val1 != null && p.val1 !== '' ? p.val1 : 0),
      val2: s(p.val2 != null && p.val2 !== '' ? p.val2 : 0),
      val3: s(p.val3 != null && p.val3 !== '' ? p.val3 : 0),
      val4: s(p.val4 != null && p.val4 !== '' ? p.val4 : 0)
    };
    n++;
  }
  return n;
}

function addPresent(type, num, val0, val1) {
  SAVE.presents.push({
    pid: presentUuid(),
    from: 'LOGIN',
    type: type,
    created: Math.floor(Date.now() / 1e3),
    num: num,
    fromval: '',
    kind: '',
    val0: val0 || '',
    val1: String(val1 || 0),
    val2: '0',
    val3: '0',
    val4: '0'
  });
  toast(`Added ${type}${val0 ? ' (' + val0 + ')' : ''} x${num}`);
  renderAll();
}

let REFRESH_STAMP_GRID = null;

function syncStampFromResearch() {
  if (!AP || !AP.pts || !AP.pts.length) return false;
  SAVE.soul.researchstamp = arr(SAVE.soul.researchstamp);
  const computed = computeStampTotals();
  for (const type of RESEARCH_STAMP_TYPES) {
    let e = SAVE.soul.researchstamp.find(r => r.type === type);
    if (!e) {
      e = {
        type: type,
        rate: 0
      };
      SAVE.soul.researchstamp.push(e);
    }
    e.rate = computed[type];
  }
  if (REFRESH_STAMP_GRID) REFRESH_STAMP_GRID();
  return true;
}

function wireStamp() {
  SAVE.soul.researchstamp = arr(SAVE.soul.researchstamp);
  function renderStampGrid() {
    const computed = AP && AP.pts && AP.pts.length ? computeStampTotals() : null;
    document.getElementById('stamp-grid').innerHTML = RESEARCH_STAMP_TYPES.map(type => {
      const e = SAVE.soul.researchstamp.find(r => r.type === type);

      const mismatch = comp != null && Math.abs(comp - raw) > .05;
      return `<div class="field"><label>${STAMP_LABELS[type]}${comp != null ? ` (research says ${comp})` : ''}</label>\n        <input type="number" step="0.1" data-stamp="${type}" value="${raw}" style="${mismatch ? 'border-color:var(--warn);' : ''}">\n      </div>`;
    }).join('');

  });
}
