// ---------------------------------------------------------------------------
// STEWS (Mushroom Stew / decal gacha queue)
// Port of stew_luck_rarity.py. The offline build pre-rolls a batch of stew
// results into soul.skl.gacha.normal.sklids and pops them off the END of the
// list one pull at a time, so editing odds does nothing until that queue runs
// out. This tab rewrites the queue so a change lands on the very next pull.
// Edits go into RAW_SAV_ROOT and ship with the normal "Download .sav" button.
// ---------------------------------------------------------------------------

const STEW_GACHA_ID = 'SKLGACH_NORMAL_OFFLINE';
const STEW_MAX_LEN = 5000;
let STEW_STATE = { root: null, original: null, hadQueue: false, lastMsg: '' };
const STEW_FORM = { rarity: null, count: '', seed: '', ahead: 10, showAll: false, showOdds: false, hl: [], hlOnly: false, zeroOwned: true };

function stewQueue() {
  const g = RAW_SAV_ROOT && RAW_SAV_ROOT.soul && RAW_SAV_ROOT.soul.skl && RAW_SAV_ROOT.soul.skl.gacha && RAW_SAV_ROOT.soul.skl.gacha.normal;
  return g && Array.isArray(g.sklids) ? g.sklids : null;
}

function setStewQueue(q) {
  const soul = RAW_SAV_ROOT.soul = RAW_SAV_ROOT.soul || {};
  soul.skl = soul.skl || {};
  soul.skl.gacha = soul.skl.gacha || {};
  soul.skl.gacha.normal = soul.skl.gacha.normal || {};
  soul.skl.gacha.normal.sklids = q;
}

function stewSyncState() {
  if (STEW_STATE.root !== RAW_SAV_ROOT) {
    const q = stewQueue();
    STEW_STATE = { root: RAW_SAV_ROOT, original: q ? q.slice() : null, hadQueue: !!q, lastMsg: '' };
  }
}

function stewRarity(id) {
  const r = SKL_INDEX[id];
  if (!r || r.rarity == null || r.rarity === '') return null;
  const n = Number(r.rarity);
  return isNaN(n) ? r.rarity : n;
}
function stewName(id) {
  const r = SKL_INDEX[id];
  return r && r.name ? r.name : id;
}

// Every decal id the player already has (so duplicates can be flagged).
// Same rule as the script: any string value starting "SKL_" under soul,
// except the queue itself. psskl/eqskl come from the editor's live state so
// edits made on the Decals / Fighters tabs are reflected.
function stewOwnedDecals() {
  const got = new Set();
  const walk = o => {
    if (Array.isArray(o)) { for (const v of o) if (v && typeof v === 'object') walk(v); }
    else if (o && typeof o === 'object') {
      for (const k in o) {
        const v = o[k];
        if (typeof v === 'string') { if (v.startsWith('SKL_')) got.add(v); }
        else walk(v);
      }
    }
  };
  const soul = (RAW_SAV_ROOT && RAW_SAV_ROOT.soul) || {};
  for (const k in soul) if (k !== 'skl') walk(soul[k]);
  const skl = soul.skl || {};
  for (const k in skl) if (k !== 'psskl' && k !== 'eqskl' && k !== 'gacha') walk(skl[k]);
  if (skl.eqskl && typeof skl.eqskl === 'object') for (const k in skl.eqskl) if (String(k) !== String(RAW_SAV_MAIN_UID)) walk(skl.eqskl[k]);
  const hadEntry = new Set(arr(skl.psskl).map(e => e && e.sklid));
  for (const e of arr(SAVE && SAVE.soul && SAVE.soul.psskls)) {
    if (!e || !e.id) continue;
    if (e.cnt == null || e.cnt > 0 || (STEW_FORM.zeroOwned && hadEntry.has(e.id))) got.add(e.id);
  }
  for (const c of arr(SAVE && SAVE.soul && SAVE.soul.chrs)) for (const e of arr(c.eqskls)) {
    const id = e.sklid || e.id;
    if (id) got.add(id);
  }
  return got;
}

function stewRng(seed) {
  if (seed === '' || seed == null || isNaN(Number(seed))) return Math.random;
  let a = (Number(seed) >>> 0) || 1;
  return function() { // mulberry32
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function stewHistogram(list) {
  const c = {};
  for (const s of list) { const r = stewRarity(s); const k = r == null ? '?' : r; c[k] = (c[k] || 0) + 1; }
  return c;
}
function stewHistText(list) {
  const c = stewHistogram(list);
  return Object.keys(c).sort().map(k => `r${k}:${c[k]}`).join(' ') || '(empty)';
}

function stewMakeQueue(rows, length, onlyRarity, rng) {
  if (onlyRarity != null) rows = rows.filter(r => stewRarity(r.sklid) === onlyRarity);
  if (!rows.length) throw new Error(`No rarity-${onlyRarity} decals in the stew odds table`);
  const ids = [], cum = [];
  let tot = 0;
  for (const r of rows) { tot += r.odds; ids.push(r.sklid); cum.push(tot); }
  const out = [];
  for (let n = 0; n < length; n++) {
    const x = rng() * tot;
    let lo = 0, hi = cum.length; // bisect_right
    while (lo < hi) { const mid = (lo + hi) >> 1; if (x < cum[mid]) hi = mid; else lo = mid + 1; }
    out.push(ids[Math.min(lo, ids.length - 1)]);
  }
  return out;
}

function stewWeightedTake(fresh, rng) {
  const items = [...fresh.entries()];
  const tot = items.reduce((a, [, o]) => a + o, 0);
  const r = rng() * tot;
  let acc = 0;
  for (const [s, o] of items) { acc += o; if (r <= acc) { fresh.delete(s); return s; } }
  const s = items[items.length - 1][0];
  fresh.delete(s);
  return s;
}

function stewDedupe(queue, owned, rows, target, rng) {
  const pool = rows.filter(r => stewRarity(r.sklid) === target);
  if (!pool.length) throw new Error(`No rarity-${target} decals in the stew odds table`);
  const fresh = new Map(pool.filter(r => !owned.has(r.sklid)).map(r => [r.sklid, r.odds]));
  const startedEmpty = fresh.size === 0;
  const newq = queue.slice();
  const seen = new Set(owned);
  const swapped = [];
  let ranOut = 0;
  for (let i = newq.length - 1; i >= 0; i--) { // imminent pull first
    const s = newq[i];
    if (stewRarity(s) !== target) continue;
    if (!seen.has(s)) { seen.add(s); fresh.delete(s); continue; }
    if (fresh.size) {
      const pick = stewWeightedTake(fresh, rng);
      seen.add(pick);
      swapped.push([s, pick]);
      newq[i] = pick;
    } else ranOut++;
  }
  return { newq, swapped, ranOut, startedEmpty };
}

function stewRarities() {
  const set = new Set();
  for (const r of arr(AP && AP.stewOdds)) { const x = stewRarity(r.sklid); if (x != null) set.add(x); }
  const q = stewQueue();
  if (q) for (const s of q) { const x = stewRarity(s); if (x != null) set.add(x); }
  const list = [...set].sort((a, b) => b - a);
  return list.length ? list : [5, 4, 3, 2, 1];
}

function blockStews() {
  return `<section class="block">
    <div class="block-head"><div><div class="eyebrow">Mushroom Stew</div><h2>Stew Decal Queue</h2></div></div>
    <div class="block-body">
      <div class="capNote" style="margin-top:0;">Stew results are pre-rolled and stored in your save as a queue. Changing the odds does nothing until the queue runs out, so this tab edits the queue directly and the change lands on your very next stew. Close the game before you download the new save, because the game writes the save on exit and would overwrite your edit. Keep a copy of your original .sav.</div>
      <div id="stew-warn"></div>
      <div class="grid" style="margin-bottom:12px;">
        <div class="field"><label>Rarity</label><select id="stew-rarity" style="width:100%; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:7px 8px; font-family:var(--mono); font-size:13px;"></select></div>
        <div class="field"><label>Queue length (blank = keep current)</label><input type="number" id="stew-count" min="1" max="${STEW_MAX_LEN}" placeholder="current / 200"></div>
        <div class="field"><label>Seed (optional, repeatable rolls)</label><input type="number" id="stew-seed" placeholder="random"></div>
        <div class="field"><label>Upcoming pulls to list</label><input type="number" id="stew-ahead" min="1" max="${STEW_MAX_LEN}"><label style="display:flex; align-items:center; gap:6px; margin-top:6px; text-transform:none; letter-spacing:0; font-size:11.5px; cursor:pointer;"><input type="checkbox" id="stew-showall" style="accent-color:var(--accent);"> Show whole queue</label></div>
      </div>
      <label class="stewHlOnly" style="margin:0 0 12px; font-size:11.5px;" title="Your save keeps an entry for decals you've sold or used up, with 0 copies. The Python script counted those as owned."><input type="checkbox" id="stew-zero-owned"> Count decals you've had but now have 0 copies of as owned (same as the Python script)</label>
      <div class="stewActions">
        <div class="stewAct"><button class="action" data-stew="dedupe">Dedupe rarity</button><span>Swaps queued pulls of the chosen rarity that would repeat a decal you already own (or one granted earlier in this same queue) for ones that are new to you.</span></div>
        <div class="stewAct"><button class="action" data-stew="front">Move rarity to front</button><span>Reorders the queue so every pull of the chosen rarity comes first. Keeps every decal you were going to get and only changes when you get it.</span></div>
        <div class="stewAct"><button class="action" data-stew="stack">Stack rarity</button><span>Fills the whole queue with the chosen rarity, weighted by the game's odds.</span></div>
        <div class="stewAct"><button class="action" data-stew="regen">Fair reroll</button><span>Rerolls the queue from the game's normal odds, as if you had never touched it.</span></div>
        <div class="stewAct"><button class="action" data-stew="clear">Clear queue</button><span>Empties the queue. The game builds a new one from the current odds on your next stew.</span></div>
        <div class="stewAct"><button class="subtle" data-stew="revert">Undo all stew changes</button><span>Puts the queue back to the way it was when you loaded the save.</span></div>
      </div>
      <div id="stew-msg"></div>
      <div id="stew-report"></div>
    </div>
  </section>`;
}

const STEW_RAR_COLORS = { '5': '#e6b422', '4': '#b07cf0', '3': '#4ea3ef', '2': '#5cc46e', '1': '#a0a0a0' };
function stewRarColor(k) { return STEW_RAR_COLORS[String(k)] || '#d6392c'; }

function renderStewReport() {
  const host = document.getElementById('stew-report');
  if (!host || !SAVE) return;
  stewSyncState();
  const warn = document.getElementById('stew-warn');
  const rows = arr(AP && AP.stewOdds);
  const q = stewQueue();
  const changed = JSON.stringify(q || null) !== JSON.stringify(STEW_STATE.original);
  let w = '';
  if (!RAW_SAV_ROOT) w += '<div class="warnNote">Stew editing needs a .sav (or the full .json dump). Load one to use this tab.</div>';
  else if (!rows.length) w += `<div class="warnNote">No stew odds for ${STEW_GACHA_ID} in this masters.db. Dedupe, stack and reroll are off. Move to front and clear still work.</div>`;
  if (changed) w += '<div class="warnNote" style="border-color:var(--good); color:var(--good-bright);">Stew queue changed. Download the .sav to keep it.</div>';
  if (warn) warn.innerHTML = w;
  document.querySelectorAll('[data-stew]').forEach(b => {
    const m = b.dataset.stew;
    b.disabled = !RAW_SAV_ROOT || (['dedupe', 'stack', 'regen'].includes(m) && !rows.length) || (['dedupe', 'front'].includes(m) && !(q && q.length)) || (m === 'revert' && !changed);
  });
  const msg = document.getElementById('stew-msg');
  if (msg) msg.innerHTML = STEW_STATE.lastMsg ? `<pre class="stewLog">${escapeHtml(STEW_STATE.lastMsg)}</pre>` : '';
  if (!RAW_SAV_ROOT) { host.innerHTML = ''; return; }

  const owned = stewOwnedDecals();
  let html = '';
  if (!q || !q.length) {
    html += `<div class="stewStat"><b>No stew queue in this save.</b> The game builds one on your next stew, from the odds below.</div>`;
  } else {
    const order = q.slice().reverse(); // imminent first
    const hist = stewHistogram(q);
    const keys = Object.keys(hist).sort((a, b) => (b === '?') - (a === '?') || Number(b) - Number(a));
    const firstSeen = new Set(), isNew = order.map(s => { const n = !owned.has(s) && !firstSeen.has(s); firstSeen.add(s); return n; });
    const newCount = isNew.filter(Boolean).length;
    const firstNew = isNew.indexOf(true);
    const counts = {};
    for (const s of order) counts[s] = (counts[s] || 0) + 1;
    const reps = Object.values(counts).filter(n => n > 1);
    html += `<div class="stewStats">
      <div class="stewStat"><div class="k">Queued pulls</div><div class="v">${q.length}</div></div>
      <div class="stewStat"><div class="k">New decals queued</div><div class="v">${newCount}</div><div class="s">${firstNew >= 0 ? `first new: ${escapeHtml(stewName(order[firstNew]))}, pull ${firstNew + 1}` : 'none'}</div></div>
      <div class="stewStat"><div class="k">Repeats</div><div class="v">${reps.length}</div><div class="s">${reps.length ? `decals queued more than once, worst ${Math.max(...reps)}x` : 'no decal queued twice'}</div></div>
    </div>`;
    html += '<table class="stewTable"><thead><tr><th>Rarity</th><th>Queued</th><th>Share</th><th>Next one</th></tr></thead><tbody>';
    for (const k of keys) {
      const nxt = order.findIndex(s => String(stewRarity(s) == null ? '?' : stewRarity(s)) === k);
      html += `<tr><td>r${k}</td><td>${hist[k]}</td><td><div class="stewBar"><span style="width:${(100 * hist[k] / q.length).toFixed(1)}%"></span></div></td><td>${nxt === 0 ? 'this pull' : `in ${nxt + 1} pulls`}</td></tr>`;
    }
    html += '</tbody></table>';
    const ahead = STEW_FORM.showAll ? order.length : Math.min(Math.max(parseInt(STEW_FORM.ahead, 10) || 10, 1), STEW_MAX_LEN);
    const hl = new Set(STEW_FORM.hl.map(String));
    const rk = s => String(stewRarity(s) == null ? '?' : stewRarity(s));
    const qRar = Object.keys(hist).sort((a, b) => (a === '?') - (b === '?') || Number(b) - Number(a));
    html += `<div class="stewHlBar"><span class="lbl">Highlight:</span>${qRar.map(k => `<button class="stewHlChip ${hl.has(k) ? 'on' : ''}" data-stew-hl="${k}" style="--rc:${stewRarColor(k)}">r${k} <span>${hist[k]}</span></button>`).join('')}
      <button class="subtle" data-stew-hl-clear ${hl.size ? '' : 'disabled'}>Clear</button>
      <label class="stewHlOnly"><input type="checkbox" id="stew-hl-only" ${STEW_FORM.hlOnly ? 'checked' : ''} ${hl.size ? '' : 'disabled'}> Only show highlighted</label></div>`;
    const listed = order.slice(0, ahead).map((s, i) => ({ s, i })).filter(x => !(STEW_FORM.hlOnly && hl.size) || hl.has(rk(x.s)));
    const title = STEW_FORM.showAll || ahead >= order.length ? `Whole queue (${order.length} pulls, next pull first)` : `Next ${ahead} of ${order.length} pulls`;
    html += `<h3 class="stewH">${title}${STEW_FORM.hlOnly && hl.size ? ` · ${listed.length} highlighted` : ''}</h3><div class="listBlock" style="max-height:${STEW_FORM.showAll ? 600 : 420}px;">`;
    html += listed.map(({ s, i }) => { const k = rk(s); const on = hl.has(k); return `<div class="listRow${on ? ' stewHl' : ''}" ${on ? `style="--rc:${stewRarColor(k)}"` : ''}><span style="width:44px; color:var(--text-faint);">${i + 1}.</span><div class="name">${escapeHtml(stewName(s))}</div><span class="badge stewRarBadge" style="--rc:${stewRarColor(k)}">r${k}</span>${isNew[i] ? '<span class="badge current" style="width:44px; text-align:center;">NEW</span>' : `<span class="badge" style="width:44px; text-align:center; opacity:0.5;">${owned.has(s) ? 'own' : 'dupe'}</span>`}<div class="id">${s}</div></div>`; }).join('') || '<div style="padding:10px; color:var(--text-faint); font-size:12px;">No pulls of the highlighted rarities in this range.</div>';
    html += '</div>';
  }
  if (rows.length) {
    const total = rows.reduce((a, r) => a + r.odds, 0) || 1;
    const perR = {};
    for (const r of rows) { const k = stewRarity(r.sklid) == null ? '?' : stewRarity(r.sklid); perR[k] = (perR[k] || 0) + r.odds; }
    const rk = Object.keys(perR).sort((a, b) => Number(b) - Number(a));
    const open = STEW_FORM.showOdds || !q || !q.length;
    html += `<details class="subDetails" id="stew-odds" style="margin-top:14px;" ${open ? 'open' : ''}><summary>▸ Game odds (${rows.length} decals in the pool, ${escapeHtml(AP.stewOddsId || STEW_GACHA_ID)})</summary><div class="subDetailsBody">`;
    html += '<table class="stewTable"><thead><tr><th>Rarity</th><th>Chance</th><th>On average</th></tr></thead><tbody>';
    for (const k of rk) { const p = perR[k] / total; html += `<tr><td>r${k}</td><td>${(100 * p).toFixed(2)}%</td><td>1 in ${(1 / p).toFixed(1)} pulls</td></tr>`; }
    html += '</tbody></table><h3 class="stewH">Rarest decals</h3><table class="stewTable"><tbody>';
    for (const r of rows.slice().sort((a, b) => a.odds - b.odds).slice(0, 12)) {
      html += `<tr><td>${escapeHtml(stewName(r.sklid))}</td><td>r${stewRarity(r.sklid) == null ? '?' : stewRarity(r.sklid)}</td><td>${(100 * r.odds / total).toFixed(3)}%</td><td>1 in ${Math.round(total / r.odds)}</td><td>${owned.has(r.sklid) ? 'own' : 'NEW'}</td></tr>`;
    }
    html += '</tbody></table></div></details>';
  }
  host.innerHTML = html;
  host.querySelectorAll('[data-stew-hl]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.stewHl;
    const set = new Set(STEW_FORM.hl.map(String));
    if (set.has(k)) set.delete(k); else set.add(k);
    STEW_FORM.hl = [...set];
    renderStewReport();
  }));
  const hlClear = host.querySelector('[data-stew-hl-clear]');
  if (hlClear) hlClear.addEventListener('click', () => { STEW_FORM.hl = []; renderStewReport(); });
  const hlOnly = document.getElementById('stew-hl-only');
  if (hlOnly) hlOnly.addEventListener('change', () => { STEW_FORM.hlOnly = hlOnly.checked; renderStewReport(); });
  const det = document.getElementById('stew-odds');
  if (det) det.addEventListener('toggle', () => { STEW_FORM.showOdds = det.open; });
}

function runStewAction(mode) {
  stewSyncState();
  const rows = arr(AP && AP.stewOdds);
  const cur = stewQueue();
  const rarity = STEW_FORM.rarity;
  const rng = stewRng(STEW_FORM.seed);
  const lines = [];
  let length = parseInt(STEW_FORM.count, 10);
  if (!(length > 0)) length = cur && cur.length ? cur.length : 200;
  length = Math.min(length, STEW_MAX_LEN);
  if (mode === 'revert') {
    if (STEW_STATE.hadQueue) setStewQueue(STEW_STATE.original.slice());
    else if (RAW_SAV_ROOT.soul && RAW_SAV_ROOT.soul.skl && RAW_SAV_ROOT.soul.skl.gacha && RAW_SAV_ROOT.soul.skl.gacha.normal) delete RAW_SAV_ROOT.soul.skl.gacha.normal.sklids;
    lines.push('Stew queue restored to how it was when you loaded the save.');
  } else if (mode === 'front') {
    const pick = cur.filter(s => stewRarity(s) === rarity);
    const rest = cur.filter(s => stewRarity(s) !== rarity);
    setStewQueue(rest.concat(pick)); // game pulls from the END
    if (!pick.length) lines.push(`No rarity-${rarity} pulls in the queue. Nothing moved.`);
    else {
      lines.push(`Moved ${pick.length} rarity-${rarity} pull(s) to the front of the queue (${cur.length} total).`);
      for (const s of pick.slice().reverse().slice(0, 12)) lines.push(`   ${stewName(s)}  (${s})`);
      if (pick.length > 12) lines.push(`   ... and ${pick.length - 12} more`);
    }
  } else if (mode === 'dedupe') {
    const res = stewDedupe(cur, stewOwnedDecals(), rows, rarity, rng);
    setStewQueue(res.newq);
    if (!res.swapped.length && res.startedEmpty) lines.push(`You already own every rarity-${rarity} decal in the pool. Nothing to swap in.`);
    else if (!res.swapped.length) lines.push(`No rarity-${rarity} pull in the queue would repeat one you already have. Nothing changed.`);
    else {
      lines.push(`Deduped ${res.swapped.length} rarity-${rarity} pull(s) that would have repeated a decal you already have. Swapped in ones that are new to you:`);
      for (const [o, n] of res.swapped.slice(0, 20)) lines.push(`   ${stewName(o)}  ->  ${stewName(n)}`);
      if (res.swapped.length > 20) lines.push(`   ... and ${res.swapped.length - 20} more`);
      if (res.ranOut) lines.push(`Ran out of rarity-${rarity} decals you don't own partway through. Left ${res.ranOut} repeat pull(s) unchanged.`);
    }
  } else if (mode === 'clear') {
    setStewQueue([]);
    lines.push('Cleared the queue. The game rebuilds it from the current odds on your next stew.');
  } else { // regen / stack
    const newq = stewMakeQueue(rows, length, mode === 'stack' ? rarity : null, rng);
    setStewQueue(newq);
    lines.push(mode === 'stack' ? `Stacked ${length} rarity-${rarity} pulls.` : `Rerolled ${length} pulls from the game's normal odds.`);
    lines.push(`  before: ${stewHistText(cur || [])}`);
    lines.push(`  after : ${stewHistText(newq)}`);
  }
  STEW_STATE.lastMsg = lines.join('\n');
  renderStewReport();
  toast(lines[0]);
}

function wireStews() {
  if (!document.getElementById('stew-report')) return;
  stewSyncState();
  const sel = document.getElementById('stew-rarity');
  const rs = stewRarities();
  if (STEW_FORM.rarity == null || !rs.includes(STEW_FORM.rarity)) STEW_FORM.rarity = rs[0];
  sel.innerHTML = rs.map(r => `<option value="${r}" ${r === STEW_FORM.rarity ? 'selected' : ''}>Rarity ${r}</option>`).join('');
  sel.addEventListener('change', () => { STEW_FORM.rarity = Number(sel.value); });
  const cnt = document.getElementById('stew-count'), seed = document.getElementById('stew-seed'), ahead = document.getElementById('stew-ahead');
  cnt.value = STEW_FORM.count;
  seed.value = STEW_FORM.seed;
  ahead.value = STEW_FORM.ahead;
  cnt.addEventListener('change', () => {
    let v = parseInt(cnt.value, 10);
    if (cnt.value !== '' && !(v > 0)) v = 1;
    if (v > STEW_MAX_LEN) { v = STEW_MAX_LEN; toast(`Clamped to ${STEW_MAX_LEN}`); }
    STEW_FORM.count = cnt.value === '' ? '' : String(v);
    cnt.value = STEW_FORM.count;
  });
  seed.addEventListener('change', () => { STEW_FORM.seed = seed.value; });
  ahead.addEventListener('change', () => { STEW_FORM.ahead = ahead.value; renderStewReport(); });
  const zeroOwned = document.getElementById('stew-zero-owned');
  zeroOwned.checked = STEW_FORM.zeroOwned;
  zeroOwned.addEventListener('change', () => { STEW_FORM.zeroOwned = zeroOwned.checked; renderStewReport(); });
  const showAll = document.getElementById('stew-showall');
  showAll.checked = STEW_FORM.showAll;
  ahead.disabled = STEW_FORM.showAll;
  showAll.addEventListener('change', () => { STEW_FORM.showAll = showAll.checked; ahead.disabled = showAll.checked; renderStewReport(); });
  document.querySelectorAll('[data-stew]').forEach(b => b.addEventListener('click', () => {
    try { runStewAction(b.dataset.stew); }
    catch (err) { toast('Stew edit failed: ' + err.message, true); }
  }));
  if (activeTab === 'stews') renderStewReport();
}

// ---------------------------------------------------------------------------
// DATES tab
// Finds every timestamp in the save (Unix seconds), shows them relative to a
// reference time (this PC's clock by default) and flags the kinds of values
// that time-jumping leaves behind:
//   - future   : an event dated after the reference time (created/modified...)
//   - post2038 : after 2038-01-19 03:14:07 UTC, which no longer fits in a
//                signed 32-bit number
//   - wrapped  : negative values; a post-2038 date that already overflowed
// Fixes are stored as rules and applied to the finished save at download time
// (after buildRawSavRootFromSave), so they never fight the other tabs' edits.
// ---------------------------------------------------------------------------

const DT_INT32_MAX = 2147483647;
const DT_TOLERANCE = 300; // seconds of clock slack before "future" is flagged
const DT_KEY_RE = /(time|date|created|modified|updated|expire|opentime|^order$|whistle_limit)/i;
const DT_DEADLINE_RE = /(expire|opentime|whistle_limit|guard_time)/i;
const DT_UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let DATE_RULES = [];
const DATE_FORM = { refMode: 'pc', refCustom: null, open: {}, onlyProblems: false };

const DT_LABELS = {
  'user.created': 'Account created',
  'user.modified': 'Account last saved',
  'user.last_login_date': 'Last login day',
  'user.migrated': 'Save migrated to offline',
  'login_bonus[].login_date': 'Login bonus history (one per day)',
  'soul.modified': 'Save data last written',
  'soul.area_start_time': 'Current run started',
  'soul.last_visiting_shop_time': 'Last shop visit',
  'soul.last_rcv_deathbox_time': 'Last death box received',
  'soul.last_tdm_reset_time': 'Last TDM weekly reset',
  'soul.abduct_guard_time': 'Kidnap protection ends',
  'soul.whistle_limit': 'Whistle expires',
  'soul.vip.expired_time': 'Death Metal (VIP) expires',
  'soul.vip.last_use_day': 'Death Metal (VIP) last used',
  'soul.mail[].created': 'Mail received',
  'soul.present[].created': 'Reward box items received',
  'soul.skl.psskl[].updated': 'Decals obtained / updated',
  'soul.deathbox[].created': 'Death boxes created',
  'soul.deathbox[].opentime': 'Death boxes open at',
  'soul.prison.*[].expire_time': 'Prison (kidnapped fighter) timers',
  'soul.prison.*[].last_collect_time': 'Prison last collected',
  'soul.quest.ord[].order': 'Quests accepted',
  'soul.quest.ord[].expire': 'Quests expire',
  'soul.relationship.revenge.*[].modified': 'Revenge list',
  'soul.screenshot[].created': 'Screenshots',
  'soul.unlockfighter[].created': 'Fighters unlocked',
  'abduct[].created': 'Kidnappings started',
  'abduct[].expire': 'Kidnappings expire',
  'abduct[].modified': 'Kidnappings updated',
  'item.items[].gettime': 'Items obtained',
  'part.pts.*[].created': 'Weapons & gear created',
  'part.pts.*[].modified': 'Weapons & gear modified',
  'part.pts.*[].gettime': 'Weapons & gear obtained',
  'mushroom.msrs[].gettime': 'Mushrooms obtained',
  'beast.bsts[].gettime': 'Beasts obtained',
  'clear_times.*': 'Floor clear times',
  'diedchara.dchrarcs.*[].created': 'Dead fighter archive',
  'diedchara.dchrs.*[].created': 'Dead fighters',
  'diedchara.hunter.match.*[].expire': 'Hunter matching expires',
  'dummy.user[].created': 'Other players (dummy) created',
  'floor.match[].expire': 'Floor matching expires',
  'floor.stamp.stamps[].created': 'Floor stamps',
  'fortresult[].endtime': 'Tokyo Death Metro results',
  'gameflg.cl[].modified': 'Game flags (client)',
  'gameflg.sv[].modified': 'Game flags (server)',
  'shp.expired_time': 'Shop stock expires',
  'team[].last_war_time': 'Teams: last war',
  'team[].modified': 'Teams updated',
  'teamhate[].modified': 'Team grudges (TDM)',
  'teammember.created': 'Joined team',
  'teammember.modified': 'Team membership updated'
};

function dtIsDateValue(v) {
  return typeof v === 'number' && Number.isFinite(v) && ((v >= 1e9 && v < 4294967296) || (v <= -1e8 && v >= -2147483648));
}

function dtScan(root) {
  const groups = new Map();
  function add(pattern, obj, key, v, lastKey) {
    let g = groups.get(pattern);
    if (!g) {
      g = { pattern, label: DT_LABELS[pattern] || pattern, deadline: DT_DEADLINE_RE.test(lastKey), entries: [] };
      groups.set(pattern, g);
    }
    g.entries.push({ obj, key, v });
  }
  function walk(o, path, parentKey) {
    if (Array.isArray(o)) {
      for (let i = 0; i < o.length; i++) {
        const v = o[i];
        if (v && typeof v === 'object') walk(v, path + '[]', parentKey);
      }
      return;
    }
    if (!o || typeof o !== 'object') return;
    for (const k of Object.keys(o)) {
      const v = o[k];
      const wild = /^-?\d+$/.test(k) || DT_UUID_RE.test(k) || parentKey === 'clear_times';
      const seg = wild ? '*' : k;
      const p = path ? path + '.' + seg : seg;
      if (typeof v === 'number') {
        const nameKey = wild ? parentKey : k;
        if (DT_KEY_RE.test(nameKey) && dtIsDateValue(v)) add(p, o, k, v, nameKey);
      } else if (v && typeof v === 'object') walk(v, p, k);
    }
  }
  walk(root, '', '');
  return [...groups.values()];
}

function dtRefTime() {
  if (DATE_FORM.refMode === 'custom' && DATE_FORM.refCustom != null) return DATE_FORM.refCustom;
  return Math.floor(Date.now() / 1000);
}

function dtProblem(g, v, ref) {
  if (v < 0) return 'wrapped';
  if (v > DT_INT32_MAX) return 'post2038';
  if (!g.deadline && v > ref + DT_TOLERANCE) return 'future';
  return null;
}

function dtFmt(v) {
  if (v < 0) return `overflowed (${v})`;
  const d = new Date(v * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function dtRel(v, ref) {
  if (v < 0) return 'after 2038 (wrapped)';
  const s = v - ref, a = Math.abs(s);
  const units = [[31557600, 'year'], [2629800, 'month'], [86400, 'day'], [3600, 'hour'], [60, 'minute']];
  let txt = 'now';
  for (const [n, u] of units) if (a >= n) { const k = Math.floor(a / n); txt = `${k} ${u}${k === 1 ? '' : 's'}`; break; }
  if (txt === 'now') return 'about now';
  return s > 0 ? `in ${txt}` : `${txt} ago`;
}

function dtToLocalInput(v) {
  if (v == null || v < 0) return '';
  const d = new Date(v * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dtFromLocalInput(s) {
  if (!s) return null;
  const t = new Date(s).getTime();
  return Number.isFinite(t) ? Math.floor(t / 1000) : null;
}

function dtIdLabel(obj, key) {
  if (!obj || typeof obj !== 'object') return key;
  for (const f of ['nm', 'name', 'sklid', 'itemid', 'ptid', 'msrid', 'bstid', 'abid', 'cid', 'tid', 'id', 'type']) {
    if (obj[f] != null && obj[f] !== '' && typeof obj[f] !== 'object') {
      const raw = String(obj[f]);
      const idx = f === 'sklid' ? SKL_INDEX[raw] : f === 'itemid' ? ITEM_INDEX[raw] : f === 'ptid' ? PT_INDEX[raw] : f === 'msrid' ? MSR_INDEX[raw] : f === 'bstid' ? BST_INDEX[raw] : null;
      return idx && idx.name ? idx.name : raw;
    }
  }
  return key;
}

// Apply one fix rule to a finished save root.
function dtApplyRule(root, rule) {
  const groups = dtScan(root);
  if (rule.action === 'set') {
    const g = groups.find(x => x.pattern === rule.pattern);
    if (!g || g.entries.length !== 1) return 0;
    const e = g.entries[0];
    if (e.v !== rule.from) return 0; // something else changed it since; that edit wins
    e.obj[e.key] = rule.value;
    return 1;
  }
  const targets = rule.pattern === '*' ? groups : groups.filter(x => x.pattern === rule.pattern);
  const ref = rule.ref;
  const refDay = Math.floor(ref / 86400) * 86400;
  let n = 0;
  for (const g of targets) {
    if (g.pattern === 'login_bonus[].login_date') {
      // one entry per day: drop the days that haven't happened yet instead of
      // stacking copies of "today"
      if (Array.isArray(root.login_bonus)) {
        const before = root.login_bonus.length;
        root.login_bonus = root.login_bonus.filter(e => !(e && dtIsDateValue(e.login_date) && dtProblem(g, e.login_date, refDay + 86399)));
        n += before - root.login_bonus.length;
      }
      continue;
    }
    const isDay = /login_date$/.test(g.pattern);
    for (const e of g.entries) {
      if (!dtProblem(g, e.v, ref)) continue;
      e.obj[e.key] = isDay ? refDay : ref;
      n++;
    }
  }
  return n;
}

function applyDateRules(root) {
  for (const r of DATE_RULES) r.applied = dtApplyRule(root, r);
  return root;
}

function dtBuildRoot() {
  const root = buildRawSavRootFromSave(SAVE, RAW_SAV_ROOT, RAW_SAV_MAIN_UID);
  return applyDateRules(root);
}

function blockDates() {
  return `<section class="block">
    <div class="block-head"><div><div class="eyebrow">Time</div><h2>Dates</h2></div></div>
    <div class="block-body">
      <div class="capNote" style="margin-top:0;">Every date stored in your save, compared with a reference time. Moving your PC clock forward and then back leaves dates "in the future", and going past 2038 makes dates overflow into negative numbers. Either can crash the game. Fixes here only change the dates that are wrong, and are applied when you download the .sav. Close the game first and keep a copy of your original save.</div>
      <div id="dt-body"></div>
    </div>
  </section>`;
}

function renderDates() {
  const host = document.getElementById('dt-body');
  if (!host || !SAVE) return;
  if (!RAW_SAV_ROOT) { host.innerHTML = '<div class="warnNote">The Dates tab needs a .sav (or the full .json dump).</div>'; return; }
  let root;
  try { root = dtBuildRoot(); } catch (err) { host.innerHTML = `<div class="warnNote">Could not read dates: ${escapeHtml(err.message)}</div>`; return; }
  const ref = dtRefTime();
  const pcNow = Math.floor(Date.now() / 1000);
  const groups = dtScan(root);
  let latest = null, total = 0;
  const counts = { future: 0, post2038: 0, wrapped: 0 };
  for (const g of groups) {
    g.problems = [];
    g.min = Infinity; g.max = -Infinity;
    for (const e of g.entries) {
      total++;
      const pr = dtProblem(g, e.v, ref);
      if (pr) { counts[pr]++; g.problems.push(Object.assign({ pr }, e)); }
      const eff = e.v < 0 ? e.v + 4294967296 : e.v;
      if (eff < g.min) g.min = eff;
      if (eff > g.max) { g.max = eff; }
      if (!g.deadline && (!latest || eff > latest.v)) latest = { v: eff, g };
    }
  }
  groups.sort((a, b) => (b.problems.length > 0) - (a.problems.length > 0) || b.max - a.max);
  const probTotal = counts.future + counts.post2038 + counts.wrapped;
  const saved = root.user && dtIsDateValue(root.user.modified) ? root.user.modified : root.soul && dtIsDateValue(root.soul.modified) ? root.soul.modified : null;

  let h = `<div class="stewStats">
    <div class="stewStat"><div class="k">Reference time</div><div class="v" style="font-size:15px;">${dtFmt(ref)}</div><div class="s">${DATE_FORM.refMode === 'pc' ? "this PC's clock right now" : `custom, ${dtRel(ref, pcNow)} vs this PC`}</div></div>
    <div class="stewStat"><div class="k">Save last written</div><div class="v" style="font-size:15px;">${saved != null ? dtFmt(saved) : 'unknown'}</div><div class="s">${saved != null ? dtRel(saved, ref) : ''}</div></div>
    <div class="stewStat"><div class="k">Latest event date</div><div class="v" style="font-size:15px;">${latest ? dtFmt(latest.v) : '-'}</div><div class="s">${latest ? escapeHtml(latest.g.label) + ', ' + dtRel(latest.v, ref) : ''}</div></div>
    <div class="stewStat"><div class="k">Dates found</div><div class="v">${total}</div><div class="s">${groups.length} kinds</div></div>
  </div>`;
  h += `<div class="toolbar" style="margin-bottom:12px;">
    <label class="stewHlOnly" style="margin:0;"><input type="radio" name="dt-ref" value="pc" ${DATE_FORM.refMode === 'pc' ? 'checked' : ''}> Use this PC's clock</label>
    <label class="stewHlOnly" style="margin:0;"><input type="radio" name="dt-ref" value="custom" ${DATE_FORM.refMode === 'custom' ? 'checked' : ''}> Use a custom time:</label>
    <input type="datetime-local" id="dt-ref-custom" value="${dtToLocalInput(DATE_FORM.refCustom != null ? DATE_FORM.refCustom : pcNow)}" style="background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:5px 8px; font-family:var(--mono); font-size:12px; color-scheme:dark;">
  </div>`;
  if (probTotal) {
    h += `<div class="warnNote" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;"><div style="flex:1; min-width:240px;"><b>${probTotal} problem date${probTotal === 1 ? '' : 's'} found.</b> ${[counts.future && `${counts.future} in the future`, counts.post2038 && `${counts.post2038} past the 2038 limit`, counts.wrapped && `${counts.wrapped} already overflowed (negative)`].filter(Boolean).join(', ')}. Fixing sets them to the reference time. Future login-bonus days are removed instead, and expiry timers are only changed if they overflow.</div><button class="action" id="dt-fix-all">Fix all problems</button></div>`;
  } else {
    h += `<div class="warnNote" style="border-color:var(--good); color:var(--good-bright);">No problem dates relative to ${dtFmt(ref)}.</div>`;
  }
  if (DATE_RULES.length) {
    h += `<div class="subDetails" style="padding:8px 10px;"><div style="font-size:11px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px;">Pending date fixes (applied when you download)</div>`;
    h += DATE_RULES.map((r, i) => `<div class="listRow" style="padding:4px 0;"><div class="name">${r.action === 'set' ? `Set ${escapeHtml(DT_LABELS[r.pattern] || r.pattern)} to ${dtFmt(r.value)}` : `Fix ${r.pattern === '*' ? 'all problem dates' : escapeHtml(DT_LABELS[r.pattern] || r.pattern)} (reference ${dtFmt(r.ref)})`}</div><span class="id">${r.applied || 0} changed</span><button class="subtle" data-dt-undo="${i}">Undo</button></div>`).join('');
    h += `<div style="margin-top:6px;"><button class="subtle" id="dt-undo-all">Undo all date fixes</button></div></div>`;
  }
  h += `<label class="stewHlOnly" style="margin:4px 0 8px;"><input type="checkbox" id="dt-only-prob" ${DATE_FORM.onlyProblems ? 'checked' : ''}> Only show kinds with problems</label>`;
  h += '<table class="stewTable dtTable"><thead><tr><th>What</th><th>Count</th><th>Earliest</th><th>Latest</th><th>Problems</th><th></th></tr></thead><tbody>';
  for (const g of groups) {
    if (DATE_FORM.onlyProblems && !g.problems.length) continue;
    const single = g.entries.length === 1;
    const open = !!DATE_FORM.open[g.pattern];
    const pc = { future: 0, post2038: 0, wrapped: 0 };
    for (const p of g.problems) pc[p.pr]++;
    const probTxt = g.problems.length ? [pc.future && `${pc.future} future`, pc.post2038 && `${pc.post2038} past 2038`, pc.wrapped && `${pc.wrapped} overflowed`].filter(Boolean).join(', ') : '<span style="color:var(--text-faint);">ok</span>';
    h += `<tr class="${g.problems.length ? 'dtBad' : ''}"><td><a href="#" class="dtToggle" data-dt-open="${escapeHtml(g.pattern)}">${open ? '▾' : '▸'} ${escapeHtml(g.label)}</a>${g.deadline ? ' <span class="badge">timer</span>' : ''}<div class="id" style="font-size:10px; color:var(--text-faint);">${escapeHtml(g.pattern)}</div></td>
      <td>${g.entries.length}</td>
      <td>${single ? '' : `${dtFmt(g.min)}<div class="dtRel">${dtRel(g.min, ref)}</div>`}</td>
      <td>${dtFmt(g.max)}<div class="dtRel">${dtRel(g.max, ref)}</div></td>
      <td>${probTxt}</td>
      <td style="white-space:nowrap;">${g.problems.length ? `<button class="subtle" data-dt-fix="${escapeHtml(g.pattern)}">Fix</button>` : ''}</td></tr>`;
    if (open) {
      h += `<tr><td colspan="6" style="background:var(--bg);">`;
      if (single) {
        const e = g.entries[0];
        h += `<div class="toolbar" style="margin:4px 0;"><span style="font-size:11.5px; color:var(--text-dim);">Set to:</span><input type="datetime-local" data-dt-input="${escapeHtml(g.pattern)}" value="${dtToLocalInput(e.v < 0 ? ref : e.v)}" style="background:var(--panel); border:1px solid var(--panel-border); color:var(--text); padding:5px 8px; font-family:var(--mono); font-size:12px; color-scheme:dark;"><button class="subtle" data-dt-set="${escapeHtml(g.pattern)}" data-dt-from="${e.v}">Apply</button><button class="subtle" data-dt-setref="${escapeHtml(g.pattern)}" data-dt-from="${e.v}">Set to reference time</button><span class="id">current value ${e.v}</span></div>`;
      } else {
        const list = (g.problems.length ? g.problems : g.entries.slice().sort((a, b) => b.v - a.v)).slice(0, 100);
        h += `<div style="font-size:11px; color:var(--text-dim); margin:2px 0 4px;">${g.problems.length ? `Problem entries${g.problems.length > 100 ? ' (first 100)' : ''}` : `Newest entries${g.entries.length > 100 ? ' (first 100)' : ''}`}</div>`;
        h += list.map(e => `<div class="listRow" style="padding:3px 0;"><div class="name">${escapeHtml(dtIdLabel(e.obj, e.key))}</div><span>${dtFmt(e.v)}</span><span class="dtRel" style="width:150px; text-align:right;">${dtRel(e.v, ref)}</span></div>`).join('');
      }
      h += '</td></tr>';
    }
  }
  h += '</tbody></table>';
  host.innerHTML = h;

  host.querySelectorAll('input[name="dt-ref"]').forEach(r => r.addEventListener('change', () => {
    DATE_FORM.refMode = r.value;
    if (r.value === 'custom' && DATE_FORM.refCustom == null) DATE_FORM.refCustom = dtFromLocalInput(document.getElementById('dt-ref-custom').value);
    renderDates();
  }));
  document.getElementById('dt-ref-custom').addEventListener('change', e => {
    const v = dtFromLocalInput(e.target.value);
    if (v != null) { DATE_FORM.refCustom = v; DATE_FORM.refMode = 'custom'; renderDates(); }
  });
  document.getElementById('dt-only-prob').addEventListener('change', e => { DATE_FORM.onlyProblems = e.target.checked; renderDates(); });
  host.querySelectorAll('[data-dt-open]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const k = a.dataset.dtOpen;
    DATE_FORM.open[k] = !DATE_FORM.open[k];
    renderDates();
  }));
  const addRule = (rule, msg) => {
    DATE_RULES.push(rule);
    renderDates();
    const r = DATE_RULES[DATE_RULES.length - 1];
    toast(`${msg}: ${r.applied || 0} date${r.applied === 1 ? '' : 's'} changed`);
  };
  const fixAll = document.getElementById('dt-fix-all');
  if (fixAll) fixAll.addEventListener('click', () => addRule({ action: 'fix', pattern: '*', ref: dtRefTime() }, 'Fixed problem dates'));
  host.querySelectorAll('[data-dt-fix]').forEach(b => b.addEventListener('click', () => addRule({ action: 'fix', pattern: b.dataset.dtFix, ref: dtRefTime() }, 'Fixed')));
  host.querySelectorAll('[data-dt-set]').forEach(b => b.addEventListener('click', () => {
    const inp = host.querySelector(`[data-dt-input="${CSS.escape(b.dataset.dtSet)}"]`);
    const v = dtFromLocalInput(inp && inp.value);
    if (v == null) return toast('Pick a date and time first', true);
    addRule({ action: 'set', pattern: b.dataset.dtSet, from: Number(b.dataset.dtFrom), value: v }, 'Date set');
  }));
  host.querySelectorAll('[data-dt-setref]').forEach(b => b.addEventListener('click', () => addRule({ action: 'set', pattern: b.dataset.dtSetref, from: Number(b.dataset.dtFrom), value: dtRefTime() }, 'Date set')));
  host.querySelectorAll('[data-dt-undo]').forEach(b => b.addEventListener('click', () => { DATE_RULES.splice(Number(b.dataset.dtUndo), 1); renderDates(); toast('Date fix undone'); }));
  const undoAll = document.getElementById('dt-undo-all');
  if (undoAll) undoAll.addEventListener('click', () => { DATE_RULES = []; renderDates(); toast('All date fixes undone'); });
}

function wireDates() {
  if (activeTab === 'dates') renderDates();
}

// ---------------------------------------------------------------------------
// LOST BAGS (soul.mysterybag) and DEATH BOXES (soul.deathbox)
// Lost Bags (earned from Tokyo Death Metro attacks/defenses) are pre-rolled
// like stews: soul.mysterybag holds, per rarity, a list of content ids
// (MYSTERYBAG_GEN_*) that master_mysterybag_content_gen[_odds] maps to a
// master_reward. Death boxes are stored with their contents already filled in
// ({rarity, type, num, val0.., created, opentime}); the pool for each rarity
// is master_deathbox_content_gen -> master_reward.
// SAVE.soul.mysterybag / SAVE.soul.deathbox are the objects the save is
// rebuilt from, so edits here ship with Download .sav.
// ---------------------------------------------------------------------------

const BAG_RARITIES = [ 'RAINBOW', 'PLATINUM', 'GOLD', 'SILVER', 'COPPER' ];
const BAG_COLORS = { RAINBOW: '#e6b422', PLATINUM: '#b07cf0', GOLD: '#d9a520', SILVER: '#b8c0c8', COPPER: '#c47a44', BLUE: '#4ea3ef' };
const BOX_RARITIES = [ 'GOLD', 'SILVER', 'COPPER', 'BLUE' ];
let BAG_STATE = { root: null, original: null, lastMsg: '' };
let BOX_STATE = { root: null, original: null, lastMsg: '' };
const BAG_FORM = { open: {}, fill: {} };
const BOX_FORM = { addRarity: 'GOLD', addContent: '' };

function bagTitle(r) { return r.charAt(0) + r.slice(1).toLowerCase(); }
function bagChip(r) { return `<span class="badge" style="border-color:${BAG_COLORS[r] || 'var(--panel-border-bright)'}; color:${BAG_COLORS[r] || 'var(--text)'};">${bagTitle(r)}</span>`; }

// reward -> readable name (shared by both tabs)
function rewardLabel(type, num, v0) {
  const n = num > 1 ? ` ×${Number(num).toLocaleString()}` : '';
  if (type === 'MONEY') return `${Number(num).toLocaleString()} Kill Coins`;
  if (type === 'SPIRIT') return `${Number(num).toLocaleString()} SPLithium`;
  let nm = null;
  if (type === 'SKILL') nm = SKL_INDEX[v0] && `Decal: ${SKL_INDEX[v0].name}`;
  else if (type === 'MUSHROOM') nm = MSR_INDEX[v0] && `Mushroom: ${MSR_INDEX[v0].name}`;
  else if (type === 'BEAST') nm = BST_INDEX[v0] && `Beast: ${BST_INDEX[v0].name}`;
  else if (ITEM_INDEX[v0]) {
    const bp = String(v0).startsWith('ITMP_') && PT_INDEX[String(v0).replace(/^ITMP_/, 'PT_')];
    nm = bp ? `Blueprint: ${bp.name}` : ITEM_INDEX[v0].name;
  } else if (PT_INDEX[v0]) nm = PT_INDEX[v0].name;
  return (nm || `${type} ${v0 || ''}`.trim()) + (type === 'MONEY' || type === 'SPIRIT' ? '' : n);
}
function rwdRow(rwdid) {
  const r = questMeta().rwd[rwdid];
  return r || null;
}
function rewardName(rwdid) {
  const r = rwdRow(rwdid);
  if (!r) return rwdid || '?';
  if (r.type === 'MONEY' && /MEDAL/.test(rwdid)) return 'Death Metal';
  return rewardLabel(r.type, r.num, r.val0);
}

// ---------------- Lost Bags ----------------
function bagData() {
  const s = SAVE && SAVE.soul;
  if (!s || !s.mysterybag || typeof s.mysterybag !== 'object' || Array.isArray(s.mysterybag)) return null;
  return s.mysterybag;
}
function bagSync() {
  if (BAG_STATE.root !== RAW_SAV_ROOT) {
    const b = bagData();
    BAG_STATE = { root: RAW_SAV_ROOT, original: b ? JSON.parse(JSON.stringify(b)) : null, lastMsg: '' };
  }
}
// every content id we know about -> {id, rarity, freq, rwdid}
function bagGenIndex() {
  const idx = {};
  for (const r of arr(AP && AP.bagGen)) idx[r.id] = r;
  for (const r of arr(AP && AP.bagGenOdds)) idx[r.id] = Object.assign({}, idx[r.id] || {}, r);
  return idx;
}
// the pool the game rolls from: the offline odds table, else the base table
function bagPool(rarity) {
  const odds = arr(AP && AP.bagGenOdds).filter(r => r.rarity === rarity && r.freq > 0);
  const rows = odds.length ? odds : arr(AP && AP.bagGen).filter(r => r.rarity === rarity && r.freq > 0);
  const tot = rows.reduce((a, r) => a + r.freq, 0) || 1;
  return rows.map(r => ({ id: r.id, rwdid: r.rwdid, freq: r.freq, p: r.freq / tot, name: rewardName(r.rwdid) }));
}
function bagRoll(pool, n, rng) {
  const tot = pool.reduce((a, r) => a + r.freq, 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    let x = rng() * tot, pick = pool[pool.length - 1];
    for (const r of pool) { x -= r.freq; if (x < 0) { pick = r; break; } }
    out.push(pick.id);
  }
  return out;
}

function blockBags() {
  return `<section class="block">
    <div class="block-head"><div><div class="eyebrow">Mystery bags · Tokyo Death Metro</div><h2>Lost Bags</h2></div></div>
    <div class="block-body">
      <div class="capNote" style="margin-top:0;">What each Lost Bag rarity will give is rolled in advance and stored in your save, a short list per rarity. The contents are picked when you <b>earn</b> a bag, so these lists decide future bags only; bags already in your Reward Box keep what they have (change those on the Rewards tab). The game takes the top entry of the list and doesn't refill it, so #1 is your next bag of that rarity (confirmed in game).</div>
      <div id="bag-body"></div>
    </div>
  </section>`;
}

function renderBags() {
  const host = document.getElementById('bag-body');
  if (!host || !SAVE) return;
  bagSync();
  const b = bagData();
  if (!b) { host.innerHTML = '<div class="warnNote">This save has no Lost Bag data (soul.mysterybag).</div>'; return; }
  const gen = bagGenIndex();
  const changed = JSON.stringify(b) !== JSON.stringify(BAG_STATE.original);
  let h = '';
  if (changed) h += `<div class="warnNote" style="display:flex; gap:10px; align-items:center; border-color:var(--good); color:var(--good-bright);"><div style="flex:1;">Lost Bags changed. Download the .sav to keep it.</div><button class="subtle" id="bag-undo">Undo all Lost Bag changes</button></div>`;
  if (BAG_STATE.lastMsg) h += `<pre class="stewLog">${escapeHtml(BAG_STATE.lastMsg)}</pre>`;
  const rars = BAG_RARITIES.filter(r => r in b).concat(Object.keys(b).filter(r => !BAG_RARITIES.includes(r)));
  for (const r of rars) {
    const list = arr(b[r]);
    const pool = bagPool(r);
    const order = list.map((e, i) => ({ e, i })); // the game takes the FIRST entry (confirmed in game)
    const fillSel = BAG_FORM.fill[r] || (pool[0] && pool[0].id) || '';
    h += `<div class="subDetails" style="padding:10px; margin-bottom:12px;">
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px;">
        <b style="color:${BAG_COLORS[r] || 'var(--text)'}; font-size:14px;">${bagTitle(r)} Lost Bag</b>
        <span class="id">${list.length} pre-rolled</span>
        <span style="flex:1;"></span>
        <select data-bag-fillsel="${r}" style="max-width:320px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:5px 6px; font-family:var(--mono); font-size:11.5px;">
          ${pool.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}" ${p.id === fillSel ? 'selected' : ''}>${escapeHtml(p.name)} (${(100 * p.p).toFixed(1)}%)</option>`).join('')}
        </select>
        <button class="subtle" data-bag-fill="${r}" ${pool.length ? '' : 'disabled'}>Fill all with this</button>
        <button class="subtle" data-bag-reroll="${r}" ${pool.length ? '' : 'disabled'}>Fair reroll</button>
      </div>
      <div class="listBlock" style="max-height:none;">`;
    h += order.map((x, k) => {
      const g = gen[x.e.cntgen];
      const nm = g ? rewardName(g.rwdid) : x.e.cntgen;
      const p = pool.find(pp => pp.id === x.e.cntgen);
      return `<div class="listRow"><span style="width:34px; color:var(--text-faint);">${k + 1}.</span>
        <div class="name">${escapeHtml(nm)}${p ? '' : ' <span class="badge" title="Not in the current offline pool">not in pool</span>'}</div>
        <select data-bag-slot="${r}:${x.i}" style="max-width:260px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:3px 6px; font-family:var(--mono); font-size:11px;">
          ${p ? '' : `<option value="${escapeHtml(x.e.cntgen)}" selected>${escapeHtml(nm)}</option>`}
          ${pool.slice().sort((a, b) => a.name.localeCompare(b.name)).map(pp => `<option value="${pp.id}" ${pp.id === x.e.cntgen ? 'selected' : ''}>${escapeHtml(pp.name)}</option>`).join('')}
        </select>
        <div class="id" style="width:190px; text-align:right;">${escapeHtml(x.e.cntgen)}</div></div>`;
    }).join('') || '<div style="padding:8px; color:var(--text-faint); font-size:12px;">Empty. The game rolls a new list when needed.</div>';
    h += '</div>';
    const open = !!BAG_FORM.open[r];
    h += `<details class="subDetails" data-bag-odds="${r}" style="margin:8px 0 0;" ${open ? 'open' : ''}><summary>▸ ${bagTitle(r)} pool (${pool.length} possible rewards)</summary><div class="subDetailsBody"><table class="stewTable"><tbody>`;
    h += pool.slice().sort((a, b) => a.p - b.p).map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${(100 * p.p).toFixed(2)}%</td><td class="dtRel">${p.id}</td></tr>`).join('');
    h += '</tbody></table></div></details></div>';
  }
  host.innerHTML = h;

  const redo = msg => { BAG_STATE.lastMsg = msg || ''; renderBags(); if (msg) toast(msg.split('\n')[0]); };
  const undo = document.getElementById('bag-undo');
  if (undo) undo.addEventListener('click', () => {
    const o = JSON.parse(JSON.stringify(BAG_STATE.original));
    for (const k of Object.keys(b)) delete b[k];
    Object.assign(b, o);
    redo('Lost Bags restored to how they were when you loaded the save.');
  });
  host.querySelectorAll('[data-bag-fillsel]').forEach(s => s.addEventListener('change', () => { BAG_FORM.fill[s.dataset.bagFillsel] = s.value; }));
  host.querySelectorAll('[data-bag-fill]').forEach(btn => btn.addEventListener('click', () => {
    const r = btn.dataset.bagFill;
    const sel = host.querySelector(`[data-bag-fillsel="${r}"]`);
    const id = sel && sel.value;
    if (!id) return;
    const n = arr(b[r]).length || 10;
    b[r] = Array.from({ length: n }, () => ({ rarity: r, cntgen: id }));
    redo(`Filled all ${n} ${bagTitle(r)} Lost Bags with ${rewardName(gen[id] && gen[id].rwdid)}.`);
  }));
  host.querySelectorAll('[data-bag-reroll]').forEach(btn => btn.addEventListener('click', () => {
    const r = btn.dataset.bagReroll;
    const n = arr(b[r]).length || 10;
    b[r] = bagRoll(bagPool(r), n, Math.random).map(id => ({ rarity: r, cntgen: id }));
    redo(`Rerolled ${n} ${bagTitle(r)} Lost Bags from the game's odds.`);
  }));
  host.querySelectorAll('[data-bag-slot]').forEach(s => s.addEventListener('change', () => {
    const [r, i] = s.dataset.bagSlot.split(':');
    const e = b[r][Number(i)];
    e.cntgen = s.value;
    redo(`${bagTitle(r)} slot set to ${rewardName(gen[s.value] && gen[s.value].rwdid)}.`);
  }));
  host.querySelectorAll('[data-bag-odds]').forEach(d => d.addEventListener('toggle', () => { BAG_FORM.open[d.dataset.bagOdds] = d.open; }));
}

// ---------------- Death Boxes ----------------
function boxData() {
  const s = SAVE && SAVE.soul;
  if (!s) return null;
  if (!Array.isArray(s.deathbox)) return null;
  return s.deathbox;
}
function boxSync() {
  if (BOX_STATE.root !== RAW_SAV_ROOT) {
    const b = boxData();
    BOX_STATE = { root: RAW_SAV_ROOT, original: b ? JSON.parse(JSON.stringify(b)) : null, lastMsg: '' };
  }
}
function boxPool(rarity) {
  const rows = arr(AP && AP.boxGen).filter(r => r.rarity === rarity && r.freq > 0);
  const tot = rows.reduce((a, r) => a + r.freq, 0) || 1;
  return rows.map(r => ({ id: r.id, rwdid: r.rwdid, freq: r.freq, p: r.freq / tot, rw: rwdRow(r.rwdid), name: rewardName(r.rwdid) })).filter(x => x.rw);
}
// How the game itself writes a death box's reward (boxes it created, seen in
// real saves): an ITEM reward is stored with the ITEM'S OWN TYPE (a blueprint
// is type "ITTP_RMAP", not "ITEM") and num 0; a decal is "SKILL" with num 0.
// Writing master_reward's "ITEM" / num 1 instead makes the game hand over the
// item but show no icon for it (user report). boxGameType() gives the game's
// type for a reward.
function boxGameType(type, val0) {
  if (type === 'ITEM') { const it = ITEM_INDEX[val0]; return (it && it.itemtype) || 'ITEM'; }
  return type;
}
function boxApplyReward(box, rw) {
  box.type = boxGameType(rw.type, rw.val0);
  box.num = 0;
  box.val0 = rw.val0 || '';
  box.val1 = rw.val1 || '';
  box.val2 = rw.val2 || '';
  box.val3 = '';
}
function boxContentName(box) {
  const t = /^ITTP_/.test(box.type || '') ? 'ITEM' : box.type;
  return rewardLabel(t, box.num || 1, box.val0);
}
function boxMatchPool(box) {
  return boxPool(box.rarity).find(p => boxGameType(p.rw.type, p.rw.val0) === box.type && (p.rw.val0 || '') === (box.val0 || '')) || boxPool(box.rarity).find(p => p.rw.type === box.type && (p.rw.val0 || '') === (box.val0 || '')) || null;
}
// boxes written by earlier editor versions in master_reward's format
function boxBadFormat(box) {
  if (!box || !box.val0) return false;
  if (box.type === 'ITEM') return true;
  return (box.type === 'SKILL' || /^ITTP_/.test(box.type || '')) && Number(box.num) !== 0;
}
function fixBoxFormats(list) {
  let n = 0;
  for (const b of arr(list)) if (boxBadFormat(b)) { b.type = boxGameType(b.type, b.val0); b.num = 0; n++; }
  return n;
}

function blockBoxes() {
  return `<section class="block">
    <div class="block-head"><div><div class="eyebrow">Rewards</div><h2>Death Boxes</h2></div></div>
    <div class="block-body">
      <div class="capNote" style="margin-top:0;">Death boxes already hold their reward and unlock at a set time. You can open a box now, or change what's inside to anything from that rarity's pool. Adding new boxes hasn't been tested in game; try it on a copy of your save.</div>
      <div id="box-body"></div>
    </div>
  </section>`;
}

function renderBoxes() {
  const host = document.getElementById('box-body');
  if (!host || !SAVE) return;
  boxSync();
  if (!Array.isArray(SAVE.soul.deathbox)) SAVE.soul.deathbox = [];
  const boxes = boxData();
  const now = Math.floor(Date.now() / 1000);
  const changed = JSON.stringify(boxes) !== JSON.stringify(BOX_STATE.original || []);
  let h = '';
  if (changed) h += `<div class="warnNote" style="display:flex; gap:10px; align-items:center; border-color:var(--good); color:var(--good-bright);"><div style="flex:1;">Death boxes changed. Download the .sav to keep it.</div><button class="subtle" id="box-undo">Undo all death box changes</button></div>`;
  if (BOX_STATE.lastMsg) h += `<pre class="stewLog">${escapeHtml(BOX_STATE.lastMsg)}</pre>`;
  const locked = boxes.filter(x => x.opentime > now).length;
  h += `<div class="toolbar"><span style="font-size:12px;">${boxes.length} death box${boxes.length === 1 ? '' : 'es'}, ${locked} still locked</span><span style="flex:1;"></span><button class="action" id="box-open-all" ${locked ? '' : 'disabled'}>Open all now</button></div>`;
  h += '<div class="listBlock" style="max-height:none;">';
  h += boxes.map((x, i) => {
    const pool = boxPool(x.rarity);
    const cur = boxMatchPool(x);
    const ready = !(x.opentime > now);
    return `<div class="listRow" style="flex-direction:column; align-items:stretch; padding:10px; gap:6px;">
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        ${bagChip(x.rarity)} <div class="name"><b>${escapeHtml(boxContentName(x))}</b></div>
        ${ready ? '<span class="badge current">READY</span>' : `<span class="badge">opens ${escapeHtml(dtRel(x.opentime, now))}</span>`}
      </div>
      <div style="font-size:11px; color:var(--text-dim);">Received ${escapeHtml(dtFmt(x.created))} · opens ${escapeHtml(dtFmt(x.opentime))}</div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <select data-box-rar="${i}" style="background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:4px 6px; font-family:var(--mono); font-size:11.5px;">
          ${BOX_RARITIES.map(r => `<option value="${r}" ${r === x.rarity ? 'selected' : ''}>${bagTitle(r)}</option>`).join('')}${BOX_RARITIES.includes(x.rarity) ? '' : `<option selected>${escapeHtml(x.rarity)}</option>`}
        </select>
        <select data-box-content="${i}" style="max-width:340px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:4px 6px; font-family:var(--mono); font-size:11.5px;">
          ${cur ? '' : `<option selected>${escapeHtml(boxContentName(x))} (current)</option>`}
          ${pool.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}" ${cur && cur.id === p.id ? 'selected' : ''}>${escapeHtml(p.name)} (${(100 * p.p).toFixed(1)}%)</option>`).join('')}
        </select>
        <button class="subtle" data-box-reroll="${i}">Reroll</button>
        <button class="action" data-box-open="${i}" ${ready ? 'disabled' : ''}>Open now</button>
        <button class="subtle" data-box-del="${i}">Remove</button>
      </div>
    </div>`;
  }).join('') || '<div style="padding:10px; color:var(--text-faint); font-size:12px;">No death boxes in this save.</div>';
  h += '</div>';
  const addPool = boxPool(BOX_FORM.addRarity);
  if (!addPool.find(p => p.id === BOX_FORM.addContent)) BOX_FORM.addContent = addPool[0] ? addPool[0].id : '';
  h += `<div class="toolbar" style="margin-top:12px;"><span style="font-size:11.5px; color:var(--text-dim);">Add a box:</span>
    <select id="box-add-rar" style="background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:5px 6px; font-family:var(--mono); font-size:11.5px;">${BOX_RARITIES.map(r => `<option value="${r}" ${r === BOX_FORM.addRarity ? 'selected' : ''}>${bagTitle(r)}</option>`).join('')}</select>
    <select id="box-add-content" style="max-width:340px; background:var(--bg); border:1px solid var(--panel-border); color:var(--text); padding:5px 6px; font-family:var(--mono); font-size:11.5px;">${addPool.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}" ${p.id === BOX_FORM.addContent ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}</select>
    <button class="subtle" id="box-add">Add (ready to open)</button></div>`;
  host.innerHTML = h;

  const redo = msg => { BOX_STATE.lastMsg = msg || ''; renderBoxes(); if (msg) toast(msg.split('\n')[0]); };
  const undo = document.getElementById('box-undo');
  if (undo) undo.addEventListener('click', () => {
    boxes.length = 0;
    for (const x of JSON.parse(JSON.stringify(BOX_STATE.original || []))) boxes.push(x);
    redo('Death boxes restored to how they were when you loaded the save.');
  });
  const openNow = x => { const t = Math.floor(Date.now() / 1000) - 60; x.opentime = Math.max(Math.min(t, x.opentime), x.created || 0); };
  document.getElementById('box-open-all').addEventListener('click', () => {
    let n = 0;
    for (const x of boxes) if (x.opentime > Math.floor(Date.now() / 1000)) { openNow(x); n++; }
    redo(`Opened ${n} death box${n === 1 ? '' : 'es'}. Collect them in game.`);
  });
  host.querySelectorAll('[data-box-open]').forEach(b => b.addEventListener('click', () => {
    const x = boxes[Number(b.dataset.boxOpen)];
    openNow(x);
    redo(`${bagTitle(x.rarity)} death box can be opened now.`);
  }));
  host.querySelectorAll('[data-box-content]').forEach(s => s.addEventListener('change', () => {
    const x = boxes[Number(s.dataset.boxContent)];
    const p = boxPool(x.rarity).find(pp => pp.id === s.value);
    if (!p) return;
    boxApplyReward(x, p.rw);
    redo(`Death box now holds ${boxContentName(x)}.`);
  }));
  host.querySelectorAll('[data-box-rar]').forEach(s => s.addEventListener('change', () => {
    const x = boxes[Number(s.dataset.boxRar)];
    x.rarity = s.value;
    const pool = boxPool(x.rarity);
    if (!boxMatchPool(x) && pool.length) boxApplyReward(x, bagRoll(pool, 1, Math.random).map(id => pool.find(p => p.id === id))[0].rw);
    redo(`Death box changed to ${bagTitle(x.rarity)}: ${boxContentName(x)}.`);
  }));
  host.querySelectorAll('[data-box-reroll]').forEach(b => b.addEventListener('click', () => {
    const x = boxes[Number(b.dataset.boxReroll)];
    const pool = boxPool(x.rarity);
    if (!pool.length) return;
    const id = bagRoll(pool, 1, Math.random)[0];
    boxApplyReward(x, pool.find(p => p.id === id).rw);
    redo(`Rerolled: ${boxContentName(x)}.`);
  }));
  host.querySelectorAll('[data-box-del]').forEach(b => b.addEventListener('click', () => {
    const [x] = boxes.splice(Number(b.dataset.boxDel), 1);
    redo(`Removed the ${bagTitle(x.rarity)} death box (${boxContentName(x)}).`);
  }));
  document.getElementById('box-add-rar').addEventListener('change', e => { BOX_FORM.addRarity = e.target.value; renderBoxes(); });
  document.getElementById('box-add-content').addEventListener('change', e => { BOX_FORM.addContent = e.target.value; });
  document.getElementById('box-add').addEventListener('click', () => {
    const p = boxPool(BOX_FORM.addRarity).find(pp => pp.id === BOX_FORM.addContent);
    if (!p) return;
    const t = Math.floor(Date.now() / 1000) - 60;
    const x = { bid: '', rarity: BOX_FORM.addRarity, type: '', created: t, opentime: t, num: 0, val0: '', val1: '', val2: '', val3: '' };
    boxApplyReward(x, p.rw);
    boxes.push(x);
    redo(`Added a ${bagTitle(x.rarity)} death box with ${boxContentName(x)}.`);
  });
}

// ---------------------------------------------------------------------------
// WAITING ROOM customization (soul.hubcustom)
// Each decoration is {cstmid, flg}, a bit set (from real saves, incl. a fresh
// game where all 103 non-default decorations are 1 and the 10 defaults are 6):
//   1 = NOT owned, marked "new" in the shop   0 = not owned (seen)
//   2 = owned                                  4 = the one shown for that spot
// Defaults are 6 (owned + shown); bought decorations in use are 4. So owned =
// bit 2 or 4 (flg & 6). Unlocking writes 2 (confirmed working in game). master_hubcustomize gives the
// spot (site), order and name; platform 1 = World of Tanks items that were
// PlayStation-only.
// ---------------------------------------------------------------------------

const HUB_SITES = [
  [ 'WAL', 'Wall' ], [ 'FLR', 'Floor' ], [ 'PLR', 'Pillar' ], [ 'FNT', 'Fountain' ], [ 'FLG', 'Flag' ],
  [ 'PST', 'Poster' ], [ 'OBJ', 'Giant Object' ], [ 'ILM', 'Neon' ], [ 'PLT', 'Potted Plant' ], [ 'ET0', 'RC Car' ]
];
const HUB_SITE_TEXT = { WAL: 'TXT_DECO_WALL', FLR: 'TXT_DECO_FLOOR', PLR: 'TXT_DECO_PILLAR', FNT: 'TXT_DECO_FOUNTAIN', FLG: 'TXT_DECO_FLAG', PST: 'TXT_DECO_POSTER', OBJ: 'TXT_DECO_DECORATION1', ILM: 'TXT_DECO_DECORATION2', PLT: 'TXT_DECO_DECORATION3', ET0: 'TXT_DECO_DECORATION4' };
let HUB_STATE = { root: null, original: null, lastMsg: '' };
const HUB_FORM = { includePs: false };

const hubOwned = e => !!e && ((Number(e.flg) || 0) & 6) !== 0;
function hubData() {
  const s = SAVE && SAVE.soul;
  return s && Array.isArray(s.hubcustom) ? s.hubcustom : null;
}
function hubSync() {
  if (HUB_STATE.root !== RAW_SAV_ROOT) {
    const h = hubData();
    HUB_STATE = { root: RAW_SAV_ROOT, original: h ? JSON.parse(JSON.stringify(h)) : null, lastMsg: '' };
  }
}
function hubMeta() {
  const m = {};
  for (const r of arr(AP && AP.hubCustom)) m[r.id] = r;
  return m;
}
function hubSiteName(site) {
  const t = HUB_SITE_TEXT[site] && resolveName('DECORATION.' + HUB_SITE_TEXT[site]);
  const d = HUB_SITES.find(s => s[0] === site);
  return t || (d ? d[1] : site);
}

function blockHub() {
  return `<section class="block">
    <div class="block-head"><div><div class="eyebrow">Remodel</div><h2>Waiting Room</h2></div></div>
    <div class="block-body">
      <div class="capNote" style="margin-top:0;">Unlock Waiting Room decorations and choose which one each spot shows. One decoration per spot is in use. World of Tanks items were PlayStation-only and are hidden unless you tick the box.</div>
      <div id="hub-body"></div>
    </div>
  </section>`;
}

function renderHub() {
  const host = document.getElementById('hub-body');
  if (!host || !SAVE) return;
  hubSync();
  const list = hubData();
  if (!list) { host.innerHTML = '<div class="warnNote">This save has no Waiting Room data (soul.hubcustom).</div>'; return; }
  const meta = hubMeta();
  // decorations the game knows about but the save has no entry for yet are
  // shown as locked; they're only added to the save if you unlock or use one
  const byId = {};
  for (const e of list) byId[e.cstmid] = e;
  const virtual = Object.keys(meta).filter(id => !byId[id]).map(id => ({ cstmid: id, flg: 0 }));
  for (const e of virtual) byId[e.cstmid] = e;
  const all = list.concat(virtual);
  const ensure = e => { if (!list.includes(e)) list.push(e); return e; };
  const changed = JSON.stringify(list) !== JSON.stringify(HUB_STATE.original);
  const siteOf = e => (meta[e.cstmid] && meta[e.cstmid].site) || e.cstmid.split('_')[2];
  const visible = e => HUB_FORM.includePs || !(meta[e.cstmid] && meta[e.cstmid].platform === 1) || hubOwned(e);
  const owned = all.filter(hubOwned).length;
  const lockedVisible = all.filter(e => !hubOwned(e) && visible(e)).length;
  let h = '';
  if (changed) h += `<div class="warnNote" style="display:flex; gap:10px; align-items:center; border-color:var(--good); color:var(--good-bright);"><div style="flex:1;">Waiting Room changed. Download the .sav to keep it.</div><button class="subtle" id="hub-undo">Undo all Waiting Room changes</button></div>`;
  if (HUB_STATE.lastMsg) h += `<pre class="stewLog">${escapeHtml(HUB_STATE.lastMsg)}</pre>`;
  h += `<div class="toolbar"><span style="font-size:12px;">${owned} of ${all.length} decorations owned</span>
    <label class="stewHlOnly"><input type="checkbox" id="hub-ps" ${HUB_FORM.includePs ? 'checked' : ''}> Include PlayStation-only (World of Tanks)</label>
    <span style="flex:1;"></span><button class="action" id="hub-unlock-all" ${lockedVisible ? '' : 'disabled'}>Unlock all shown (${lockedVisible})</button></div>`;
  const sites = HUB_SITES.map(s => s[0]).concat([ ...new Set(all.map(siteOf)) ].filter(s => !HUB_SITES.some(x => x[0] === s)));
  for (const site of sites) {
    const items = all.filter(e => siteOf(e) === site && visible(e)).sort((a, b) => ((meta[a.cstmid] || {}).sort || 0) - ((meta[b.cstmid] || {}).sort || 0));
    if (!items.length) continue;
    const inUse = items.find(e => e.flg & 4);
    h += `<div class="subDetails" style="padding:10px; margin-bottom:10px;">
      <div style="display:flex; gap:10px; align-items:center; margin-bottom:6px;"><b style="font-size:14px;">${escapeHtml(hubSiteName(site))}</b><span class="id">showing: ${escapeHtml(inUse ? (resolveName((meta[inUse.cstmid] || {}).name) || inUse.cstmid) : 'nothing')}</span><span style="flex:1;"></span><span class="id">${items.filter(hubOwned).length} / ${items.length} owned</span></div>
      <div class="listBlock" style="max-height:none;">`;
    h += items.map(e => {
      const m = meta[e.cstmid] || {};
      const nm = resolveName(m.name) || e.cstmid;
      const use = !!(e.flg & 4);
      const isDefault = /_NONE$/.test(e.cstmid);
      return `<div class="listRow"><div class="name">${escapeHtml(nm)} ${m.platform === 1 ? '<span class="badge">PS only</span>' : ''}</div>
        ${use ? '<span class="badge current">IN USE</span>' : hubOwned(e) ? '<span class="badge">owned</span>' : '<span class="badge" style="opacity:0.5;">locked</span>'}
        <span class="id" style="width:28px; text-align:right;" title="raw flag">${e.flg}</span>
        ${hubOwned(e) ? '' : `<button class="subtle" data-hub-unlock="${e.cstmid}">Unlock</button>`}
        ${use ? '' : `<button class="subtle" data-hub-use="${e.cstmid}">Use</button>`}
        ${hubOwned(e) && !use && !isDefault ? `<button class="subtle" data-hub-lock="${e.cstmid}">Lock</button>` : ''}
      </div>`;
    }).join('');
    h += '</div></div>';
  }
  host.innerHTML = h;

  const name = id => resolveName((meta[id] || {}).name) || id;
  const redo = msg => { HUB_STATE.lastMsg = msg || ''; renderHub(); if (msg) toast(msg.split('\n')[0]); };
  const undo = document.getElementById('hub-undo');
  if (undo) undo.addEventListener('click', () => {
    list.length = 0;
    for (const e of JSON.parse(JSON.stringify(HUB_STATE.original))) list.push(e);
    redo('Waiting Room restored to how it was when you loaded the save.');
  });
  document.getElementById('hub-ps').addEventListener('change', e => { HUB_FORM.includePs = e.target.checked; renderHub(); });
  document.getElementById('hub-unlock-all').addEventListener('click', () => {
    let n = 0;
    for (const e of all) if (!hubOwned(e) && visible(e)) { ensure(e).flg = 2; n++; }
    redo(`Unlocked ${n} decoration${n === 1 ? '' : 's'}.`);
  });
  host.querySelectorAll('[data-hub-unlock]').forEach(b => b.addEventListener('click', () => {
    ensure(byId[b.dataset.hubUnlock]).flg = 2;
    redo(`Unlocked ${name(b.dataset.hubUnlock)}.`);
  }));
  host.querySelectorAll('[data-hub-use]').forEach(b => b.addEventListener('click', () => {
    const e = ensure(byId[b.dataset.hubUse]);
    const site = siteOf(e);
    for (const o of list) if (o !== e && siteOf(o) === site && (o.flg & 4)) o.flg = (o.flg & ~4) || 2;
    e.flg = (hubOwned(e) ? (e.flg & 6) : 2) | 4;
    redo(`${hubSiteName(site)} now shows ${name(e.cstmid)}.`);
  }));
  host.querySelectorAll('[data-hub-lock]').forEach(b => b.addEventListener('click', () => {
    byId[b.dataset.hubLock].flg = 0;
    redo(`Locked ${name(b.dataset.hubLock)}.`);
  }));
}

// ---------------------------------------------------------------------------
// SCREENSHOTS (soul.screenshot) - Kiwako's commemorative photos, one per large
// stamp (boss 1-4), stored inside the save as base64 PNGs (256x256). The game
// refers to them, so this tab is view/export only and never changes the save.
// ---------------------------------------------------------------------------

const PHOTO_ORDINAL = [ '', 'first', 'second', 'third', 'fourth' ];

function photoList() {
  const s = SAVE && SAVE.soul;
  return s && Array.isArray(s.screenshot) ? s.screenshot : [];
}
function photoBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function photoTitle(p) {
  const o = PHOTO_ORDINAL[p.boss];
  return o ? `Your ${o} large stamp` : `Photo ${p.boss}`;
}
function photoFileName(p) {
  const d = dtIsDateValue(p.created) ? new Date(p.created * 1000) : null;
  const ds = d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : 'undated';
  return `LET_IT_DIE_photo_${p.boss}_${ds}.png`;
}
function photoExport(p) {
  triggerDownload(photoBytes(p.photo), photoFileName(p), 'image/png');
}

function blockPhotos() {
  return `<section class="block">
    <div class="block-head"><div><div class="eyebrow">Kiwako's photos</div><h2>Screenshots</h2></div></div>
    <div class="block-body">
      <div class="capNote" style="margin-top:0;">Kiwako takes a commemorative photo each time you earn a large stamp, and the game keeps it inside your save. You can view and export them here. They can't be deleted or changed, because the game refers to them; nothing on this tab changes your save.</div>
      <div id="photo-body"></div>
    </div>
  </section>`;
}

function renderPhotos() {
  const host = document.getElementById('photo-body');
  if (!host || !SAVE) return;
  const list = photoList().filter(p => p && typeof p.photo === 'string' && p.photo.length);
  if (!list.length) { host.innerHTML = '<div style="padding:10px; color:var(--text-faint); font-size:12px;">No photos in this save yet.</div>'; return; }
  const total = list.reduce((a, p) => a + Math.floor(p.photo.length * 3 / 4), 0);
  let h = `<div class="toolbar"><span style="font-size:12px;">${list.length} photo${list.length === 1 ? '' : 's'}, ${(total / 1024).toFixed(0)} KB</span><span style="flex:1;"></span><button class="action" id="photo-export-all">Export all as PNG</button></div>`;
  h += '<div class="photoGrid">';
  h += list.map((p, i) => `<figure class="photoCard">
      <img src="data:image/png;base64,${p.photo}" alt="${escapeHtml(photoTitle(p))}" data-photo-view="${i}">
      <figcaption><b>${escapeHtml(photoTitle(p))}</b><div class="dtRel">${dtIsDateValue(p.created) ? escapeHtml(dtFmt(p.created)) : 'no date'} · ${(p.photo.length * 3 / 4 / 1024).toFixed(0)} KB</div>
      <div style="display:flex; gap:6px; margin-top:6px;"><button class="subtle" data-photo-view="${i}">View</button><button class="subtle" data-photo-export="${i}">Export PNG</button></div></figcaption>
    </figure>`).join('');
  h += '</div><div class="photoModal" id="photo-modal" hidden><div class="photoModalInner"><img id="photo-modal-img" alt=""><div id="photo-modal-cap" style="margin-top:8px; font-size:12px;"></div><button class="subtle" id="photo-modal-close" style="margin-top:8px;">Close</button></div></div>';
  host.innerHTML = h;
  host.querySelectorAll('[data-photo-export]').forEach(b => b.addEventListener('click', () => {
    const p = list[Number(b.dataset.photoExport)];
    photoExport(p);
    toast(`Exported ${photoFileName(p)}`);
  }));
  document.getElementById('photo-export-all').addEventListener('click', () => {
    list.forEach((p, i) => setTimeout(() => photoExport(p), i * 400));

  });
  const modal = document.getElementById('photo-modal');
  const close = () => { modal.hidden = true; };
  host.querySelectorAll('[data-photo-view]').forEach(el => el.addEventListener('click', () => {
    const p = list[Number(el.dataset.photoView)];
    document.getElementById('photo-modal-img').src = `data:image/png;base64,${p.photo}`;
    document.getElementById('photo-modal-cap').textContent = `${photoTitle(p)}${dtIsDateValue(p.created) ? ' · ' + dtFmt(p.created) : ''}`;
    modal.hidden = false;
  }));
  document.getElementById('photo-modal-close').addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
}
