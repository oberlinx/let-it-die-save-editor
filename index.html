  ::selection { background: var(--accent); color: #fff; }

  .tabbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--panel-border); padding-bottom: 0; }
  .tabbtn {
    padding: 8px 14px; border: 1px solid var(--panel-border); border-bottom: none; background: var(--panel);
    color: var(--text-dim); font-family: var(--mono); font-size: 12px; cursor: pointer; letter-spacing: 0.3px;
    transition: background 0.15s, color 0.15s;
  }
  .tabbtn:hover { color: var(--text); }
  .tabbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tabpanel .block { margin-bottom: 0; border-top: none; }

  header {
    padding: 22px 28px 18px; border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, var(--bg-raised), var(--bg));
    position: sticky; top: 0; z-index: 50;
  }
  h1 {
    font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.5px;
    margin: 0 0 14px; color: var(--text);
  }
  h1 .rest { color: var(--accent-bright); }
  .subtitle { color: var(--text-dim); font-size: 12.5px; margin-bottom: 16px; }

  .loadbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .loadchip {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border: 1px solid var(--panel-border); background: var(--panel);
    font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none;
    transition: border-color 0.15s, color 0.15s;
  }
  .loadchip:hover { border-color: var(--panel-border-bright); color: var(--text); }
  .loadchip.ok { border-color: var(--good); color: var(--good-bright); }
  .loadchip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
  .loadchip.ok .dot { background: var(--good-bright); }
  .loadchip input[type=file] { display: none; }
  .loadbar .sep { width: 1px; height: 20px; background: var(--panel-border); margin: 0 4px; }

  button.action {
    padding: 7px 14px; border: 1px solid var(--accent); background: transparent; color: var(--accent-bright);
    font-family: var(--mono); font-size: 12px; cursor: pointer; letter-spacing: 0.3px;
    transition: background 0.15s, color 0.15s;
  }
  button.action:hover:not(:disabled) { background: var(--accent); color: #fff0ee; }
  button.action:disabled { opacity: 0.35; cursor: not-allowed; }
  button.subtle {
    padding: 5px 10px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--text-dim);
    font-family: var(--mono); font-size: 11.5px; cursor: pointer;
  }
  button.subtle:hover { border-color: var(--panel-border-bright); color: var(--text); }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 28px 80px; }
  #app-locked { color: var(--text-dim); padding: 60px 0; text-align: center; font-size: 13px; }
  #app-locked .big { font-family: var(--display); font-size: 20px; color: var(--text); margin-bottom: 10px; }

  .block {
    border: 1px solid var(--panel-border); background: var(--panel); margin-bottom: 20px;
  }
  .block-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .block-head .eyebrow { font-size: 10px; letter-spacing: 1.5px; color: var(--accent-bright); text-transform: uppercase; }
  .block-head h2 { font-family: var(--display); font-size: 17px; margin: 2px 0 0; font-weight: 700; }
  .block-body { padding: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .field label { display: block; font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 4px; }
  .field input[type=number], .field input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--panel-border); color: var(--text);
    padding: 7px 8px; font-family: var(--mono); font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .charTabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .charTab {
    padding: 6px 12px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--text-dim);
    cursor: pointer; font-size: 12px;
  }
  .charTab.active { border-color: var(--accent); color: var(--accent-bright); background: rgba(168,41,31,0.1); }

  .slotRow {
    display: grid; grid-template-columns: 100px 1fr 90px 70px 34px; gap: 8px; align-items: center;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .slotRow .slotname { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .slotRow .statline { font-size: 10.5px; color: var(--text-faint); grid-column: 2 / 6; margin-top: 2px; }

  .searchwrap { position: relative; }
  .searchwrap input { width: 100%; }
  .acdrop {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 40; max-height: 260px; overflow-y: auto;
    background: #0d0d0d; border: 1px solid var(--panel-border-bright); display: none;
  }
  .acdrop.open { display: block; }
  .acitem { padding: 7px 10px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .acitem:hover, .acitem.hi { background: var(--accent); color: #fff; }
  .acitem .id { color: var(--text-faint); font-size: 10.5px; }
  .acitem:hover .id, .acitem.hi .id { color: rgba(255,255,255,0.75); }

  .chipRow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; background: var(--bg);
    border: 1px solid var(--panel-border); font-size: 11.5px;
  }
  .chip button { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 13px; padding: 0 2px; }
  .chip button:hover { color: var(--accent-bright); }

  .listBlock { max-height: 340px; overflow-y: auto; border: 1px solid var(--panel-border); background: var(--bg); }
  .listRow { display: flex; align-items: center; gap: 10px; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .listRow:hover { background: rgba(255,255,255,0.02); }
  .listRow .name { flex: 1; }
  .listRow .id { color: var(--text-faint); font-size: 10.5px; }
  .listRow input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar .count { color: var(--text-faint); font-size: 11px; margin-left: auto; }

  .badge { display: inline-block; padding: 1px 6px; font-size: 10px; border: 1px solid var(--panel-border-bright); color: var(--text-dim); }
  .badge.lb { border-color: var(--warn); color: var(--warn); }
  .badge.current { border-color: var(--good); color: var(--good-bright); }

  .bankTable { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .bankRow { display: grid; grid-template-columns: 140px 1fr 1fr 150px auto; gap: 10px; align-items: end; padding: 8px; background: var(--bg); border: 1px solid var(--panel-border); }
  .bankLabel { font-size: 12px; color: var(--text-dim); padding-bottom: 8px; }
  .bankCap { font-size: 11px; color: var(--text-faint); padding-bottom: 8px; }
  .bankCap.over { color: var(--accent-bright); font-weight: bold; }

  .subTabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .subTab { padding: 5px 12px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--text-dim); cursor: pointer; font-size: 11.5px; }
  .subTab.active { border-color: var(--accent); color: var(--accent-bright); background: rgba(168,41,31,0.1); }

  .warnNote { font-size: 11px; padding: 8px 10px; border: 1px solid var(--warn); color: var(--warn); margin-bottom: 10px; }
  .capNote { font-size: 10.5px; color: var(--text-faint); margin: 4px 0 12px; }
  summary { list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::marker { display: none; content: ""; }
  .subDetails { border: 1px solid var(--panel-border); margin-bottom: 10px; background: var(--bg); }
  .subDetails > summary { padding: 8px 10px; cursor: pointer; font-size: 11px; color: var(--text-dim); }
  .subDetails > summary:hover { color: var(--text); }
  .subDetails .subDetailsBody { padding: 8px 10px 10px; }

  .toast {
    position: fixed; bottom: 18px; right: 18px; background: var(--panel); border: 1px solid var(--good);
    color: var(--good-bright); padding: 10px 16px; font-size: 12px; z-index: 100; opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--accent); color: var(--accent-bright); }

  .psnNote { font-size: 11.5px; color: var(--text-dim); max-width: 420px; line-height: 1.4; }
  .psnNote a { color: var(--accent-bright); }
  .psnNote a:hover { color: #fff; }
  .eqRow { display: grid; grid-template-columns: 100px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12.5px; }
  .eqRow .slotname { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .eqRow .empty { color: var(--text-faint); }
  a.gitlink { color: var(--text-faint); text-decoration: none; font-size: 11px; }
  .stewActions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .stewAct { display: grid; grid-template-columns: 190px 1fr; gap: 12px; align-items: center; font-size: 11.5px; color: var(--text-dim); }
  .stewAct button { width: 100%; text-align: left; }
  .stewLog { white-space: pre-wrap; font-family: var(--mono); font-size: 11.5px; background: var(--bg); border: 1px solid var(--panel-border); padding: 8px 10px; margin: 0 0 12px; color: var(--text); }

    if (!el) continue;
    const sync = () => {
      obj[key] = el.type === 'checkbox' ? el.checked : el.value;
    };
    el.addEventListener('input', sync);
    el.addEventListener('change', sync);

function stampRatePerCategory() {
  const rates = {};
  for (const type of RESEARCH_STAMP_TYPES) {
    const row = (AP.constFloat || []).find(r => r.id === 'PART_RESEARCH_STAMP_ADD_RATE_' + type);
    rates[type] = row ? row.value : 0;
  }
  return rates;
}

function stampCategoryFor(p) {
  if (!p) return null;
  if (p.type === 'PTTP_ARM') {
    const row = (AP.atkattr || []).find(a => a.id === p.id && [ 'ATKATTR_SLASH', 'ATKATTR_SHOOT', 'ATKATTR_HIT' ].includes(a.attr));
    return row ? row.attr.replace('ATKATTR_', '') : null;
  }
  if (p.type === 'PTTP_HEAD') return 'HEAD';
  if (p.type === 'PTTP_BODY') return 'BODY';
  if (p.type === 'PTTP_LEGS') return 'LEGS';
  return null;
}

let STAMP_ELIGIBLE_SET = null;

function buildStampEligibleSet() {
  const blueprintIds = new Set((AP.items || []).filter(it => it.itemtype === 'ITTP_RMAP').map(it => it.itemId));
  const nextptidTargets = new Set((AP.pts || []).map(p => p.nextptid).filter(Boolean));
  const openResearch = new Set((AP.partresearch || []).filter(r => r.is_open).map(r => r.ptid));
  const eligible = new Set;
  for (const p of AP.pts || []) {
    if (!p.is_stamp) continue;
    if (!openResearch.has(p.id)) continue;
    if (p.platform === 1 || RESEARCH_BLOCKLIST.has(p.id)) continue;
    const hasBlueprint = blueprintIds.has('ITMP_' + p.id.slice(3));
    const reachableByUpgrade = nextptidTargets.has(p.id);
    if (hasBlueprint || reachableByUpgrade) eligible.add(p.id);
  }
  return eligible;
}

function computeStampTotals() {
  if (!STAMP_ELIGIBLE_SET) STAMP_ELIGIBLE_SET = buildStampEligibleSet();
  const rates = stampRatePerCategory();
  const researchedPtids = new Set(SAVE.user_research.filter(r => r.research_type === 'FINISHED').map(r => r.ptid));
  const totals = {
    SLASH: 0,
    SHOOT: 0,
    HIT: 0,
    HEAD: 0,
    BODY: 0,
    LEGS: 0
  };
  for (const ptid of researchedPtids) {
    if (!STAMP_ELIGIBLE_SET.has(ptid)) continue;
    const cat = stampCategoryFor(PT_INDEX[ptid]);
    if (cat && totals[cat] != null) totals[cat] += rates[cat];
  }
  for (const type of RESEARCH_STAMP_TYPES) totals[type] = Math.round(totals[type] * 10) / 10;
  return totals;
}

function tdmRankForPoints(pt, AP) {
  const table = (AP.tdmrank || []).slice().sort((a, b) => a.point_min - b.point_min);
  let best = table[0];
  for (const r of table) {
    if (pt >= r.point_min) best = r;
  }
  return best;
}

function formatTdmRank(name) {
  if (!name) return name;
  return name.replace(/([a-z])([\u2160-\u2188]+)$/i, '$1 $2');
}

function teamName(tid) {
  if (tid == null) return null;
  if (AP && AP.teams) {
    const t = AP.teams.find(t => String(t.tid) === String(tid));
    if (t && t.name) return t.name;
  }
  if (!SAVE || !SAVE.teams) return null;
  const entry = SAVE.teams.find(t => String(t.tid) === String(tid) || t.team && String(t.team.tid) === String(tid));
  return entry && (entry.name || entry.team && entry.team.name) || null;
}

function bankMaxLevel() {
  const rows = AP && AP.spirittank || [];
  return rows.length ? Math.max(...rows.map(r => r.level)) : 50;
}

function bankCapacityForLevel(level) {
  const rows = AP && AP.spirittank || [];
  if (!rows.length) return 0;
  const l = Math.min(Math.max(level, 1), bankMaxLevel());
  const row = rows.find(r => r.level === l);
  return row ? row.limit : 0;
}

  const t = document.getElementById('toast');

  }, 2600);
}

function u8concat(chunks) {
  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) {
    out.set(c, off);
    off += c.length;
  }
  return out;
}

async function inflateZlib(bytes) {
  const stream = new Blob([ bytes ]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function deflateZlib(bytes) {
  const stream = new Blob([ bytes ]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());

async function parseBrgSav(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const zlibMagic = (new TextDecoder).decode(bytes.slice(12, 16));
  if (zlibMagic !== 'ZLIB') throw new Error(`Unexpected inner magic "${zlibMagic}" (expected "ZLIB")`);

  while (offset + 8 <= bytes.length) {

    offset += 8;
    if (compLen <= 0 || offset + compLen > bytes.length) break;
    outChunks.push(await inflateZlib(bytes.slice(offset, offset + compLen)));
    offset += compLen;
  }
  const text = (new TextDecoder).decode(u8concat(outChunks));
  const root = parseSaveJsonText(text);
  parseBrgSav.lastRepairCount = parseSaveJsonText.lastRepairCount;
  return root;
}

function parseSaveJsonText(text) {
  parseSaveJsonText.lastRepairCount = 0;
  if (text.charCodeAt(0) === 65279) text = text.slice(1);
  try {
    return JSON.parse(text);
  } catch (err) {
    const {text: fixed, count: count} = escapeControlCharsInJsonStrings(text);
    if (!count) throw err;
    const root = JSON.parse(fixed);
    console.warn(`parseSaveJsonText: escaped ${count} raw control character(s) inside string values`);
    parseSaveJsonText.lastRepairCount = count;
    return root;
  }
}

function looksLikeFullDump(root) {
  return !!(root && typeof root === 'object' && root.soul && (root.bodyuser || root.soul.chr || root.part || root.soul.deathbag));

function escapeControlCharsInJsonStrings(text) {
  const out = [];
  let inStr = false, esc = false, count = 0, last = 0;
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    if (!inStr) {
      if (c === 34) inStr = true;
      continue;
    }
    if (esc) {
      esc = false;
      continue;
    }
    if (c === 92) {
      esc = true;
      continue;
    }
    if (c === 34) {
      inStr = false;
      continue;
    }
    if (c < 32) {
      out.push(text.slice(last, i), '\\u' + c.toString(16).padStart(4, '0'));
      last = i + 1;
      count++;
    }
  }
  if (!count) return {
    text: text,
    count: 0
  };
  out.push(text.slice(last));
  return {
    text: out.join(''),
    count: count
  };
}

async function buildBrgSav(rootObj) {
  const jsonBytes = (new TextEncoder).encode(JSON.stringify(rootObj));
  const compressed = await deflateZlib(jsonBytes);
  const header = new Uint8Array(24);
  const hdv = new DataView(header.buffer);
  header.set((new TextEncoder).encode('BRG\0'), 0);
  hdv.setUint32(4, 2, true);
  hdv.setUint32(8, jsonBytes.length, true);
  header.set((new TextEncoder).encode('ZLIB'), 12);
  hdv.setUint32(16, jsonBytes.length, true);
  hdv.setUint32(20, compressed.length, true);
  return u8concat([ header, compressed ]);
}

      let i = laid.indexOf(null);
      if (i < 0) {
        laid.push(null);
        i = laid.length - 1;
      }
      laid[i] = it;
    }
    newDeathbag[c.cid] = laid.map((it, i) => it ? Object.assign(it, {
      slot: i
    }) : {
      uid: Number(mainUid),
      cid: c.cid,
      slot: i,
      type: -1,
      eid: '',
      site: '',
      arm_slot: -1
    });
  }
  root.soul.deathbag = root.soul.deathbag || {};
  for (const cid of Object.keys(oldDeathbagByCid)) {
    if (cid in newDeathbag) continue;
    // drop death bags of broken fighters the old "Add Character" created
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(cid)) continue;
    const old = oldDeathbagByCid[cid];
    const hasItems = Array.isArray(old) ? old.some(s => s && s.eid) : Object.keys(old || {}).length > 0;
    if (!hasItems) newDeathbag[cid] = old;
  }
  // the game keeps a deleted fighter's death bag key, emptied to {}
  if (FIGHTER_DELETES.root === rawRoot) for (const cid of FIGHTER_DELETES.cids) newDeathbag[cid] = {};
  root.soul.deathbag[mainUid] = newDeathbag;
  applyFighterRecovers(root, rawRoot, mainUid);
  const clSrc = SAVE.cl && SAVE.cl.slots || [];
  root.soul.cl = clSrc.map(s => {
    if (s.eptid && s.eptid !== '-1') return {
      slot: s.slot,
      type: 0,
      eid: s.eptid
    };
    if (s.emsrid && s.emsrid !== '-1') return {

    };
    if (s.ebstid && s.ebstid !== '-1') return {

      type: 2,

    };
    if (s.eitemid && s.eitemid !== '-1') return {

      eid: s.eitemid
    };
    return {
      slot: s.slot,
      type: -1,
      eid: ''
    };
  });
  for (const p of SAVE.cl && SAVE.cl.pts || []) pushInst(newPts, oldPtsByEid, p.eptid, {
    uid: Number(mainUid),
    eid: p.eptid,
    owner: 'COIN_LOCKER',
    ptid: p.ptid,
    rest: p.rest || 0,
    spare: p.spare || 0,
    grade: p.grade || 0,
    dur: p.dur,
    lvl: p.lvl
  });
  for (const m of SAVE.cl && SAVE.cl.msrs || []) pushInst(newMsrs, oldMsrsByEid, m.emsrid, {
    uid: Number(mainUid),
    eid: m.emsrid,
    owner: 'COIN_LOCKER',
    msrid: m.msrid
  });
  for (const b of SAVE.cl && SAVE.cl.bsts || []) pushInst(newBsts, oldBstsByEid, b.ebstid, {
    uid: Number(mainUid),
    eid: b.ebstid,
    owner: 'COIN_LOCKER',
    bstid: b.bstid
  });
  for (const it of SAVE.cl && SAVE.cl.items || []) pushInst(newItems, oldItemsByEid, it.eitemid, {
    uid: Number(mainUid),
    eid: it.eitemid,
    owner: 'COIN_LOCKER',
    itemid: it.itemId
  });
  root.part.pts[mainUid] = preservedPts.concat(newPts);
  root.mushroom.msrs = preservedMsrs.concat(newMsrs);
  root.beast.bsts = preservedBsts.concat(newBsts);
  root.item.items = preservedItems.concat(newItems);
  root.soul.present = SAVE.presents;
  root.soul.prison = Object.assign({}, root.soul.prison, {
    [mainUid]: SAVE.prison.map(p => {
      const c = Object.assign({}, p);
      delete c.state;
      delete c.abduct;
      return c;
    })
  });
  const origPrisonAbids = new Set(arr((rawRoot.soul || {}).prison && (rawRoot.soul || {}).prison[mainUid]).map(p => p.abid).filter(Boolean));
  const currentPrisonAbids = new Set(SAVE.prison.map(p => p.abid).filter(Boolean));
  const releasedAbids = new Set([ ...origPrisonAbids ].filter(a => !currentPrisonAbids.has(a)));
  if (releasedAbids.size) root.abduct = (Array.isArray(root.abduct) ? root.abduct : []).filter(a => !releasedAbids.has(a.abid));
  const v = SAVE.soul.vip || {};
  root.soul.vip = Object.assign({}, rawRoot.soul && rawRoot.soul.vip || {}, {
    flag: v.vip_flag || 0,
    type: v.vip_type || 0,
    pass_num: v.vip_pass_num || 0,
    oneday_pass_num: v.oneday_vip_pass_num || 0,
    expired_time: v.expired_time || 0,
    automatic_renewal: v.automatic_renewal || 0,
    friendship: v.friendship || 0
  });
  root.soul.partresearch = Object.assign({}, root.soul.partresearch, {
    user: SAVE.user_research
  });
  delete root.soul.chrs;
  delete root.soul.chrslots;
  delete root.soul.vip_flag;
  root.soul.expert = SAVE.soul.mstlvl || [];
  delete root.soul.mstlvl;
  delete root.soul.jointeams;
  delete root.soul.tid;
  delete root.soul.psskls;
  const rawSoul = rawRoot && rawRoot.soul || {};
  for (const k of [ 'dchrs', 'quests', 'freezer_level', 'crntcid' ]) if (!(k in rawSoul)) delete root.soul[k];
  if (rawSoul.waiting && !Array.isArray(rawSoul.waiting) && !(SAVE.soul.waiting || []).length) root.soul.waiting = rawSoul.waiting;
  root.user = Object.assign({}, root.user, SAVE.user);
  const oldName = rawRoot.user && rawRoot.user.nm;
  const newName = SAVE.user.nm;
  if (oldName && newName && oldName !== newName) {
    if (root.user.olid === oldName) root.user.olid = newName;
    const zmbs = root.zombie && root.zombie.zmbs;
    if (zmbs && typeof zmbs === 'object') {
      for (const k of Object.keys(zmbs)) for (const z of arr(zmbs[k])) if (z && z.name === oldName) z.name = newName;
    }
  }
  // defense lineup (Defense tab): the game writes {} when nobody defends
  root.fortzmbsetting = SAVE.fortsetting.length ? (typeof defRefreshSnapshots === 'function' ? defRefreshSnapshots(SAVE.fortsetting) : SAVE.fortsetting) : (Array.isArray(rawRoot.fortzmbsetting) && !rawRoot.fortzmbsetting.length ? [] : {});
  root.playlog = SAVE.playlog[0] || root.playlog;
  if (SAVE.teams.length) root.team = SAVE.teams;
  return root;
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader;
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsText(file);
  });
}

function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader;
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

let SQL_JS_MODULE = null;

const SQLJS_CDN_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.11.0/';

async function ensureSqlJs() {
  if (SQL_JS_MODULE) return SQL_JS_MODULE;
  if (typeof initSqlJs === 'undefined') {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = SQLJS_CDN_BASE + 'sql-wasm.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('Could not load sql.js from cdnjs.cloudflare.com -- check your internet connection (this one-time library fetch needs it; nothing else in this tool does)'));
      document.head.appendChild(s);
    });
  }
  SQL_JS_MODULE = await initSqlJs({
    locateFile: file => SQLJS_CDN_BASE + file
  });
  return SQL_JS_MODULE;
}

// --- remember masters.db in the browser (IndexedDB) so it loads by itself next time ---
const MASTERS_IDB = { db: 'lid-editor', store: 'files', key: 'masters.db' };
function mastersIdbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(MASTERS_IDB.db, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(MASTERS_IDB.store);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function mastersIdb(mode, value) {
  const idb = await mastersIdbOpen();
  try {
    return await new Promise((resolve, reject) => {
      const tx = idb.transaction(MASTERS_IDB.store, mode === 'get' ? 'readonly' : 'readwrite');
      const st = tx.objectStore(MASTERS_IDB.store);
      const req = mode === 'get' ? st.get(MASTERS_IDB.key) : mode === 'put' ? st.put(value, MASTERS_IDB.key) : st.delete(MASTERS_IDB.key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } finally { idb.close(); }
}
function setMastersRemembered(info) {

async function loadMastersBuffer(buf) {
  let db = null;
  try {
    toast('Loading sql.js (one-time fetch from cdnjs)...');
    const SQLmod = await ensureSqlJs();
    db = new SQLmod.Database(new Uint8Array(buf));
    function all(sql) {
      const res = db.exec(sql);
      if (!res.length) return [];
      const {columns: columns, values: values} = res[0];
      return values.map(row => {
        const o = {};
        for (let i = 0; i < columns.length; i++) o[columns[i]] = row[i];
        return o;
      });
    }
    LOCDAT_INDEX = {};
    for (const row of all(`SELECT sct, id, txt FROM master_text WHERE lang='int'`)) {
      LOCDAT_INDEX[`${row.sct}.${row.id}`] = row.txt;
    }
    AP = {
      pts: all('SELECT * FROM master_part'),
      items: all('SELECT * FROM master_item').map(r => Object.assign({}, r, {
        itemId: r.itemid
      })),
      skls: all('SELECT * FROM master_skill'),
      msrs: all('SELECT * FROM master_mushroom'),
      bsts: all('SELECT * FROM master_beast'),
      tdmrank: all('SELECT * FROM master_tdm_rank'),
      ptarmtps: all('SELECT * FROM master_ptarm_type'),
      partresearch: all('SELECT * FROM master_part_research'),
      flrareas: all('SELECT id AS flrid, name FROM master_floor'),
      bodylvlsts: all('SELECT * FROM master_bodylvl_status_value'),
      quests: all('SELECT * FROM master_quest'),
      teams: all('SELECT * FROM master_team'),
      spirittank: all('SELECT * FROM master_spirit_tank_level'),
      bodylvlexp: all('SELECT * FROM master_bodylvl_exp'),
      constInt: all('SELECT * FROM master_const_int'),
      constFloat: all('SELECT * FROM master_const_float'),
      atkattr: all('SELECT * FROM master_part_atkattr'),
      bodydetail: all('SELECT * FROM master_body_detail')
    };
    for (const [key, sql] of [['questParamText', 'SELECT qid, no, val FROM master_quest_param_text'], ['questParamDesc', 'SELECT qid, no, val FROM master_quest_param_desc_text'], ['rewards', 'SELECT * FROM master_reward'], ['questCats', 'SELECT * FROM master_quest_category'], ['bagGen', 'SELECT * FROM master_mysterybag_content_gen'], ['bagGenOdds', "SELECT * FROM master_mysterybag_content_gen_odds WHERE odds_id = (SELECT odds_id FROM master_mysterybag_content_odds ORDER BY expires DESC LIMIT 1)"], ['boxGen', 'SELECT * FROM master_deathbox_content_gen'], ['hubCustom', 'SELECT * FROM master_hubcustomize'], ['floorInfo', 'SELECT id, sname, stgid, stgpfx, name FROM master_floor'], ['freezer', 'SELECT * FROM master_freezer'], ['bodies', 'SELECT id, gender FROM master_body'], ['gasmasks', 'SELECT id, gender FROM master_gasmask'], ['fortWhistle', 'SELECT * FROM master_fort_whistle']]) {
      try { AP[key] = all(sql); } catch (err) { AP[key] = []; console.warn(`${key} not available in this masters.db:`, err); }
    }
    AP.stewOdds = [];
    AP.stewOddsId = STEW_GACHA_ID;
    try {
      const g = all(`SELECT odds_id FROM master_skillgacha WHERE id='${STEW_GACHA_ID}'`);
      if (g.length && g[0].odds_id) AP.stewOddsId = String(g[0].odds_id);
      AP.stewOdds = all(`SELECT sklid, odds FROM master_skillgacha_odds WHERE id='${AP.stewOddsId.replace(/'/g, "''")}' AND odds>0`).map(r => ({ sklid: r.sklid, odds: Number(r.odds) }));
    } catch (err) {
      console.warn('Stew odds not available in this masters.db:', err);
    }
    STAMP_ELIGIBLE_SET = null;
    OBTAINABLE_SET = null;
    ALLOWED_RESEARCH_SET = null;
    PREV_PT_MAP = null;
    REAL_BLUEPRINT_SET = null;
    markChip('chip-masters', true);
    toast(`masters.db loaded: ${AP.pts.length} parts, ${AP.items.length} items, ${AP.skls.length} skills, ${AP.msrs.length} mushrooms, ${AP.bsts.length} beasts, ${AP.teams.length} teams, ${Object.keys(LOCDAT_INDEX).length} text keys`);
    tryBuildIndices();
    return true;
  } catch (err) {
    toast('Failed to load masters.db: ' + err.message, true);
    return false;
  } finally {
    if (db) db.close();
  }
}

document.getElementById('file-save').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (!files.length) return;
  if (!AP) {
    toast('Load masters.db first, then load your save', true);
    return;
  }
  try {
    const parsed = [];
    const readErrors = [];
    let repairedChars = 0;
    for (const f of files) {
      try {
        const buf = await readFileAsArrayBuffer(f);
        const bytes = new Uint8Array(buf);
        if (isBrgSav(bytes)) {
          parseBrgSav.lastRepairCount = 0;
          const root = await parseBrgSav(bytes);
          repairedChars += parseBrgSav.lastRepairCount || 0;
          parsed.push({
            file: f,
            obj: adaptFullDumpToLegacyShape(root)
          });
        } else {
          const root = parseSaveJsonText(new TextDecoder('utf-8').decode(bytes));
          repairedChars += parseSaveJsonText.lastRepairCount || 0;
          if (!looksLikeFullDump(root)) throw new Error('not a LET IT DIE save -- expected a .sav or the .json made by decompressing one');
          parsed.push({
            file: f,
            obj: adaptFullDumpToLegacyShape(root)
          });
        }
      } catch (err) {
        console.warn(`Skipped ${f.name}, could not read as a save file:`, err);
        readErrors.push(`${f.name}: ${err.message}`);
      }
    }
    function fileAccountId(obj) {
      if (!obj) return null;
      return obj.accountId != null ? String(obj.accountId) : obj.user && obj.user.acid != null ? String(obj.user.acid) : null;
    }
    const idCounts = {};
    for (const {obj: obj} of parsed) {
      const id = fileAccountId(obj);
      if (id != null) idCounts[id] = (idCounts[id] || 0) + 1;
    }
    let mainId = null, mainCount = 0;
    for (const id in idCounts) {
      if (idCounts[id] > mainCount) {
        mainId = id;
        mainCount = idCounts[id];
      }
    }
    function matchesMain(obj) {
      const id = fileAccountId(obj);
      return id == null || mainId == null || id === mainId;
    }
    const mismatched = parsed.filter(({obj: obj}) => !matchesMain(obj)).map(({file: file}) => file.name);
    let soul = null, soulSource = null;
    for (const {file: file, obj: obj} of parsed) {
      if (!matchesMain(obj)) continue;
      if (obj && obj.soul) {
        soul = obj.soul;
        soulSource = file.name;
        break;
      }
      if (obj && obj.user && obj.user.soul) {
        soul = obj.user.soul;
        soulSource = file.name;
        break;
      }
    }
    if (!soul) {
      for (const {file: file, obj: obj} of parsed) {
        if (obj && obj.soul) {
          soul = obj.soul;
          soulSource = file.name;
          break;
        }
        if (obj && obj.user && obj.user.soul) {
          soul = obj.user.soul;
          soulSource = file.name;
          break;
        }
      }
    }
    if (!soul && readErrors.length) {
      toast('Could not read save -- ' + readErrors.join(' | '), true);
      return;
    }
    if (!soul) {
      toast('None of the selected files have a "soul" (either top-level, or nested under "user") -- soul is required', true);
      return;
    }
    if (repairedChars) console.warn(`Loaded with ${repairedChars} corrupt character(s) escaped in string fields`);
    startSave(soul);
    DATE_RULES = [];
    ORIG_BAG_CAP = {};
    for (const c of arr(soul.chrs)) if (c && c.cid) ORIG_BAG_CAP[c.cid] = deathBagCapacity(c);
    const soulEntry = parsed.find(({file: file}) => file.name === soulSource);
    if (soulEntry && soulEntry.obj && soulEntry.obj.__rawSavRoot) {
      RAW_SAV_ROOT = soulEntry.obj.__rawSavRoot;
      RAW_SAV_MAIN_UID = soulEntry.obj.__rawSavMainUid;

      document.getElementById('btn-download-json').disabled = false;
    }
    const overlayKeys = [ 'user', 'cl', 'all_quests', 'playlog', 'hitchart', 'loading_announces', 'user_config_menu', 'user_research', 'presents', 'prison', 'fortsetting', 'dests', 'teams' ];
    const found = {};
    for (const {obj: obj} of parsed) {
      if (!matchesMain(obj)) continue;
      for (const key of overlayKeys) {
        if (found[key] === undefined && obj && obj[key] !== undefined) found[key] = obj[key];
      }
    }
    for (const {obj: obj} of parsed) {
      for (const key of overlayKeys) {
        if (found[key] === undefined && obj && obj[key] !== undefined) found[key] = obj[key];
      }
    }
    let loadedExtra = 0;
    for (const key of overlayKeys) {
      if (found[key] !== undefined) {
        SAVE[key] = found[key];
        loadedExtra++;
      }
    }
    if (SAVE.user && SAVE.user.soul !== undefined) delete SAVE.user.soul;
    SAVE.user_research = arr(SAVE.user_research);
    SAVE.all_quests = arr(SAVE.all_quests);
    SAVE.presents = arr(SAVE.presents);
    SAVE.prison = arr(SAVE.prison);
    SAVE.fortsetting = arr(SAVE.fortsetting);
    SAVE.dests = SAVE.dests || {};
    SAVE.dests.revenge = arr(SAVE.dests.revenge);
    SAVE.teams = arr(SAVE.teams);
    SAVE.cl = SAVE.cl || {};
    SAVE.cl.slots = arr(SAVE.cl.slots);
    SAVE.cl.pts = arr(SAVE.cl.pts);
    SAVE.cl.msrs = arr(SAVE.cl.msrs);
    SAVE.cl.bsts = arr(SAVE.cl.bsts);
    SAVE.cl.items = arr(SAVE.cl.items);
    let repaired = 0;
    for (const c of arr(SAVE.soul.chrs)) {
      if (!c.bodylvl) continue;
      const R = fighterRanges(c.type || 'BAL', c.grade != null ? c.grade : 1, c.limit_break || 0);
      const lim = {
        skill: R.skillCap - R.skillBase,
        bag: R.bagCap - R.bagBase
      };
      let changed = false;
      for (const k of [ 'skill', 'bag' ]) if ((c.bodylvl[k] || 0) > lim[k]) {
        c.bodylvl[k] = lim[k];
        changed = true;
      }
      if ((c.rage || 0) > R.rageCap - R.rageBase) {
        c.rage = R.rageCap - R.rageBase;
        changed = true;
      }
      if (changed) {
        recomputeLevel(c);
        repaired++;
      }
    }
    HEALTH_LOAD = { repairedChars: repairedChars, repairedFighters: repaired };
    HEALTH.open = null;
    try { runSaveCheck(); } catch (err) { console.warn('Save check failed:', err); }
    renderAll();
    if (repaired) setTimeout(() => toast(`Fixed decal/bag/rage values on ${repaired} fighter(s) left over from an older editor version`), 2700);
    markChip('chip-save', true);
    toast(`Loaded ${soulSource}`);
  } catch (err) {
    toast('Failed to load save: ' + err.message, true);
  }
});

const NO_BLUEPRINT_PTIDS = new Set([ 'PT_ARM_WP000_001', 'PT_ARM_WP011_0B1', 'PT_ARM_WP001_0B1', 'PT_ARM_WP023_001', 'PT_ARM_WP025_0A4', 'PT_MIL_HEAD_1001', 'PT_MIL_TOPS_1001', 'PT_MIL_BTM_1001', 'PT_MIL_HEAD_1002', 'PT_MIL_TOPS_1002', 'PT_MIL_BTM_1002' ]);

let REAL_BLUEPRINT_SET = null;

function buildRealBlueprintSet() {
  const out = new Set;
  const nextTargets = new Set((AP.pts || []).map(p => p.nextptid).filter(Boolean));
  const ptById = {};
  for (const p of AP.pts || []) ptById[p.id] = p;
  for (const it of AP.items || []) {
    if (it.itemtype !== 'ITTP_RMAP' || !it.itemId.startsWith('ITMP_') || it.itemId.endsWith('U')) continue;
    const ptid = 'PT_' + it.itemId.slice(5);
    const p = ptById[ptid];
    if (!p || !resolveName(p.name)) continue;
    if (nextTargets.has(ptid)) continue;
    if (NO_BLUEPRINT_PTIDS.has(ptid) || BLUEPRINT_BLOCKLIST.has(ptid)) continue;
    out.add(it.itemId);
  }
  return out;
}

function isRealBlueprint(itemId) {
  if (!REAL_BLUEPRINT_SET) REAL_BLUEPRINT_SET = buildRealBlueprintSet();
  return REAL_BLUEPRINT_SET.has(String(itemId).replace(/U$/, ''));
}

function hasNoBlueprint(ptid) {
  return NO_BLUEPRINT_PTIDS.has(ptid) || !isPartObtainable(ptid);
}

function resolveName(nameKey) {
  return nameKey && LOCDAT_INDEX[nameKey] || null;
}

function tryBuildIndices() {
  if (!AP || !Object.keys(LOCDAT_INDEX).length) return;
  PT_INDEX = {};
  ITEM_INDEX = {};
  SKL_INDEX = {};
  MSR_INDEX = {};
  BST_INDEX = {};
  NAME_INDEX = [];
  for (const p of AP.pts || []) {
    const rec = Object.assign({}, p);
    rec.name = resolveName(p.name) || p.id;

    NAME_INDEX.push({
      norm: norm(rec.name),
      name: rec.name,
      id: p.id,
      category: 'pt',

    });
  }
  for (const it of AP.items || []) {
    const rec = Object.assign({}, it);
    let name = resolveName(it.name) || it.itemId;
    if (it.itemId.startsWith('ITMP_') && (!name || name === 'RMAP')) name = it.itemId;
    rec.name = name;
    rec.id = it.itemId;
    rec.category = 'item';
    ITEM_INDEX[it.itemId] = rec;
    if (!it.itemId.startsWith('ITMP_')) NAME_INDEX.push({
      norm: norm(name),
      name: name,
      id: it.itemId,
      category: 'item'
    });
    if (it.itemId.startsWith('ITMP_') && !it.itemId.endsWith('U') && isRealBlueprint(it.itemId)) {
      const ptRec = PT_INDEX[it.itemId.replace(/^ITMP_/, 'PT_')];
      const bpName = ptRec ? ptRec.name : name;
      NAME_INDEX.push({
        norm: norm(bpName),
        name: bpName,
        id: it.itemId,
        category: 'bp'
      });
    }
  }
  for (const s of AP.skls || []) {
    const rec = Object.assign({}, s);
    rec.name = resolveName(s.name) || s.id;
    rec.id = s.id;
    rec.category = 'skl';
    SKL_INDEX[s.id] = rec;
    NAME_INDEX.push({
      norm: norm(rec.name),
      name: rec.name,
      id: s.id,
      category: 'skl'
    });
  }
  for (const m of AP.msrs || []) {
    const rec = Object.assign({}, m);
    rec.name = resolveName(m.c_name) || m.id;
    rec.cookedName = resolveName(m.r_name) || rec.name;
    rec.id = m.id;
    rec.category = 'msr';
    MSR_INDEX[m.id] = rec;
    NAME_INDEX.push({
      norm: norm(rec.name),
      name: rec.name,
      id: m.id,
      category: 'msr'
    });
  }
  for (const b of AP.bsts || []) {
    const rec = Object.assign({}, b);
    rec.name = resolveName(b.name) || b.id;
    rec.cookedName = resolveName(b.bname) || rec.name;
    rec.id = b.id;
    rec.category = 'bst';

    NAME_INDEX.push({
      norm: norm(rec.name),
      name: rec.name,
      id: b.id,
      category: 'bst'
    });
  }
  for (const fa of AP.flrareas || []) {
    if (!FLOOR_NAME_CACHE[fa.flrid]) FLOOR_NAME_CACHE[fa.flrid] = resolveName(fa.name) || fa.flrid;
  }
  toast(`Ready: ${Object.keys(PT_INDEX).length} parts, ${Object.keys(ITEM_INDEX).length} items, ${Object.keys(SKL_INDEX).length} skills, ${Object.keys(MSR_INDEX).length} mushrooms, ${Object.keys(BST_INDEX).length} beasts indexed`);
}

function searchNames(query, category, limit, ptType) {
  const q = norm(query);
  if (!q) return [];
  const ptTypeArr = ptType ? Array.isArray(ptType) ? ptType : [ ptType ] : null;
  const starts = [], contains = [];
  for (const e of NAME_INDEX) {
    if (category && e.category !== category) continue;
    if (ptTypeArr && !ptTypeArr.includes(e.ptType)) continue;
    if (e.norm.startsWith(q)) starts.push(e); else if (e.norm.includes(q)) contains.push(e);
  }
  starts.sort((a, b) => a.name.length - b.name.length);
  contains.sort((a, b) => a.name.length - b.name.length);
  return starts.concat(contains).slice(0, limit || 30);
}

function chainOf(ptid) {
  const allIds = Object.keys(PT_INDEX);
  let root = ptid, guard = 0;
  while (guard++ < 50) {
    const parent = allIds.find(id => PT_INDEX[id].nextptid === root);
    if (!parent) break;
    root = parent;
  }
  const chain = [ root ];
  let cur = root;
  guard = 0;
  while (PT_INDEX[cur] && PT_INDEX[cur].nextptid && guard++ < 50) {
    cur = PT_INDEX[cur].nextptid;
    chain.push(cur);
  }
  return chain;
}

function getConstInt(id, fallback) {
  const row = (AP.constInt || []).find(r => r.id === id);
  return row ? row.value : fallback;
}

function maxPartLevel(rec) {
  return rec ? rec.reflvllmt != null ? rec.reflvllmt : 1 : 0;
}

function precedingPtid(ptid) {
  return (AP.pts || []).find(p => p.nextptid === ptid) || null;
}

function maxDisplayLevel(rec) {
  if (!rec) return 0;
  if (rec.is_limitbreak) {
    const prev = precedingPtid(rec.id);
    const carryover = prev ? Math.max(0, (prev.reflvllmt || 1) - 1) : 0;
    return carryover + (rec.reflvllmt || 0);
  }
  return Math.max(0, (rec.reflvllmt || 1) - 1);
}

function uncapCarry(rec) {
  if (!rec || !rec.is_limitbreak) return 0;
  const prev = precedingPtid(rec.id);
  return prev ? Math.max(0, (prev.reflvllmt || 1) - 1) : 0;
}

function minDisplayLevel(rec) {
  if (!rec) return 0;
  return rec.is_limitbreak ? uncapCarry(rec) + 1 : 0;
}

function displayFromRaw(rec, raw) {
  if (!rec) return raw || 0;
  const r = Math.max(1, Math.min(raw || 1, maxPartLevel(rec) || 1));
  return rec.is_limitbreak ? uncapCarry(rec) + r : r - 1;
}

function rawFromDisplay(rec, disp) {
  if (!rec) return 1;
  const d = Math.max(minDisplayLevel(rec), Math.min(parseInt(disp, 10) || 0, maxDisplayLevel(rec)));
  const raw = rec.is_limitbreak ? d - uncapCarry(rec) : d + 1;
  return Math.max(1, Math.min(raw, maxPartLevel(rec) || 1));
}

function statLevelCapFor(type, grade, lb) {
  const rows = (AP.bodylvlsts || []).filter(r => r.type === type && r.grade === grade && r.limit_break === lb);

}

function rageCapacityFor(type, grade, lb) {
  const row = (AP.bodydetail || []).find(r => r.type === type && r.grade === grade && r.limit_break === lb);

function statLevelFloorFor(type, grade, lb) {
  const rows = (AP.bodylvlsts || []).filter(r => r.type === type && r.grade === grade && r.limit_break === lb);
  return rows.length ? Math.min(...rows.map(r => r.lvl)) : 1;
}

function skillCapFor(type, grade, lb) {
  const rows = (AP.bodylvlsts || []).filter(r => r.type === type && r.grade === grade && r.limit_break === lb);
  return rows.length ? Math.max(...rows.map(r => r.skill)) : 0;
}

function skillFloorFor(type, grade, lb) {
  const rows = (AP.bodylvlsts || []).filter(r => r.type === type && r.grade === grade && r.limit_break === lb);
  return rows.length ? Math.min(...rows.map(r => r.skill)) : 0;
}

function bagCapFor(type, grade, lb) {
  const rows = (AP.bodylvlsts || []).filter(r => r.type === type && r.grade === grade && r.limit_break === lb);
  return rows.length ? Math.max(...rows.map(r => r.bag)) : 0;
}

function bagFloorFor(type, grade, lb) {
  const rows = (AP.bodylvlsts || []).filter(r => r.type === type && r.grade === grade && r.limit_break === lb);
  return rows.length ? Math.min(...rows.map(r => r.bag)) : 0;
}

function derivedStatsAt(type, grade, lb, statLevel) {
  return (AP.bodylvlsts || []).find(r => r.type === type && r.grade === grade && r.limit_break === lb && r.lvl === statLevel) || null;
}

function maxLevelForGrade(grade) {
  const rows = (AP.bodylvlexp || []).filter(r => r.grade === grade);
  return rows.length ? Math.max(...rows.map(r => r.lvl)) : 1;
}

function setStatLevel(chr, level) {
  chr.bodylvl = chr.bodylvl || {};
  for (const k of [ 'hp', 'str', 'dex', 'vit', 'stm', 'luk' ]) chr.bodylvl[k] = level;
}

function bodyDetail(type, grade, lb) {
  return (AP && AP.bodydetail || []).find(r => r.type === type && r.grade === grade && r.limit_break === lb) || null;
}

function skillSlotCount(d) {
  return d && d.skill_slots ? String(d.skill_slots).split(',').filter(s => s.trim() !== '').length : 0;
}

function maxLimitBreakFor(type, grade) {
  const rows = (AP && AP.bodydetail || []).filter(r => r.type === type && r.grade === grade);
  return rows.length ? Math.max(...rows.map(r => r.limit_break)) : 0;
}

function fighterRanges(type, grade, lb) {
  const cur = bodyDetail(type, grade, lb), base = bodyDetail(type, grade, 0);
  const prev = lb > 0 ? bodyDetail(type, grade, lb - 1) : null;
  const statCap = cur ? cur.param_lv_max : statLevelCapFor(type, grade, lb);
  const statFloor = prev ? prev.param_lv_max : 1;
  const skillBase = skillSlotCount(base), skillCap = Math.max(skillSlotCount(cur), skillBase);
  const skillFloor = prev ? Math.max(skillSlotCount(prev), skillBase) : skillBase;
  const bagBase = base ? base.bag_capacity : 0, bagCap = cur ? Math.max(cur.bag_capacity, bagBase) : bagBase;
  const bagFloor = prev ? Math.max(prev.bag_capacity, bagBase) : bagBase;
  const rageBase = base ? base.rage_capacity : rageCapacityFor(type, grade, 0);
  const rageCap = cur ? cur.rage_capacity : rageBase;
  const rageFloor = type === 'SKI' && grade === 6 && lb === 4 && prev ? prev.rage_capacity : rageCap;
  const levelMax = levelFromParts(6 * statCap, skillCap - skillBase, bagCap - bagBase, rageCap - rageBase);
  return {
    statFloor: statFloor,
    statCap: statCap,
    skillBase: skillBase,
    skillFloor: skillFloor,
    skillCap: skillCap,
    bagBase: bagBase,
    bagFloor: bagFloor,
    bagCap: bagCap,
    rageBase: rageBase,
    rageFloor: rageFloor,
    rageCap: rageCap,
    levelMax: levelMax
  };
}

function rageTotalFor(chr, R) {
  return Math.min(Math.max(R.rageBase + (chr.rage || 0), R.rageFloor), R.rageCap);
}

function deathBagCapacity(chr) {
  if (!AP) return 0;
  const R = fighterRanges(chr.type || 'BAL', chr.grade != null ? chr.grade : 1, chr.limit_break || 0);
  const bl = chr.bodylvl || {};
  return Math.min(Math.max(R.bagBase + (bl.bag || 0), R.bagFloor), R.bagCap);
}

// Express Pass (VIP) adds VIP_INCREASE_DEATHBAG (10) Death Bag slots while it is active.
function vipBagBonus() {
  const v = SAVE && SAVE.soul && SAVE.soul.vip;
  if (!v || !Number(v.vip_flag != null ? v.vip_flag : v.flag)) return 0;
  if (Number(v.expired_time) > 0 && Number(v.expired_time) < Math.floor(Date.now() / 1000)) return 0;
  const r = arr(AP && AP.constInt).find(x => x.id === 'VIP_INCREASE_DEATHBAG');
  return r ? Number(r.value) || 0 : 10;
}
function deathBagLimit(chr) { const cap = deathBagCapacity(chr); return cap ? cap + vipBagBonus() : 0; }

function fighterItemCount(chr) {
  return arr(chr.pspts).length + arr(chr.psmsrs).length + arr(chr.psbsts).length + arr(chr.psitems).length;
}

function levelFromParts(statSum, skillBought, bagBought, rageBought) {
  return Math.max(1, statSum - 5 + (skillBought || 0) + (bagBought || 0) + (rageBought || 0));
}

function computedLevel(chr) {
  const bl = chr.bodylvl || {};
  const sum = [ 'hp', 'str', 'dex', 'vit', 'stm', 'luk' ].reduce((a, k) => a + (bl[k] || 1), 0);
  return levelFromParts(sum, bl.skill, bl.bag, chr.rage);
}

function recomputeLevel(chr) {
  chr.bodylvl = chr.bodylvl || {};
  chr.lvl = computedLevel(chr);
  chr.bodylvl.lvl = chr.lvl;
}

function clampStatLevelAndRecalc(chr) {
  const type = chr.type || 'BAL', grade = chr.grade != null ? chr.grade : 1;
  const maxLb = maxLimitBreakFor(type, grade);
  chr.limit_break = Math.min(Math.max(chr.limit_break || 0, 0), maxLb);
  const R = fighterRanges(type, grade, chr.limit_break);
  chr.bodylvl = chr.bodylvl || {};
  for (const k of [ 'hp', 'str', 'dex', 'vit', 'stm', 'luk' ]) {
    chr.bodylvl[k] = Math.min(Math.max(chr.bodylvl[k] || R.statFloor, R.statFloor), R.statCap);
  }
  const skillTotal = Math.min(Math.max(R.skillBase + (chr.bodylvl.skill || 0), R.skillFloor), R.skillCap);
  const bagTotal = Math.min(Math.max(R.bagBase + (chr.bodylvl.bag || 0), R.bagFloor), R.bagCap);
  chr.bodylvl.skill = skillTotal - R.skillBase;
  chr.bodylvl.bag = bagTotal - R.bagBase;
  chr.rage = rageTotalFor(chr, R) - R.rageBase;
  recomputeLevel(chr);
}

}
function applyFighterRecovers(root, rawRoot, mainUid) {
  if (FIGHTER_RECOVERS.root !== rawRoot || !FIGHTER_RECOVERS.cids.size) return;
  const dc = root.diedchara;
  if (!dc || !dc.dchrs) return;
  const list = arr(dc.dchrs[mainUid]);
  const dids = new Set(list.filter(e => FIGHTER_RECOVERS.cids.has(e.cid)).map(e => e.did));
  if (!dids.size) return;
  const keep = list.filter(e => !dids.has(e.did));
  dc.dchrs[mainUid] = keep.length ? keep : {};
  if (dc.bodylvls && Array.isArray(dc.bodylvls[mainUid])) dc.bodylvls[mainUid] = dc.bodylvls[mainUid].filter(b => !dids.has(b.did));

// Freezer level = number of hangers (soul.chr.slots[uid]); a level-1 save has
// 3 hangers, maxed saves have 10 (master_freezer: level -> count). Raising the
// level appends empty hangers {uid, slot, cid: ""}; lowering is only allowed
// when the hangers being removed are empty.
function setFreezerLevel(level) {
  const rows = arr(AP && AP.freezer);
  const row = rows.find(r => r.number === level);
  if (!row) return 'Unknown freezer level';
  const slots = SAVE.soul.chrslots = arr(SAVE.soul.chrslots);
  const uid = Number(RAW_SAV_MAIN_UID);
  if (row.count > slots.length) {
    for (let i = slots.length; i < row.count; i++) slots.push({ uid, slot: i, cid: '' });
    return null;
  }
  if (row.count < slots.length) {
    const removed = slots.slice(row.count);
    if (removed.some(s => s && s.cid)) return `Hangers ${row.count + 1}-${slots.length} aren't empty, so the freezer can't go down to level ${level}.`;
    slots.length = row.count;
  }
  return null;
}

function realFreezerInfo() {
  const n = arr(SAVE && SAVE.soul && SAVE.soul.chrslots).length;
  const row = arr(AP && AP.freezer).find(r => r.count === n);
  const max = Math.max(0, ...arr(AP && AP.freezer).map(r => r.count));

function brokenFighters() {

function combatStatsFor(chr, type, grade) {
  const bl = chr.bodylvl || {};
  const parts = [];
  for (const [k, label] of [ [ 'hp', 'HP' ], [ 'stm', 'STM' ], [ 'str', 'STR' ], [ 'dex', 'DEX' ], [ 'vit', 'VIT' ], [ 'luk', 'LUK' ] ]) {
    const row = (AP.bodylvlsts || []).find(r => r.type === type && r.grade === grade && r.lvl === (bl[k] || 1));
    if (row && row[k] != null) parts.push(`${label} ${Number(row[k]).toLocaleString()}`);
  }
  return parts.length ? parts.join(' · ') : '';
}

function fighterInventoryRows(chr) {
  const rows = [];
  const equippedEptids = new Set(arr(chr.eqpts).map(e => e.eptid).concat(Object.values(chr.armslots || {})));

// ---- Equipped gear editing -------------------------------------------------
// From real saves: every weapon a fighter has in a quick slot has arm_slot
// 0-2 (right hand) or 3-5 (left hand) on its death bag entry; the one being
// held in each hand also has site EQSITE_ARMR / EQSITE_ARML. Armor has site
// EQSITE_HEAD / BODY / LEGS and arm_slot -1. chr.select_arm_slots is
// "right,left" (the quick slot index 0-2 held in each hand; "" = never
// changed). The site entries are what decides what's held.
const HAND_SITES = [ { site: 'EQSITE_ARMR', label: 'Right hand', base: 0, sel: 0 }, { site: 'EQSITE_ARML', label: 'Left hand', base: 3, sel: 1 } ];
function ptTypeOk(slot, rec) {
  const t = Array.isArray(slot.ptType) ? slot.ptType : [ slot.ptType ];
  return !!rec && t.includes(rec.type);
}
function gearLabel(p) {
  const rec = PT_INDEX[p.ptid];
  if (!rec) return p.ptid;
  const pct = durabilityPct(p, rec);
  return `${rec.name} +${displayFromRaw(rec, p.lvl)}${pct != null ? ` (${pct}%)` : ''}`;
}
function heldIndex(chr, hand) {
  const eq = arr(chr.eqpts).find(e => e.site === hand.site);
  if (eq && chr.armslots) for (let i = 0; i < 3; i++) if (chr.armslots[hand.base + i] === eq.eptid) return i;
  const sel = String(chr.select_arm_slots || '').split(',').map(n => parseInt(n, 10));
  const v = sel[hand.sel];
  return v >= 0 && v <= 2 ? v : 0;
}
function syncHeldWeapons(chr, held) {
  chr.eqpts = arr(chr.eqpts).filter(e => e.site !== 'EQSITE_ARMR' && e.site !== 'EQSITE_ARML');
  for (const hand of HAND_SITES) {
    const eid = chr.armslots[hand.base + held[hand.sel]];
    if (eid) chr.eqpts.push({ site: hand.site, eptid: eid, arm_slot: hand.base + held[hand.sel] });
  }
}
// What a fighter is allowed to equip. The game only lets a fighter equip a
// part in its own slot type, and only when the fighter's stat meets the
// part's requirement (master_part.lvllmttp / lvllmt, e.g. STR 100, raised for
// upgraded parts, see gearRequirement). The stat
// value is master_bodylvl_status_value for the fighter's class, grade and
// stat level. Checked against every weapon/armor fighters wear in the sample
// saves (379 of 381 pass; the 2 exceptions were an edited save). Hand items
// that aren't real weapons (first aid, food, sand), the "no mask / pants"
// placeholders, gas masks and broken parts are never offered.
const GEAR_SITE_TYPES = { EQSITE_ARMR: [ 'PTTP_ARM' ], EQSITE_ARML: [ 'PTTP_ARM' ], EQSITE_HEAD: [ 'PTTP_HEAD' ], EQSITE_BODY: [ 'PTTP_BODY' ], EQSITE_LEGS: [ 'PTTP_LEGS' ] };
const GEAR_NEVER = /^PT_(ARM_(FirstAid|Food|Sand)$|NONE_|GAS_|MASK_|PANTS_)/;
function fighterStatValue(chr, stat) {
  const k = String(stat || '').toLowerCase();
  const lvl = (chr.bodylvl || {})[k] || 1;
  const type = chr.type || 'BAL', grade = chr.grade != null ? chr.grade : 1;
  const row = (AP && AP.bodylvlsts || []).find(r => r.type === type && r.grade === grade && r.lvl === lvl);
  return row && row[k] != null ? Number(row[k]) : null;
}
// Requirement grows with the part's upgrade level: lvllmt × lvllmt_c^(lvl − 1)
// (lvllmt_c is 1.01-1.02). Confirmed by the user in game; the saves rule out
// scaling from lvl 0 (a +0 part at exactly its base requirement is worn).
function gearRequirement(rec, lvl) {
  const base = Number(rec.lvllmt) || 0, c = Number(rec.lvllmt_c) || 1;
  return base * Math.pow(c, Math.max(1, Number(lvl) || 1) - 1);
}
// Decals that lower equip requirements (master_skill type + value, text from
// the game's own decal descriptions):
//   SKLTP_DISCOUNT_<STAT>      "Halves the <STAT> necessary to equip"   val0 = 50 (%)
//   SKLTP_DISCOUNT_ALL         "All stat requirements … become #0%"      val0 = 80
//   SKLTP_DISCOUNT_ALL_NMH     JEANE: "all equip requirements to #0%"    val0 = 90
//   SKLTP_DISALL_ATKUP_HPDWN   "all stats required … become #1%"         val1 = 80
// How they combine, from the user's in-game numbers for a KAMAS-A1 Assault
// Rifle RE +4 (DEX 27 with no decals):
//   Dexterity Discount alone → 13, both Dexterity Discounts → 0,
//   Everything's On Sale alone → 21, One Way Ticket alone → 21,
//   one Dexterity Discount + Everything's On Sale + One Way Ticket → 2.
// Every equipped decal's reduction ADDS (50 + 50 = 100% off → 0;
// 50 + 20 + 20 = 90% off → 2.7), never below 0, and the requirement is
// rounded down. Only decals equipped on the fighter count.
function gearDiscountPct(chr, stat) {
  const st = String(stat || '').toUpperCase();
  let off = 0;
  for (const e of arr(chr.eqskls)) {
    const rec = SKL_INDEX[e.id || e.sklid];
    if (!rec) continue;
    let v = null;
    if (rec.type === 'SKLTP_DISCOUNT_' + st) v = rec.val0;
    else if (rec.type === 'SKLTP_DISCOUNT_ALL' || rec.type === 'SKLTP_DISCOUNT_ALL_NMH') v = rec.val0;
    else if (rec.type === 'SKLTP_DISALL_ATKUP_HPDWN') v = rec.val1;
    v = Number(v);
    if (v > 0 && v < 100) off += 100 - v;
  }
  return Math.max(0, 100 - off);
}
function gearProblem(chr, p, site) {
  const rec = p && PT_INDEX[p.ptid];
  if (!rec) return "unknown part (not in this masters.db)";
  if (!(GEAR_SITE_TYPES[site] || []).includes(rec.type)) return "wrong slot for this part";
  if (GEAR_NEVER.test(rec.id) || Number(rec.is_consume) === 1) return "not equippable";
  if (p.dur != null && Number(p.dur) <= 0) return "broken";
  const stat = rec.lvllmttp, pct = stat ? gearDiscountPct(chr, stat) : 100;
  // the game shows (and checks) the requirement rounded down
  const need = Math.floor(gearRequirement(rec, p.lvl) * pct / 100 + 1e-9);
  if (stat && need > 0) {
    const have = fighterStatValue(chr, stat);
    const note = pct < 100 ? ` with decals (${100 - pct}% off)` : '';
    if (have == null) return `needs ${stat} ${need}${note} (couldn't read this fighter's ${stat})`;
    if (have < need) return `needs ${stat} ${need}${note}, has ${have}`;
  }
  return null;
}
function gearProblems(chr) {
  const out = [];
  const byEid = {};
  for (const p of arr(chr.pspts)) byEid[p.eptid] = p;
  for (const e of arr(chr.eqpts)) {
    const why = gearProblem(chr, byEid[e.eptid], e.site);
    if (why) out.push({ eid: e.eptid, site: e.site, why });
  }
  for (const [k, eid] of Object.entries(chr.armslots || {})) {
    if (!eid || arr(chr.eqpts).some(e => e.eptid === eid)) continue;
    const why = gearProblem(chr, byEid[eid], Number(k) < 3 ? 'EQSITE_ARMR' : 'EQSITE_ARML');
    if (why) out.push({ eid, site: '', slot: Number(k), why });
  }
  return out;
}
function unequipProblemGear(chr) {
  const bad = gearProblems(chr);
  for (const b of bad) {
    for (const k of Object.keys(chr.armslots || {})) if (chr.armslots[k] === b.eid) delete chr.armslots[k];
    chr.eqpts = arr(chr.eqpts).filter(e => e.eptid !== b.eid);
  }
  return bad.length;
}
function setWeaponSlot(chr, armSlot, eptid) {
  if (eptid) {
    const p = arr(chr.pspts).find(x => x.eptid === eptid);
    const why = gearProblem(chr, p, armSlot < 3 ? 'EQSITE_ARMR' : 'EQSITE_ARML');
    if (why) { toast(`Can't equip that: ${why}`, true); return false; }
  }
  chr.armslots = chr.armslots || {};
  const held = HAND_SITES.map(h => heldIndex(chr, h));
  for (const k of Object.keys(chr.armslots)) if (chr.armslots[k] === eptid) delete chr.armslots[k];
  if (eptid) chr.armslots[armSlot] = eptid; else delete chr.armslots[armSlot];
  syncHeldWeapons(chr, held);
}
function setHeldSlot(chr, handIdx, idx) {
  chr.armslots = chr.armslots || {};
  const held = HAND_SITES.map(h => heldIndex(chr, h));
  held[handIdx] = idx;
  chr.select_arm_slots = `${held[0]},${held[1]}`;
  syncHeldWeapons(chr, held);
}
function setArmor(chr, site, eptid) {
  if (eptid) {
    const why = gearProblem(chr, arr(chr.pspts).find(x => x.eptid === eptid), site);
    if (why) { toast(`Can't equip that: ${why}`, true); return false; }
  }
  chr.eqpts = arr(chr.eqpts).filter(e => e.site !== site && e.eptid !== eptid);
  if (eptid) chr.eqpts.push({ site, eptid, arm_slot: -1 });
}
function equipEditor(chr) {
  if (!chr.armslots) chr.armslots = {};
  const weapons = arr(chr.pspts).filter(p => (PT_INDEX[p.ptid] || {}).type === 'PTTP_ARM');
  const sel = (cur, list, attr, site) => `<select ${attr} style="width:100%; background:var(--bg); border:1px solid ${cur && gearProblem(chr, list.find(p => p.eptid === cur), site) ? 'var(--bad, #c33)' : 'var(--panel-border)'}; color:var(--text); padding:5px 6px; font-family:var(--mono); font-size:11.5px;">
      <option value="">— empty —</option>${list.map(p => { const why = gearProblem(chr, p, site); return `<option value="${escapeHtml(p.eptid)}" ${p.eptid === cur ? 'selected' : ''} ${why && p.eptid !== cur ? 'disabled' : ''}>${escapeHtml(gearLabel(p))}${why ? ` — ✕ ${escapeHtml(why)}` : ''}</option>`; }).join('')}</select>`;
  let h = '<div class="grid" style="margin-bottom:6px; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));">';
  HAND_SITES.forEach((hand, hi) => {
    const held = heldIndex(chr, hand);
    h += `<div class="field"><label>${hand.label} (weapon slots)</label>`;
    for (let i = 0; i < 3; i++) {
      const as = hand.base + i;
      h += `<div style="display:flex; gap:6px; align-items:center; margin-bottom:4px;">
        <label style="display:flex; align-items:center; gap:3px; font-size:11px; white-space:nowrap; text-transform:none; letter-spacing:0;" title="The weapon held in this hand"><input type="radio" name="held-${hi}" data-eq-held="${hi}:${i}" ${held === i ? 'checked' : ''}> in hand</label>
        ${sel(chr.armslots[as] || '', weapons, `data-eq-arm="${as}"`, hand.site)}</div>`;
    }
    h += '</div>';
  });
  h += '</div><div class="grid" style="margin-bottom:6px; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));">';
  for (const slot of SLOT_TYPES.filter(s => s.site !== 'EQSITE_ARMR' && s.site !== 'EQSITE_ARML')) {

  }

  return h;
}

function fullRecordFor(entry) {
  if (!entry) return entry;
  if (entry.category === 'bp') {
    const full = ITEM_INDEX[entry.id];
    return full ? Object.assign({}, full, {
      name: entry.name
    }) : entry;
  }
  const idx = entry.category === 'pt' ? PT_INDEX : entry.category === 'item' ? ITEM_INDEX : entry.category === 'skl' ? SKL_INDEX : entry.category === 'msr' ? MSR_INDEX : entry.category === 'bst' ? BST_INDEX : null;
  return idx && idx[entry.id] || entry;
}

function wireAutocomplete(input, dropEl, category, onPick, ptType) {
  let hiIdx = -1, results = [];
  function show(list) {
    results = list;
    hiIdx = -1;
    dropEl.innerHTML = list.map((r, i) => `<div class="acitem" data-i="${i}"><span>${escapeHtml(r.name)}${r.category === 'pt' && PT_INDEX[r.id] && PT_INDEX[r.id].is_limitbreak ? ' <span class="badge lb" style="margin-left:4px;">Uncap</span>' : ''}</span><span class="id">${r.id}</span></div>`).join('');
    dropEl.classList.toggle('open', list.length > 0);
  }
  input.addEventListener('input', () => show(searchNames(input.value, category, 30, ptType)));
  input.addEventListener('focus', () => {
    if (input.value) show(searchNames(input.value, category, 30, ptType));
  });
  input.addEventListener('blur', () => setTimeout(() => dropEl.classList.remove('open'), 150));
  input.addEventListener('keydown', e => {
    if (!dropEl.classList.contains('open')) return;
    if (e.key === 'ArrowDown') {
      hiIdx = Math.min(hiIdx + 1, results.length - 1);
      highlight();
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      hiIdx = Math.max(hiIdx - 1, 0);
      highlight();
      e.preventDefault();
    } else if (e.key === 'Enter' && hiIdx >= 0) {
      pick(results[hiIdx]);
      e.preventDefault();
    } else if (e.key === 'Escape') {
      dropEl.classList.remove('open');
    }
  });
  function highlight() {
    dropEl.querySelectorAll('.acitem').forEach((el, i) => el.classList.toggle('hi', i === hiIdx));
  }
  function pick(rec) {
    onPick(fullRecordFor(rec));
    dropEl.classList.remove('open');
  }
  dropEl.addEventListener('mousedown', e => {
    const item = e.target.closest('.acitem');
    if (!item) return;
    pick(results[parseInt(item.dataset.i, 10)]);
  });
}

let OBTAINABLE_SET = null;

function buildObtainableSet() {
  const blueprintIds = new Set((AP.items || []).filter(it => it.itemtype === 'ITTP_RMAP').map(it => it.itemId));
  const nextptidTargets = new Set((AP.pts || []).map(p => p.nextptid).filter(Boolean));
  const obtainable = new Set;
  for (const p of AP.pts || []) {
    const hasBlueprint = blueprintIds.has('ITMP_' + p.id.slice(3));
    const reachableByUpgrade = nextptidTargets.has(p.id);
    const hasName = !!resolveName(p.name);
    if ((hasBlueprint || reachableByUpgrade) && hasName) obtainable.add(p.id);
  }
  return obtainable;
}

function isPartObtainable(ptid) {
  if (!OBTAINABLE_SET) OBTAINABLE_SET = buildObtainableSet();
  return OBTAINABLE_SET.has(ptid);
}

const RESEARCH_BLOCKLIST = new Set([ 'PT_ARM_WP023_001' ]);

let ALLOWED_RESEARCH_SET = null;

function buildAllowedResearchSet() {
  const blueprintIds = new Set((AP.items || []).filter(it => it.itemtype === 'ITTP_RMAP').map(it => it.itemId));
  const nextptidTargets = new Set((AP.pts || []).map(p => p.nextptid).filter(Boolean));
  const researchable = new Set((AP.partresearch || []).map(r => r.ptid));
  const out = new Set;
  for (const p of AP.pts || []) {
    if (!researchable.has(p.id)) continue;
    if (p.platform === 1 || RESEARCH_BLOCKLIST.has(p.id)) continue;
    if (!(blueprintIds.has('ITMP_' + p.id.slice(3)) || nextptidTargets.has(p.id))) continue;
    out.add(p.id);
  }
  return out;
}

function isResearchAllowed(ptid) {
